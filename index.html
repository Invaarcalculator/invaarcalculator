<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invaarcalculator</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf2;color:#202634;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100% - 32px,402px);margin:auto;padding:18px 0 14px;text-align:center}header{display:flex;justify-content:space-between;color:#a45006;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.status{color:#9a3412}.status:before{content:"●";padding-right:4px;color:#f59e0b}h1{margin:36px 0 0;font-size:29px;line-height:1.05;letter-spacing:-.045em}h1 span{color:#dd8208}.intro{margin:11px auto;color:#637083;font-size:14px;line-height:1.4}.basic{display:block;padding:11px;border-radius:9px;background:#fff0d1;color:#9a5007;font-size:14px;font-weight:800;text-decoration:none}section{margin-top:13px;padding:15px;border:1px solid #f0e4d1;border-radius:16px;background:#fff;box-shadow:0 8px 25px #9a610b12;text-align:left}h2{margin:0;font-size:18px}section>p{margin:5px 0 11px;color:#637083;font-size:12px}form{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:11px;font-weight:700}input{width:100%;margin-top:4px;border:1px solid #dce0e7;border-radius:7px;padding:8px;font:inherit;font-size:13px}button{grid-column:1/-1;border:0;border-radius:8px;padding:10px;background:#f39208;color:#fff;font:inherit;font-size:13px;font-weight:800}.note{grid-column:1/-1;margin:0;color:#8a96a7;font-size:10px;text-align:center}footer{margin-top:13px;color:#8490a1;font-size:10px}footer a{color:inherit;text-decoration:none}.dot{padding:0 5px;color:#c7cdd6}@media(max-height:780px){main{padding-top:10px}h1{margin-top:20px}.intro{margin:7px auto}.basic{padding:8px}section{margin-top:8px;padding:11px}section>p{margin:3px 0 7px}input{padding:6px}button{padding:8px}footer{margin-top:7px}}</style></head>
<body><main><header><span>Invaarcalculator</span><span class="status">Tijdelijk offline</span></header><h1>Basic-calculator is <span>beschikbaar.</span></h1><p class="intro">De overige calculators zijn tijdelijk offline.</p><a class="basic" href="basic.html">Open de Basic-calculator →</a><section><h2>Toegang aanvragen</h2><p>Voor toegang tot de overige calculators.</p><form id="access"><label>Naam<input id="name" required></label><label>E-mailadres<input id="email" type="email" required></label><button>Aanvraag voorbereiden</button><p class="note">Opent uw e-mailprogramma.</p></form></section><footer><a href="https://innovation-nestor.godaddysites.com/">Innovation Nestor</a><span class="dot">·</span><a href="mailto:hans@invaarcalculator.nl">Contact</a><span class="dot">·</span><a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></footer></main><script>document.getElementById('access').onsubmit=e=>{e.preventDefault();location.href='mailto:hans@invaarcalculator.nl?subject='+encodeURIComponent('Toegang aanvragen Invaarcalculator')+'&body='+encodeURIComponent('Hallo Hans,\n\nIk wil graag toegang aanvragen tot de Invaarcalculator.\n\nNaam: '+name.value.trim()+'\nE-mailadres: '+email.value.trim())}</script></body></html>
