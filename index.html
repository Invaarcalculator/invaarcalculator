<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invaarcalculator</title>
  <style>
    :root { --orange: #e88600; --dark: #20273a; --muted: #66738a; --line: #eadfcd; --cream: #fffbf4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 40px, 420px); margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom)); }
    .top { display: flex; justify-content: space-between; align-items: center; color: #a75709; font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .offline { display: flex; align-items: center; gap: 6px; color: #9b3d17; }
    .offline::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .hero { padding: 42px 0 28px; }
    .eyebrow { margin: 0 0 12px; color: var(--orange); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { max-width: 330px; margin: 0; font-size: clamp(2.25rem, 10.5vw, 3rem); line-height: .99; letter-spacing: -.065em; }
    h1 strong { color: var(--orange); font-weight: 800; }
    .intro { max-width: 335px; margin: 18px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
    .actions { display: grid; gap: 10px; }
    .button { display: flex; align-items: center; justify-content: space-between; min-height: 55px; padding: 0 18px; border-radius: 12px; color: #9b5106; font-size: 16px; font-weight: 800; text-decoration: none; }
    .primary { background: #fff0d2; }
    .secondary { border: 1px solid var(--line); background: #fff; }
    .button b { font-size: 22px; font-weight: 500; }
    footer { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 25px; color: #8993a2; font-size: 11px; }
    footer a { color: inherit; text-decoration: none; }
    .dot { color: #cbd1d8; }
    @media (max-height: 720px) { main { padding-top: 18px; } .hero { padding: 27px 0 18px; } .intro { margin-top: 13px; } footer { margin-top: 16px; } }
  </style>
</head>
<body>
  <main>
    <header class="top"><span>Invaarcalculator</span><span class="offline">Tijdelijk offline</span></header>
    <section class="hero">
      <p class="eyebrow">Calculator beschikbaar</p>
      <h1>De Basic-calculator is <strong>online.</strong></h1>
      <p class="intro">De overige calculators zijn tijdelijk offline. Neem contact op als u toegang wilt aanvragen.</p>
    </section>
    <nav class="actions" aria-label="Acties">
      <a class="button primary" href="basic.html"><span>Open Basic-calculator</span><b aria-hidden="true">→</b></a>
      <a class="button secondary" href="mailto:hans@invaarcalculator.nl?subject=Toegang%20verzoek&amp;cc="><span>Neem contact op</span><b aria-hidden="true">→</b></a>
    </nav>
    <footer><a href="https://innovation-nestor.godaddysites.com/">Innovation Nestor</a><span class="dot">·</span><a href="mailto:hans@invaarcalculator.nl?subject=Toegang%20verzoek&amp;cc=">Contact</a><span class="dot">·</span><a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></footer>
  </main>
</body>
</html>
