  /* ------------------------------------------------------ vergelijking */


  /**
   * Eén regel van de vergelijking: brief, eigen uitkomst, verschil.
   *
   * Geen oordeelkolom. Er is geen vastgestelde grens voor wat een aanvaardbaar
   * verschil is, en een zelfbedachte zou een fout kunnen verbergen of er een
   * suggereren die er niet is. Het verschil staat er in euro's én relatief;
   * wat dat betekent, beoordeelt de lezer.
   */
  function controleRij(label, brief, eigen, soort) {
    if (brief === null || brief === undefined || !isFinite(brief) || brief <= 0) {
      return {
        html: '<tr><th scope="row">' + esc(label) + '</th>' +
          '<td data-k="uit uw brief"><span class="leeg">niet ingevuld</span></td>' +
          '<td data-k="deze calculator">' + eur(eigen) + '</td>' +
          '<td data-k="verschil">—</td></tr>',
        ingevuld: false
      };
    }
    var verschil = eigen - brief;
    var afwijking = brief === 0 ? 0 : verschil / brief;
    return {
      html: '<tr><th scope="row">' + esc(label) + '</th>' +
        '<td data-k="uit uw brief">' + eur(brief) + '</td>' +
        '<td data-k="deze calculator">' + eur(eigen) + '</td>' +
        '<td data-k="verschil">' + eurGetekend(verschil) +
        '<span class="rap-hint">' + pctGetekend(afwijking) + '</span></td></tr>',
      ingevuld: true
    };
  }

  /**
   * Welk bedrag uit de brief hoort bij welke regel van de kern.
   *
   * De labels komen uit `rapportage.v4.ts`, sectie 5. Kent de kern een regel
   * die de brief niet heeft, dan geeft dit `undefined` en valt die regel uit
   * de vergelijking; hernoemt de kern een regel, dan verdwijnt hij zichtbaar
   * uit de tabel in plaats van stil verkeerd vergeleken te worden.
   */
  function briefWaardeVoor(label) {
    if (label === 'Ouderdomspensioen' ||
        label === 'Ouderdomspensioen tot de knipdatum') return briefSom('bruto');
    if (label === 'Ouderdomspensioen vanaf de knipdatum') return briefSom('laag');
    if (label === 'Partnerpensioen') return briefSom('np');
    if (label === 'AOW-compensatiepensioen') return v.briefAowJaar;
    if (label === 'Totaal dat u ontvangt') {
      var op = briefSom('bruto');
      if (op === null && v.briefAowJaar === null) return null;
      return (op || 0) + (v.briefAowJaar || 0);
    }
    return undefined;
  }

  /**
   * De vergelijkingsregels: wat de brief zegt naast wat de kern uitrekent.
   *
   * De eigen bedragen worden niet hier berekend maar uit het rapport van de
   * kern gelezen — dezelfde regels die op stap 4 staan. `naarGetal()` leest
   * "€ 24.000" terug naar 24000. Zo loopt er geen tweede berekening naast de
   * eerste, en komen de rijen vanzelf overeen met wat de deelnemer al zag.
   */
  /** Sectie 5 van het rapport: per pensioen "Nu", "Na invaren", "Verhoging". */
  function pensioenTabel(sc) {
    var tabel = null;
    K.rapportWeergaveV4(sc.gebruikteGegevens).blokken.forEach(function (b) {
      if (b.soort === 'kolomtabel' && b.kolommen && b.kolommen[1] === 'Nu') tabel = b;
    });
    return tabel;
  }

  /**
   * Wat deze calculator per pensioensoort uitrekent voor ná het invaren.
   *
   * Dezelfde bron als de vergelijking op stap 6, zodat stap 5 en stap 6 niet
   * uit elkaar kunnen lopen. Kent de kern een label niet meer, dan ontbreekt
   * die soort hier en blijft het veld leeg: zichtbaar, niet stil verkeerd.
   */
  function naInvaren(sc) {
    var tabel = pensioenTabel(sc), uit = {};
    if (!tabel) return uit;
    tabel.rijen.forEach(function (r) {
      var w = naarGetal(r.waarden[1]);
      if (r.label === 'Ouderdomspensioen' ||
          r.label === 'Ouderdomspensioen tot de knipdatum') uit.bruto = w;
      if (r.label === 'Ouderdomspensioen vanaf de knipdatum') uit.laag = w;
      if (r.label === 'Partnerpensioen') uit.np = w;
      if (r.label === 'AOW-compensatiepensioen') uit.aow = w;
    });
    return uit;
  }

  /**
   * Eén uitkomst toerekenen aan de UPO-regels.
   *
   * De kern telt de UPO's op stap 2 op en rekent met één bedrag; er ís dus
   * geen uitkomst per UPO. Naar rato toerekenen mag wel: de verhoging is één
   * percentage over het hele ouderdoms- en nabestaandenpensioen, dus elk UPO
   * krijgt hetzelfde percentage. Gemeten met de kern: € 24.000 in één keer
   * geeft factor 1,279375, en € 10.000 en € 14.000 los geven 1,27940 en
   * 1,279357 — gelijk op de afronding op hele euro's na.
   *
   * Elk deel wordt daarom op zichzelf afgerond. Twee gelijke bedragen krijgen
   * zo hetzelfde getal onder zich, wat bij een vorige versie niet zo was: daar
   * ging het afrondingsrestje naar het grootste deel, waardoor drie gelijke
   * UPO's van € 100.000 er als 129.229 / 129.230 / 129.230 onder kregen en het
   * scherm een fout leek te maken. De prijs is dat de delen samen een euro of
   * twee van het geheel kunnen schelen. Dat is hier onschadelijk: deze getallen
   * staan er ter oriëntatie en gaan de berekening niet in. Wat de lezer uit de
   * brief overtypt, wordt op stap 6 opgeteld en met het geheel vergeleken.
   */
  function verdeelOverUpo(totaal, delen) {
    var leeg = delen.map(function () { return null; });
    if (totaal === null || !isFinite(totaal)) return leeg;
    var som = 0;
    delen.forEach(function (d) { if (d) som += d; });
    if (!som) return leeg;
    return delen.map(function (d) {
      return (d === null || d === undefined) ? null : Math.round(d / som * totaal);
    });
  }

  function vergelijkingsRegels(sc) {
    var tabel = pensioenTabel(sc);
    if (!tabel) return [];
    var uit = [];
    tabel.rijen.forEach(function (r) {
      var brief = briefWaardeVoor(r.label);
      if (brief === undefined) return;
      uit.push(controleRij(r.label, brief, naarGetal(r.waarden[1]), 'euro'));
    });
    return uit;
  }

  /**
   * De band van ±2,5 procentpunt komt uit de gevoeligheidsmatrix van de kern.
   *
   * Let op het verschil met de rij "Verhoging" hierboven. Die is
   * `verhouding − 1`: de verhoging van het pensioenkapitaal. De matrix rekent
   * met `basisJaar` en `naJaar`, en die tellen een AOW-compensatiepensioen mee,
   * dat zijn eigen verhoging krijgt. Zonder AOW-compensatie zijn beide gelijk
   * op afronding na; mét AOW-compensatie lopen ze uiteen. Daarom zegt de kop
   * van de rij wat er staat, en staat de afwijking er met zoveel woorden bij.
   */
  function dekkingsgraadBand(sc, heeftAow) {
    if (!sc.tabel) {
      return '<p class="noot">Bij een netto maandbedrag berekent de kern de gevoeligheidstabel niet. ' +
        'De bandbreedte rond de dekkingsgraad is daarom niet beschikbaar.</p>';
    }
    var t = sc.tabel, rij = 1;
    var cellen = t.kolommen.map(function (k, kol) {
      var c = t.cellen[rij][kol];
      return '<td' + (k.gekozen ? ' class="gekozen"' : '') +
        ' data-k="dekkingsgraad ' + esc(pct(k.dekkingsgraad)) + '">' +
        (c && c.beschikbaar && c.pct !== null ? pctGetekend(c.pct) : '—') + '</td>';
    }).join('');
    var kop = t.kolommen.map(function (k) {
      return '<th scope="col"' + (k.gekozen ? ' class="gekozen"' : '') + '>' + pct(k.dekkingsgraad) +
        (k.gekozen ? '<span class="sr-only"> (uit uw brief)</span>' : '') + '</th>';
    }).join('');
    var rijkop = heeftAow ? 'Verhoging van het totaal' : 'Verhoging';
    var aowAfwijking = heeftAow
      ? '<p class="noot">Deze rij telt uw AOW-compensatiepensioen mee, dat een eigen verhoging ' +
        'krijgt. Daardoor wijkt het middelste getal iets af van de verhoging in de tabel hierboven: ' +
        'die gaat alleen over uw pensioenkapitaal. Vergelijk de drie getallen hier dus met elkaar, ' +
        'niet met de rij hierboven.</p>'
      : '';
    return '<h3 class="rap-kop">Wat een andere dekkingsgraad doet met deze berekening</h3>' +
      '<p class="kaart-intro">Ligt de dekkingsgraad op de invaardatum 2,5 procentpunt hoger of ' +
      'lager dan in uw brief, dan komt deze calculator op:</p>' +
      '<div class="tabel-wrap"><table class="data stapel">' +
      '<caption>Berekende verhoging bij een andere dekkingsgraad</caption>' +
      '<thead><tr><th scope="col">Dekkingsgraad</th>' + kop + '</tr></thead>' +
      '<tbody><tr><th scope="row">' + esc(rijkop) + '</th>' + cellen + '</tr></tbody></table></div>' +
      aowAfwijking +
      '<p class="noot">Dit is het effect van de dekkingsgraad op de verhoging die ' +
      '<strong>deze calculator</strong> berekent. Wat ' + esc(K.CONFIG.shortLabel) + ' bij een ' +
      'andere dekkingsgraad uitrekent, kan daarvan afwijken.</p>';
  }

  /**
   * Scherm: de vergelijking.
   *
   * Puur naast elkaar: wat de brief zegt, wat deze calculator uitrekent, en
   * het verschil. Geen oordeel, geen advies, geen marge — de calculator heet
   * InvaarVergelijker en doet precies dat. Of een verschil groot genoeg is om
   * na te vragen, beslist de lezer; daar bestaat geen vastgestelde grens voor
   * en een zelfbedachte zou een fout kunnen verbergen of er een suggereren.
   */
  function schermControle() {
    var r = v.resultaat, sc = huidigScenario();
    if (!r || !sc) {
      return '<h2 id="staptitel" tabindex="-1">De vergelijking</h2>' + foutenBlok() +
        '<p>Er is nog geen vergelijking beschikbaar.</p>';
    }
    var rijen = vergelijkingsRegels(sc);
    var aowU = sc.tussenresultaten.aowUitkomst;
    rijen.push(controleRij('Pensioenkapitaal n\u00e1 invaren', v.briefKapitaal,
      sc.pensioenkapitaalNaInvaren + (aowU ? aowU.ppk : 0), 'euro'));

    var meldingen = r.meldingen.map(function (m) {
      return MELDINGTEKST[m.code] ? '<p class="noot">' + esc(MELDINGTEKST[m.code]) + '</p>' : '';
    }).join('');

    /* De omschrijving zegt wat er in de kolommen staat en waar elke kolom
       vandaan komt: links overgetypt uit de persoonlijke berekening, rechts
       uit de UPO-bedragen van stap 2 doorgerekend. Zo weet de lezer wat hij
       vergelijkt zonder de methode te hoeven kennen. De dekkingsgraad en de
       invaardatum stonden eerst op een eigen regel; ze horen hier, want ze
       gelden voor de rechterkolom. */
    return '<div class="res-kop"><h2 id="staptitel" tabindex="-1">De vergelijking</h2></div>' +
      '<p class="kaart-intro">Links staat wat ' + esc(K.CONFIG.shortLabel) + ' u in de ' +
      'persoonlijke berekening van november 2026 schrijft; dat hebt u bij stap 5 ' +
      'overgenomen. Rechts staat wat deze calculator zelf uitrekent: uw pensioen van nu, ' +
      'doorgerekend naar ' + datumNl(K.CONFIG.invaardatum) + ' bij een dekkingsgraad van ' +
      esc(dgTekst() || '\u2014') + '. De laatste kolom is het verschil tussen die twee.</p>' +
      '<div class="tabel-wrap"><table class="data stapel ctrl-tabel">' +
      '<caption>Uw pensioen n\u00e1 het invaren</caption>' +
      '<thead><tr><th scope="col">&nbsp;</th><th scope="col">Uit uw brief</th>' +
      '<th scope="col">Deze calculator</th><th scope="col">Verschil</th>' +
      '</tr></thead><tbody>' +
      rijen.map(function (x) { return x.html; }).join('') +
      '</tbody></table></div>' +
      meldingen +
      '<p class="rap-voetnoot">Dit is een indicatieve berekening. Aan de uitkomsten kunt u ' +
      'geen rechten ontlenen.</p>';
  }

  /* ------------------------------------------------- gegevens van de som */

  function rapportRij(rij, kolommen) {
    var label = rij.subrij
      ? '<span class="rap-sub">' + esc(rij.label) + '</span>'
      : (kolommen ? esc(rij.label) : '<span class="rap-label">' + esc(rij.label) + '</span>');
    var hint = rij.toelichting ? '<span class="rap-hint">' + esc(rij.toelichting) + '</span>' : '';
    var cellen = kolommen
      ? rij.waarden.map(function (w, i) {
          return '<td data-k="' + esc(kolommen[i + 1] || '') + '">' +
            (w === null ? '—' : (w === '' ? '&nbsp;' : esc(w))) + '</td>';
        }).join('')
      : '<td>' + esc(rij.waarden[0] === null ? '—' : rij.waarden[0]) + '</td>';
    return '<tr' + (rij.totaalrij ? ' class="tot"' : '') + '><th scope="row">' + label + hint + '</th>' +
      cellen + '</tr>';
  }

  /* De kern kent één UPO en noemt haar kolommen daarom "UPO 1" en "UPO 2".
     Dit scherm telt meerdere UPO's op tot één bedrag (`upoNaarKern()`), dus
     "UPO 1" is hier de som van alle reguliere pensioenen en niet het eerste
     formulier. Die kop is dan onjuist voor wie drie UPO's invulde. De kolommen
     heten hier daarom "Regulier" en "AOW", met een eigen toelichting eronder.

     Dit is hernoemen, geen herrekenen: de bedragen blijven die van de kern.
     De vertaling grijpt op de letterlijke teksten van `rapportage.v4.ts`;
     wijzigt die daar, dan verschijnt gewoon weer "UPO 1" in beeld, zichtbaar
     in plaats van stilletjes verkeerd. `browser.mjs` bewaakt beide kanten. */
  var KOLOMNAAM = {'UPO 1': 'Regulier', 'UPO 2': 'AOW'};

  /* Noten van de kern die dit scherm anders verwoordt. De regels grijpen op
     het bégin van de tekst, niet op het geheel, want de kern vult er
     percentages in die per geval verschillen. `vervang` krijgt de tekst van
     de kern en geeft de nieuwe terug, of null om de noot te laten vervallen.
     Herschrijft `rapportage.v4.ts` een van deze openingen, dan verschijnt
     daar weer de tekst van de kern: zichtbaar, niet stil verkeerd. */
  var NOTEN = [
    {
      begint: 'UPO 1: ouderdoms- en partnerpensioen',
      vervang: function () {
        return 'Regulier: uw ouderdomspensioen en, als u een partner heeft, uw ' +
          'partnerpensioen, van al uw UPO’s bij elkaar opgeteld. AOW: uw ' +
          'AOW-compensatiepensioen, dat apart wordt doorgerekend omdat het ' +
          'levenslang doorloopt, geen partnerpensioen kent en een eigen ' +
          'verhoging krijgt.';
      }
    },
    {
      /* De kern noemt hier vier percentages. Drie daarvan staan al als
         rekensom onder de regel zelf ("onvoorwaardelijk: 2,20% + 0,5% =
         2,70% per jaar"), en het vierde herhaalt de verhogingskolom. De noot
         hoeft alleen te vertellen wat er gebeurt. */
      begint: 'AOW-compensatiepensioen: uit de buffer krijgt dit pensioen',
      vervang: function () {
        return 'Het AOW-compensatiepensioen krijgt uit de buffer hetzelfde ' +
          'percentage als uw ouderdomspensioen. Omdat de stijging ervan ' +
          'onvoorwaardelijk was toegezegd, komt daar een extra verhoging ' +
          'bovenop. Die wordt in één keer meegegeven; de koppeling ' +
          'aan de AOW vervalt na invaren.';
      }
    },
    {
      /* "(scherm 7)" is de schermnummering van de oorspronkelijke calculator
         en zegt hier niets. Elke zin die ernaar verwijst vervalt; wat
         overblijft (bij een partner: dat beide pensioenen met hetzelfde
         percentage stijgen) blijft staan. Blijft er niets over, dan vervalt
         de noot. */
      begint: 'Bruto bedragen bij de middelste rij',
      vervang: function (tekst) {
        var over = tekst.split('. ').filter(function (zin) {
          return zin.indexOf('scherm 7') < 0;
        }).join('. ').trim();
        if (!over) return null;
        return over.slice(-1) === '.' ? over : over + '.';
      }
    }
  ];

  /* Toelichtingen bij rijen, met dezelfde werkwijze als NOTEN: grijp op het
     begin van de tekst van de kern en geef de nieuwe terug, of null om de
     toelichting te laten vervallen. Ze verwijzen naar schermen van de
     oorspronkelijke calculator ("scherm 7", "de tabel"), die hier niet
     bestaan; wie dit rapport leest moet weten waar het getal in déze
     calculator vandaan komt. Herschrijft `rapportage.v4.ts` een opening, dan
     staat de tekst van de kern er weer: zichtbaar, niet stil verkeerd. */
  var TOELICHTINGEN = [
    {
      begint: 'gekozen op het resultaatscherm',
      vervang: function () { return 'de dekkingsgraad uit uw brief, ingevuld bij stap 3'; }
    },
    {
      /* "de middelste rij van de tabel" is de tabel op het resultaatscherm
         van de oude calculator; hier wordt met één dekkingsgraad gerekend. */
      begint: 'gelijk aan de rekenrente (middelste rij van de tabel)',
      vervang: function (t) {
        return t.replace(' (middelste rij van de tabel)', '');
      }
    },
    {
      /* Wie drie UPO’s had, telde die op stap 2 bij elkaar op; de UPO met
         het AOW-compensatiepensioen is dan niet de tweede. */
      begint: 'zoals op uw tweede UPO',
      vervang: function () { return 'zoals op uw UPO voor dit pensioen'; }
    },
    {
      /* Om dezelfde reden: bij meerdere UPO's is dit bedrag de som. De kern
         kent er één en schrijft enkelvoud. */
      begint: 'zoals op uw UPO',
      vervang: function (t) {
        return v.aantalUpo > 1 ? 'van al uw UPO\u2019s bij elkaar opgeteld' : t;
      }
    }
  ];

  function hernoemToelichting(rij) {
    if (!rij.toelichting) return rij;
    for (var i = 0; i < TOELICHTINGEN.length; i++) {
      if (rij.toelichting.indexOf(TOELICHTINGEN[i].begint) === 0) {
        var nieuw = TOELICHTINGEN[i].vervang(rij.toelichting);
        return Object.assign({}, rij, {toelichting: nieuw || undefined});
      }
    }
    return rij;
  }

  function hernoemKolommen(weergave) {
    var blokken = [];
    weergave.blokken.forEach(function (b) {
      if (b.soort === 'noot') {
        for (var i = 0; i < NOTEN.length; i++) {
          if (b.tekst.indexOf(NOTEN[i].begint) === 0) {
            var nieuw = NOTEN[i].vervang(b.tekst);
            if (nieuw) blokken.push({soort: 'noot', tekst: nieuw});
            return;
          }
        }
        blokken.push(b);
        return;
      }
      if (!b.rijen) { blokken.push(b); return; }
      var nieuw = Object.assign({}, b, {rijen: b.rijen.map(hernoemToelichting)});
      if (b.kolommen) nieuw.kolommen = b.kolommen.map(function (k) {
        return KOLOMNAAM[k] || k;
      });
      blokken.push(nieuw);
    });
    return {blokken: blokken};
  }

  function rapportHtml(weergave) {
    return hernoemKolommen(weergave).blokken.map(function (b) {
      if (b.soort === 'kop') return '<h3 class="rap-kop">' + esc(b.tekst) + '</h3>';
      if (b.soort === 'noot') return '<p class="rap-noot">' + esc(b.tekst) + '</p>';
      if (b.soort === 'voetnoot') return '<p class="rap-voetnoot">' + esc(b.tekst) + '</p>';
      if (b.soort === 'tabel') {
        return (b.kop ? '<h3 class="rap-kop">' + esc(b.kop) + '</h3>' : '') +
          '<div class="tabel-wrap"><table class="rap stapel"><tbody>' +
          b.rijen.map(function (r) { return rapportRij(r, null); }).join('') +
          '</tbody></table></div>';
      }
      return '<div class="tabel-wrap"><table class="rap stapel"><thead><tr>' +
        b.kolommen.map(function (k) {
          return '<th scope="col">' + (k ? esc(k) : '&nbsp;') + '</th>';
        }).join('') + '</tr></thead><tbody>' +
        b.rijen.map(function (r) { return rapportRij(r, b.kolommen); }).join('') +
        '</tbody></table></div>';
    }).join('');
  }

  /**
   * Scherm: de opbouw van uw verhoging.
   *
   * Sectie 4 en 5 van het rapport van de kern, losgemaakt uit het volledige
   * gegevensscherm. Daar staan ze achter de invoer, de uitgangspunten en de
   * fondsgegevens; dit zijn juist de twee die de deelnemer zelf wil zien:
   * hoeveel van de buffer bij elk pensioen terechtkomt, en wat dat per jaar
   * betekent. Het gegevensscherm blijft ongewijzigd: dat is de volledige
   * verantwoording, dit de leesbare versie ervan.
   *
   * De blokken komen ongewijzigd uit `rapportWeergaveV4`; hier wordt alleen
   * geknipt, niets herschreven of herrekend. Het knippunt is de kop die met
   * "4." begint. Hernummert de kern haar secties, dan valt dat hier om en
   * toont dit scherm het hele rapport — zichtbaar mis, niet stilletjes fout.
   */
  function schermVerdeling() {
    var sc = huidigScenario();
    if (!sc) {
      return '<h2 id="staptitel" tabindex="-1">De opbouw van uw verhoging</h2>' +
        '<p>Er is nog geen berekening beschikbaar.</p>';
    }
    var blokken = K.rapportWeergaveV4(sc.gebruikteGegevens).blokken;
    var vanaf = 0;
    for (var i = 0; i < blokken.length; i++) {
      if (blokken[i].soort === 'kop' && blokken[i].tekst.indexOf('4.') === 0) { vanaf = i; break; }
    }
    /* De kern nummert haar secties 4 en 5, want in het volledige rapport
       staan er drie v\u00f3\u00f3r. Hier zijn die niet te zien, en op stap 5 van 6
       leest "4." en "5." bovendien als een stapnummer. De nummers gaan er
       daarom op d\u00edt scherm af; op het gegevensscherm blijven ze staan, want
       daar hoort de nummering wel bij. */
    var secties = blokken.slice(vanaf).map(function (b) {
      if (b.soort !== 'kop') return b;
      return {soort: 'kop', tekst: b.tekst.replace(/^\d+\.\s*/, '')};
    });
    /* Het voorbehoud van de kern sluit het rapport af. De gevoeligheidsband
       komt daar nog achteraan, dus die regel wordt even apart gezet en als
       laatste getekend; anders staat het voorbehoud midden op het scherm. */
    var slot = secties.filter(function (b) { return b.soort === 'voetnoot'; });
    var romp = secties.filter(function (b) { return b.soort !== 'voetnoot'; });
    return '<h2 id="staptitel" tabindex="-1">De opbouw van uw verhoging</h2>' +
      '<p class="kaart-intro">Dit heeft de calculator zelf uitgerekend, met de bedragen ' +
      'van uw UPO\u2019s en de dekkingsgraad van ' + esc(dgTekst() || '\u2014') +
      ' uit uw brief. Op de volgende stap legt hij het naast wat uw brief zegt.</p>' +
      rapportHtml({blokken: romp}) +
      dekkingsgraadBand(sc, !!sc.aowCompensatie) +
      rapportHtml({blokken: slot});
  }

  /**
   * Scherm: het volledige rapport.
   *
   * De verantwoording onder de vergelijking, in de volgorde waarin een
   * berekening werkt: wat erin ging, waarmee is gerekend, en wat eruit kwam.
   * De kern levert de vijf secties; dit scherm zet er alleen de naam en de
   * leeswijzer omheen, zodat de lezer weet welke sectie waarvoor staat.
   *
   * Het rapport is er niet om door te klikken maar om na te rekenen of mee te
   * nemen naar SSPF; vandaar de pdf-knop eronder.
   */
  function schermParameters() {
    var sc = huidigScenario();
    if (!sc) {
      return '<h2 id="staptitel" tabindex="-1">Het volledige rapport</h2>' +
        '<p>Er is nog geen berekening beschikbaar.</p>';
    }
    return '<h2 id="staptitel" tabindex="-1">Het volledige rapport</h2>' +
      '<p class="kaart-intro">Alles waarmee deze calculator tot zijn uitkomst komt, in drie ' +
      'delen: wat u hebt ingevuld (1), de parameters waarmee is gerekend (2 en 3), en de ' +
      'resultaten die daaruit volgen (4 en 5). Alleen de dekkingsgraad komt uit uw brief; ' +
      'de rest rekent deze calculator zelf uit. Daarmee is elk bedrag na te rekenen.</p>' +
      rapportHtml(K.rapportWeergaveV4(sc.gebruikteGegevens));
  }

  /* ----------------------------------------------------------- tekenen */

  var app = document.getElementById('app');

  function render(focusDoel) {
    normaliseerBriefstap();
    var s = ctrl.status();
    var stap = huidigeStap();
    var detail = stap === 'resultaat' && v.subscherm === 'detail';
    var inhoud;
    zetOverlayKnoppen();
    if (v.overlay) {
      var isPriv = v.overlay === 'privacy';
      app.innerHTML = '<section class="kaart" aria-labelledby="staptitel">' +
        (isPriv ? schermPrivacy() : schermDisclaimer()) + '</section>';
      document.title = (isPriv ? 'Privacy' : 'Disclaimer') + ' · InvaarVergelijker';
      var kop = document.getElementById('staptitel');
      if (kop) kop.focus();
      return;
    }

    /* De openingsvraag gaat aan alles vooraf en kent geen voortgangsbalk. */
    if (v.triage !== 'ja') {
      app.innerHTML = '<section class="kaart" aria-labelledby="staptitel">' +
        (v.triage === 'nee' ? schermNietGeschikt() : schermTriage()) + '</section>';
      document.title = 'InvaarVergelijker';
      var doelT = focusDoel === 'fout' ? document.getElementById('foutblok') : null;
      if (!doelT && focusDoel) doelT = document.getElementById('staptitel');
      if (doelT) doelT.focus();
      return;
    }

    if (stap === 'nu') { inhoud = schermNu(); planKapitaalwaarde(); }
    else if (stap === 'dg') inhoud = schermDg();
    else if (stap === 'brief') inhoud = schermBrief();
    else if (stap === 'persoonlijk') inhoud = schermGegevens(s);
    else if (stap === 'verdeling') inhoud = schermVerdeling();
    else if (stap === 'resultaat') inhoud = detail ? schermResultaat() : schermControle();
    else inhoud = schermParameters();

    app.innerHTML = voortgang(stap) + '<section class="kaart" aria-labelledby="staptitel">' +
      inhoud + knoprij(stap) + '</section>';
    document.title = (detail ? 'Mijn pensioen na invaren' : STAPPEN[stap]) + ' · InvaarVergelijker';

    /* Een tabel die niet past wordt een scrollbare, met het toetsenbord
       bereikbare regio (WCAG 2.1.1). */
    Array.prototype.forEach.call(app.querySelectorAll('.tabel-wrap'), function (wrap) {
      if (wrap.scrollWidth > wrap.clientWidth + 1) {
        wrap.setAttribute('tabindex', '0');
        wrap.setAttribute('role', 'group');
        var cap = wrap.querySelector('caption');
        wrap.setAttribute('aria-label', (cap ? cap.textContent.trim() + ', ' : '') +
          'tabel, horizontaal te verschuiven met de pijltoetsen');
      }
    });

    var doel = null;
    if (focusDoel === 'fout') doel = document.getElementById('foutblok');
    if (!doel && focusDoel) doel = document.getElementById('staptitel');
    if (doel) doel.focus();
  }

  /* --------------------------------------------------------- gebeurtenissen */

  function dispatch(veldnaam, waarde) {
    var r = ctrl.dispatch({ field: veldnaam, value: waarde });
    if (!r.ok) v.fouten = r.errors.slice();
    else v.fouten = [];
    return r;
  }

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.upo !== undefined) {
      upoVeldGewijzigd(Number(t.dataset.upo), t.dataset.soort, t.value);
    } else if (t.dataset.bedrag) {
      bedragNaarKern(t.dataset.bedrag, t.value);
    } else if (t.dataset.briefupo !== undefined) {
      briefUpoGewijzigd(Number(t.dataset.briefupo), t.dataset.briefsoort, t.value);
    } else if (t.dataset.briefaow !== undefined) {
      v.briefAowJaar = naarGetal(t.value);
    } else if (t.dataset.briefkapitaal !== undefined) {
      v.briefKapitaal = naarGetal(t.value);
    } else if (t.dataset.brief) {
      briefVeld(t.dataset.brief, t.value);
    }
  });

  /**
   * Eén regel per UPO; de kern krijgt de som. Dat mag omdat de kapitaalwaarde
   * lineair is in het pensioenbedrag: drie pensioenen apart doorrekenen en
   * optellen geeft tot op de cent dezelfde kapitaalwaarde, dezelfde uitkomst
   * na invaren en dezelfde verhouding als één opgeteld bedrag.
   */
  function upoVeldGewijzigd(n, soort, ruw) {
    var waarde = naarGetal(ruw);
    if (!v.upo[n]) v.upo[n] = {bruto: null, np: null, laag: null};
    v.upo[n][soort] = waarde;
    upoNaarKern();
  }

  /** De totalen bijwerken zonder te hertekenen; de cursor blijft zo staan. */
  function werkTotaalBij() {
    var i = ctrl.status().inputs;
    var zet = function (id, waarde) {
      var el = document.getElementById(id);
      if (el) el.textContent = eur(waarde || 0);
    };
    zet('tot-op', i.grossAnnual);
    zet('tot-np', i.partnerGrossAnnual);
    zet('tot-aow', v.aowJaar);
    zet('tot2-op', i.lowGrossAnnual);
    zet('tot2-np', i.partnerGrossAnnual);
    zet('tot2-aow', v.aowJaar);
  }

  function upoNaarKern() {
    var som = function (soort) {
      var t = 0, leeg = true;
      for (var n = 0; n < v.aantalUpo; n++) {
        var w = v.upo[n] ? v.upo[n][soort] : null;
        if (w !== null && isFinite(w)) { t += w; leeg = false; }
      }
      return leeg ? null : t;
    };
    dispatch('brutoJaar', som('bruto'));
    if (ctrl.status().inputs.hasPartner) dispatch('partnerBrutoJaar', som('np'));
    if (ctrl.status().inputs.highLow) {
      /* Een leeg veld "vanaf de knipdatum" betekent: dit pensioen verandert
         niet, dus het hoge bedrag loopt door. */
      var laag = 0, ietsIngevuld = false;
      for (var m = 0; m < v.aantalUpo; m++) {
        var rij = v.upo[m] || {};
        var hoog = (rij.bruto !== null && rij.bruto !== undefined && isFinite(rij.bruto))
          ? rij.bruto : null;
        var lager = (rij.laag !== null && rij.laag !== undefined && isFinite(rij.laag))
          ? rij.laag : null;
        if (lager !== null) { laag += lager; ietsIngevuld = true; }
        else if (hoog !== null) { laag += hoog; ietsIngevuld = true; }
      }
      dispatch('laagJaar', ietsIngevuld ? laag : null);
    }
    werkTotaalBij();
    planKapitaalwaarde();
  }

  /** Het aantal regels wijzigen; ingevulde bedragen blijven staan. */
  function zetAantalUpo(aantal) {
    v.aantalUpo = aantal;
    while (v.upo.length < aantal) v.upo.push({bruto: null, np: null, laag: null});
    upoNaarKern();
  }

  /* De brief is referentiemateriaal: deze waarden gaan niet naar de kern. */
  function briefVeld(naam, ruw) {
    /* De dekkingsgraad blijft tekst: `briefDg()` leest hem zelf, want een
       punt is daar geen duizendtalscheiding. */
    if (naam === 'dg') { v.brief[naam] = ruw; return; }
    v.brief[naam] = naarGetal(ruw);
  }

  /**
   * De bedragen van stap 2 overnemen als beginstand voor stap 5.
   *
   * Zo hoeft niemand alles opnieuw in te tikken: wat gelijk blijft kan blijven
   * staan, wat verandert wordt overschreven. Het risico is dat iemand ze
   * láát staan en een vergelijking zonder verschillen ziet. Daarom staan er
   * de bedragen van vóór het invaren in — zichtbaar de verkeerde — en zegt
   * het scherm er met zoveel woorden bij dat ze moeten worden aangepast.
   */
  /**
   * De referentie onder een veld op stap 5: wat dit pensioen nu is en wat deze
   * calculator ervan maakt, als "\u20ac 10.000 \u2192 \u20ac 12.794". Zonder labels, want
   * de pijl zegt het al en zeven van deze regels onder elkaar moeten rustig
   * blijven. Voor wie de pijl niet ziet staat er een verborgen tekst met
   * dezelfde strekking; "\u2192" alleen zou als niets of als "groter dan"
   * worden voorgelezen.
   */
  function referentie(nu, berekend) {
    var g = function (x) {
      return (x === null || x === undefined || !isFinite(x)) ? '\u2014' : eur(x);
    };
    return '<p class="hint"><span class="sr-only">Nu </span>' + g(nu) +
      '<span aria-hidden="true"> \u2192 </span>' +
      '<span class="sr-only">, volgens deze calculator </span>' + g(berekend) + '</p>';
  }

  function briefUpoGewijzigd(n, soort, ruw) {
    if (!v.briefUpo[n]) v.briefUpo[n] = {bruto: null, np: null, laag: null};
    v.briefUpo[n][soort] = naarGetal(ruw);
  }

  /** De som over de UPO-regels van de brief; null als er niets is ingevuld. */
  function briefSom(soort) {
    var som = null;
    for (var n = 0; n < v.aantalUpo; n++) {
      var r = v.briefUpo[n];
      if (!r) continue;
      var w = r[soort];
      /* Een leeg veld "laag" betekent dat dát pensioen niet verandert, net
         als op stap 2: dan telt het hoge bedrag mee in het lage totaal. */
      if ((w === null || w === undefined) && soort === 'laag') w = r.bruto;
      if (w !== null && w !== undefined) som = (som || 0) + w;
    }
    return som;
  }

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.datum) {
      datumDeelGewijzigd(t.dataset.datum, t.dataset.deel, t.value);
    } else if (t.hasAttribute('data-upo')) {
      upoVeldGewijzigd(Number(t.dataset.upo), t.dataset.soort, t.value);
    } else if (t.hasAttribute('data-triage')) {
      v.triage = t.value;
      v.fouten = [];
    } else if (t.dataset.brief) {
      briefVeld(t.dataset.brief, t.value);
    } else if (t.hasAttribute('data-metriek')) {
      v.metriek = t.value;
      render(false);
      var sel = document.getElementById('in-metriek');
      if (sel) sel.focus();
    }
  });

  /**
   * Een gewijzigde maand of jaar verandert het aantal dagen. De lijst wordt
   * dan opnieuw getekend; stond er een dag in die niet meer bestaat (31
   * februari), dan valt die weg en moet hij opnieuw gekozen worden.
   */
  function datumDeelGewijzigd(naam, deel, waarde) {
    var d = v[naam];
    d[deel] = waarde;
    var opnieuw = false;
    if (deel === 'maand' || deel === 'jaar') {
      /* De dagenlijst volgt de maand. Valt de gekozen dag daarbuiten (31 juni),
         dan verdwijnt hij uit de lijst. Dat stilzwijgend doen laat iemand met
         een halve datum achter die hij zelf niet ziet; daarom wordt het
         gemeld. */
      if (d.dag && Number(d.dag) > dagenInMaand(d.maand, d.jaar)) {
        v.dagGewist = naam;
        d.dag = '';
      }
      opnieuw = true;
    }
    if (deel === 'dag' && waarde !== '' && v.dagGewist === naam) {
      v.dagGewist = null;
      opnieuw = true;
    }
    /* De knipdatum krijgt er een toelichting bij zodra hij op of vóór de
       invaardatum valt, dus ook een nieuwe dag vraagt om opnieuw tekenen. */
    if (naam === 'knip') opnieuw = true;
    datumNaarKern(naam);
    if (!opnieuw) return;
    render(false);
    var achtervoegsel = deel === 'dag' ? '-d' : (deel === 'maand' ? '-m' : '-j');
    var el = document.getElementById('dat-' + naam + achtervoegsel);
    if (el) el.focus();
  }

  function datumNaarKern(naam) {
    var iso = isoUit(v[naam]);
    if (naam === 'dob') dispatch('geboortedatum', iso);
    else if (naam === 'dobPartner') dispatch('partnerGeboortedatum', iso);
    else dispatch('knipdatum', iso);
  }

  function bedragNaarKern(naam, ruw) {
    var waarde = naarGetal(ruw);
    if (naam === 'aowJaar') {
      v.aowJaar = waarde;
      ctrl.syncAowContext(v.aowAan, waarde);
      werkTotaalBij();
      planKapitaalwaarde();
      return;
    }
    dispatch(naam, waarde);
    werkTotaalBij();
    planKapitaalwaarde();
  }

  /** Alleen de toestand bijwerken; het tekenen doet de aanroeper. */
  function jaNeeNaarKern(naam, aan) {
    if (naam === 'aow') {
      v.aowAan = aan;
      if (!aan) v.aowJaar = null;
      ctrl.syncAowContext(aan, v.aowJaar);
      return;
    }
    dispatch(naam, aan);
    /* `set-high-low` met false wist de knipdatum in de kern; dat is haar eigen
       invalidatieregel. Dit scherm houdt de datum wél vast in `v.knip`, zodat
       wie per ongeluk op Nee drukt hem niet opnieuw hoeft te kiezen. Daardoor
       lopen scherm en kern uiteen zodra er weer Ja wordt gekozen: de drie
       keuzelijsten staan nog ingevuld, maar de kern heeft `cutoverDate: null`
       en meldt op stap 2 `MISSING_CUTOVER` bij een datum die zichtbaar is
       ingevuld. Daarom gaat de datum hier opnieuw naar de kern. Omgekeerd
       hoeft er niets te gebeuren: bij Nee telt de knipdatum niet mee. */
    if (naam === 'hoogLaag' && aan) datumNaarKern('knip');
  }

  app.addEventListener('click', function (e) {
    /* Keuze uit twee: knoppen in plaats van een keuzelijst. Na het tekenen
       keert de aandacht terug naar dezelfde knop, zodat wie met het
       toetsenbord werkt zijn plaats niet kwijtraakt. */
    var keuze = e.target.closest
      ? e.target.closest('[data-janee],[data-geslacht],[data-aantal]') : null;
    if (keuze) {
      var terugNaar = keuze.id;
      if (keuze.dataset.janee) jaNeeNaarKern(keuze.dataset.janee, keuze.dataset.waarde === 'ja');
      else if (keuze.dataset.aantal) zetAantalUpo(Number(keuze.dataset.waarde));
      else dispatch(keuze.dataset.geslacht, keuze.dataset.waarde);
      render(false);
      var zelfde = document.getElementById(terugNaar);
      if (zelfde) zelfde.focus();
      return;
    }

    var knop = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (!knop) return;
    var actie = knop.dataset.nav;

    if (actie === 'afdruk') { window.print(); return; }

    if (actie === 'overlay-terug') { v.overlay = null; render(true); return; }

    if (actie === 'triage-verder') {
      if (v.triage === null) { v.fouten = ['TRIAGE_GEEN_KEUZE']; render('fout'); return; }
      v.fouten = [];
      render(true);
      return;
    }
    if (actie === 'triage-wijzig') { v.triage = null; v.fouten = []; render(true); return; }

    if (actie === 'detail') { v.subscherm = 'detail'; render(true); return; }
    if (actie === 'controle') { v.subscherm = 'controle'; v.resultaatFase = 'resultaat'; render(true); return; }

    if (actie === 'terug') {
      /* De twee bedragenschermen delen dezelfde workflowstap; de overgang
         ertussen is schermwerk. */
      /* Het detailscherm is een zijsprong vanaf de controle, geen stap; de
         weg terug is die controle. */
      if (v.subscherm === 'detail') { v.subscherm = 'controle'; v.fouten = []; render(true); return; }
      if (huidigeStap() === 'dg') { v.bedragenFase = 'nu'; v.fouten = []; render(true); return; }
      /* Opbouw, brief en controle delen de workflowstap 'resultaat'; de
         overgangen ertussen zijn schermwerk, net als bij de bedragenschermen.
         Alleen vanaf de opbouw gaat de besturing echt een stap terug. */
      if (huidigeStap() === 'resultaat') { v.resultaatFase = 'brief'; v.fouten = []; render(true); return; }
      if (huidigeStap() === 'brief') { v.resultaatFase = 'verdeling'; v.fouten = []; render(true); return; }
      if (huidigeStap() === 'verdeling') naarLaatsteBedragenscherm();
      normaliseerBriefstap();
      var r = ctrl.navigate('back');
      if (!r.ok) { v.fouten = r.errors.slice(); render('fout'); return; }
      /* Terug vanaf het gegevensscherm komt uit op de controle, niet op de
         opbouw: dat is het scherm waar de knop ernaartoe stond. */
      if (ctrl.status().step === 'resultaat') v.resultaatFase = 'resultaat';
      v.fouten = [];
      render(true);
      return;
    }

    if (actie === 'verder') {
      if (huidigeStap() === 'nu') { v.bedragenFase = 'dg'; v.fouten = []; render(true); return; }
      /* De dekkingsgraad wordt hier al nagelopen in plaats van pas bij het
         rekenen: wie hem verkeerd overneemt, hoort dat op het scherm waar hij
         staat en niet twee stappen verderop. */
      /* De dekkingsgraad is het laatste dat de berekening nodig heeft, dus
         hier wordt gerekend. Daarna volgt de eigen uitkomst, en pas daarna
         de cijfers uit de brief. */
      if (huidigeStap() === 'dg') {
        var dgStap = briefDg();
        if (dgStap === null) { v.fouten = ['GEEN_DEKKINGSGRAAD']; render('fout'); return; }
        if (K.bijstortVoorDekkingsgraadV4(dgStap, K.CONFIG) === null) {
          v.fouten = ['DEKKINGSGRAAD_BUITEN_STAFFEL']; render('fout'); return;
        }
        ctrl.setVisibleStep(K.lastInputStep(ctrl.status().inputs));
        var mag = ctrl.allowLegacyCalculation();
        if (!mag.ok) { v.fouten = mag.errors.slice(); render('fout'); return; }
        if (!bereken()) { ctrl.onLegacyCalculationFailure(); render('fout'); return; }
        v.subscherm = 'controle';
        v.resultaatFase = 'verdeling';
        render(true);
        return;
      }
      if (huidigeStap() === 'verdeling') {
        v.resultaatFase = 'brief'; v.fouten = []; render(true); return;
      }
      if (huidigeStap() === 'brief') { v.resultaatFase = 'resultaat'; v.fouten = []; render(true); return; }
      var vooruit = ctrl.navigate('forward');
      if (!vooruit.ok) { v.fouten = vooruit.errors.slice(); render('fout'); return; }
      /* Stap 1 beslaat 'persoonlijk' en 'partner'. De tweede stap wordt hier
         meegenomen, zodat de besturing haar eigen controle op de
         geboortedatum van de partner blijft doen. */
      if (ctrl.status().step === 'partner') {
        var ookPartner = ctrl.navigate('forward');
        if (!ookPartner.ok) { v.fouten = ookPartner.errors.slice(); render('fout'); return; }
      }
      v.fouten = [];
      render(true);
      return;
    }


  });

  /* Enter in een invoerveld betekent: verder, niet niets. */
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.tagName !== 'INPUT') return;
    e.preventDefault();
    var knop = app.querySelector('[data-nav="verder"]');
    if (knop) knop.click();
  });

  /* De knoppen staan in de kopband, buiten #app, en zijn dus op elk scherm
     bereikbaar. Ze schakelen heen en weer; de invoer blijft intussen staan.
     Dezelfde schermen zijn ook via de voettekst te openen. */
  function zetOverlayKnoppen() {
    [['knop-privacy', 'privacy'], ['knop-disclaimer', 'disclaimer']].forEach(function (k) {
      var el = document.getElementById(k[0]);
      if (el) el.setAttribute('aria-pressed', v.overlay === k[1] ? 'true' : 'false');
    });
  }

  [['knop-privacy', 'privacy'], ['knop-disclaimer', 'disclaimer']].forEach(function (k) {
    var el = document.getElementById(k[0]);
    if (!el) return;
    el.addEventListener('click', function () {
      v.overlay = v.overlay === k[1] ? null : k[1];
      render(true);
    });
  });

  [['voet-privacy', 'privacy'], ['voet-disclaimer', 'disclaimer']].forEach(function (k) {
    var el = document.getElementById(k[0]);
    if (!el) return;
    el.addEventListener('click', function (e) {
      e.preventDefault();
      v.overlay = k[1];
      render(true);
    });
  });

  render(false);
})();

</script>

</body>
</html>
