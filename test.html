<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvaarVergelijker</title>
<meta name="description" content="Reken de persoonlijke berekening van uw pensioen na invaren zelf na en leg hem naast wat uw pensioenfonds u schreef. Werkt volledig in uw browser, zonder internetverbinding.">
<meta name="color-scheme" content="light">
<style>
/* ==========================================================================
   InvaarVergelijker: weergavelaag (presentatie)
   Palet: #245447 #51826D #D8E7DB #F4F7F2 #FFFFFF
   Doelgroep 60+: basis 18px, grote velden en knoppen, duidelijke focus.
   Contrast: tekst altijd #245447 op wit/#F4F7F2/#D8E7DB (> 7:1);
   #51826D uitsluitend als vlak onder witte tekst (5,2:1) of als rand.
   ========================================================================== */

:root {
  --groen-donker: #245447;
  --groen-mid: #51826D;
  --groen-licht: #D8E7DB;
  --groen-bleek: #F4F7F2;
  --wit: #FFFFFF;

  --txt: 18px;
  --txt-s: 16px;
  --txt-l: 21px;
  --radius: 10px;
  --rij: 1.55;
  --veld-hoogte: 3.1rem;
  --max: 56rem;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: var(--txt);
  line-height: var(--rij);
  color: var(--groen-donker);
  background: var(--groen-bleek);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 700; }
p { margin: 0 0 0.85em; }
p:last-child { margin-bottom: 0; }

/* --- Hulpmiddelen ------------------------------------------------------- */

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skiplink {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--groen-donker); color: var(--wit);
  padding: 0.75rem 1.25rem; border-radius: 0 0 var(--radius) 0;
  font-weight: 700; text-decoration: none;
}
.skiplink:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--groen-donker);
  outline-offset: 2px;
}
.kop-band :focus-visible { outline-color: var(--wit); }

/* --- Kop --------------------------------------------------------------- */

.kop-band {
  background: var(--groen-donker);
  color: var(--wit);
  padding: 1.5rem 1.25rem;
}
.kop-binnen {
  max-width: var(--max); margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 0.75rem 2rem;
  align-items: center; justify-content: space-between;
}
.kop-band h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
/* Geen kader en geen vet: in deze band is een afgerond kader een knop, en
   deze regel is tekst. Het onderscheid zit dus in de vorm, niet alleen in de
   tekengrootte. */
/* "InvaarVergelijker" is één woord en breekt uit zichzelf nergens. Bij 200%
   tekst op een smal scherm is het breder dan de kopband, en dan schuift de
   hele pagina horizontaal — precies wat deze opmaak wil voorkomen. In
   `shell.html` staat daarom een <wbr> tussen "Invaar" en "Vergelijker", zodat
   het afbreekpunt op een leesbare plek ligt; `overflow-wrap` vangt af wat
   daarnaast nog te breed wordt. Hernoemt u de calculator, controleer dit dan
   opnieuw: de vorige naam was kort genoeg om het probleem te verbergen. */
.kop-titel { min-width: 0; }
.kop-band h1 { overflow-wrap: break-word; }
/* De ondertitel staat binnen de <h1>, zodat de koptekst één kop blijft: de
   toets eist precies één <h1>, en een tweede kop zou de structuur verdelen
   zonder dat er een tweede onderwerp is. Als blok op een eigen regel, en
   kleiner dan de naam, zodat de naam de kop blijft dragen. */
.kop-sub { display: block; margin: 0.3rem 0 0; font-size: var(--txt-s); font-weight: 400; letter-spacing: 0; }
.kop-waarschuwing { margin: 0.3rem 0 0; font-size: var(--txt-s); }
/* Wit op --groen-donker: 8,63:1. Hoogte volgt --veld-hoogte, net als de
   overige knoppen, zodat ook deze boven de 48px blijft. */
.kop-knoppen { display: flex; gap: 0.6rem; }
.knop-kop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.5rem 1.1rem;
  border: 2px solid var(--wit); border-radius: var(--radius);
  background: var(--groen-donker); color: var(--wit);
  cursor: pointer;
}
.knop-kop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-kop[aria-pressed="true"] { background: var(--wit); color: var(--groen-donker); }

/* Vervolgvragen die pas verschijnen na een Ja: ingesprongen met een lijn,
   zodat zichtbaar is waar ze bij horen. */
.vervolg {
  border-left: 4px solid var(--groen-licht);
  padding-left: 1.1rem;
  margin: 0 0 1.6rem;
}
.vervolg > :last-child { margin-bottom: 0; }

/* Twee bedragen van hetzelfde UPO naast elkaar; ze breken naar onder elkaar
   zodra er geen ruimte meer is. */
.bedrag-paar { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
/* De labels dragen sinds de eenheidsconventie hun eenheid mee en breken
   daardoor over verschillend veel regels af. Zonder dit zouden de
   invoervelden ernaast op verschillende hoogten beginnen. Elk veld is nu zelf
   een kolom die zijn invoer onderaan zet, zodat de velden op één lijn staan
   hoe lang de labels ook worden. */
.bedrag-paar .veld {
  flex: 1 1 13rem; min-width: 0; margin-bottom: 1.1rem;
  display: flex; flex-direction: column; justify-content: space-between;
}
/* `.veld:last-child` haalt elders de ondermarge weg. In deze rij zou het
   laatste veld daardoor 1,1rem dieper doorlopen dan zijn buren, en dan staat
   zijn invoerveld niet meer op één lijn. Binnen de rij dus gelijke marges. */
.bedrag-paar .veld:last-child { margin-bottom: 1.1rem; }
/* Kop boven een groep invoervelden ("UPO 1", "UPO 2"). Eerder stond hier de
   `.rap-kop` van de rapporttabellen, met een ondermarge van 2rem die bij een
   tabel hoort. Boven invoer telt die op bij de 1,1rem van de velderij erboven,
   waardoor er tussen twee UPO's bijna drie keer zoveel ruimte stond als tussen
   een velderij en het label eronder. Hier hoort de maat van het formulier. */
.groep-kop { font-size: 1.15rem; margin: 0.9rem 0 0.75rem; }
.groep-kop:first-child { margin-top: 0; }
.bedrag-paar .geld-wrap { max-width: none; }

/* --- Keuze uit twee ----------------------------------------------------- */

.keuzeknoppen { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.keuzeknop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  min-width: 7rem;
  padding: 0.6rem 1.5rem;
  border: 2px solid var(--groen-mid); border-radius: var(--radius);
  background: var(--wit); color: var(--groen-donker);
  cursor: pointer;
}
.keuzeknop:hover { background: var(--groen-licht); }
/* De gekozen knop: wit op --groen-donker (8,63:1), plus een dikkere rand,
   zodat het verschil niet alleen in kleur zit. */
.keuzeknop.aan {
  background: var(--groen-donker); color: var(--wit); border-color: var(--groen-donker);
  box-shadow: inset 0 0 0 2px var(--wit);
}

/* --- Openingsvraag ------------------------------------------------------ */

.triage-criteria { list-style: none; margin: 0 0 1.75rem; padding: 0; }
.triage-criteria li {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0; font-weight: 700;
}
.triage-criteria .vink {
  flex: 0 0 auto;
  width: 2rem; height: 2rem; border-radius: var(--radius);
  background: var(--groen-licht); color: var(--groen-donker);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.triage-vraag { border: 0; padding: 0; margin: 0 0 1.5rem; }
.triage-vraag legend { padding: 0 0 0.75rem; font-weight: 700; font-size: var(--txt-l); }
.triage-vraag .keuze { margin: 0 0 0.75rem; }
.keuze-groot .keuze-titel { font-size: var(--txt-l); }

/* Lopende tekst over de volle breedte van de kaart, zoals de disclaimer. */
.lange-tekst { margin: 0 0 1.5rem; }
.lange-tekst p { margin: 0 0 1rem; }

/* --- Privacyscherm ------------------------------------------------------ */

.priv-kaarten { display: flex; flex-direction: column; gap: 1rem; margin: 0 0 1.5rem; }
.priv-kaart {
  border: 2px solid var(--groen-licht); border-radius: var(--radius);
  background: var(--wit); padding: 1.1rem 1.25rem;
}
.priv-kaart.uitgelicht { background: var(--groen-licht); border-color: var(--groen-mid); }
.priv-kaart h3 { font-size: var(--txt); margin: 0 0 0.45rem; }
.priv-kaart p { margin: 0; }
/* Niet het blauw van de browser: tekstkleur is overal --groen-donker. */
.priv-kaart a { color: var(--groen-donker); }

/* --- Romp -------------------------------------------------------------- */

.romp { max-width: var(--max); margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

.voortgang { margin-bottom: 1.25rem; }
.voortgang-tekst { font-weight: 700; margin: 0 0 0.5rem; }
.voortgang-balk {
  height: 0.75rem; background: var(--groen-licht);
  border-radius: 999px; overflow: hidden;
}
.voortgang-vulling {
  display: block; height: 100%; background: var(--groen-mid);
  border-radius: 999px; transition: width 0.25s ease;
}

.kaart {
  background: var(--wit);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 1.75rem;
}
.kaart > h2 {
  font-size: 1.35rem;
  margin: 0 0 0.35rem;
}
.kaart-intro { margin: 0 0 1.5rem; }
.kaart-intro:only-of-type { margin-bottom: 1.25rem; }

/* --- Formulier --------------------------------------------------------- */

.veld { margin: 0 0 1.6rem; }
.veld:last-child { margin-bottom: 0; }
/* Een veld dat zelf een groep begint (AOW-compensatiepensioen, pensioenkapitaal)
   heeft geen kop boven zich. Zonder dit staat het tegen de UPO-groep erboven
   aan terwijl het een ander pensioen is; dezelfde maat als `.groep-kop` zet
   alle groepen op hetzelfde ritme. */
.veld-groep { margin-top: 0.9rem; }
.veld > label, .veld-kop {
  display: block; font-weight: 700; margin-bottom: 0.5rem;
}
.hint { font-size: var(--txt-s); margin: 0.45rem 0 0; }

input[type="number"], input[type="text"], select {
  font: inherit;
  color: var(--groen-donker);
  background: var(--wit);
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 0.6rem 0.75rem;
  min-height: var(--veld-hoogte);
  width: 100%;
  max-width: 22rem;
}
select {
  /* eigen pijl, geen externe bron */
  appearance: none; -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, #245447 50%),
    linear-gradient(135deg, #245447 50%, transparent 50%);
  background-position: right 1.25rem center, right 0.9rem center;
  background-size: 0.42rem 0.42rem, 0.42rem 0.42rem;
  background-repeat: no-repeat;
  padding-right: 2.5rem;
}
input:hover, select:hover { border-color: var(--groen-donker); }
input[aria-invalid="true"] { border-color: var(--groen-donker); border-width: 3px; }

.geld-wrap { display: flex; align-items: stretch; max-width: 22rem; }
/* De eenheid staat voluit in dit vlak ("€/jaar"), dus het is breder dan het
   oude €-teken. `white-space: nowrap` houdt hem op één regel; `flex: 0 0 auto`
   laat hem zijn eigen breedte nemen zonder het invoerveld te verdringen.
   Groen-licht met groen-donkere tekst: ruim boven AA. */
.geld-teken {
  flex: 0 0 auto; display: flex; align-items: center;
  padding: 0 0.75rem; white-space: nowrap;
  background: var(--groen-licht); color: var(--groen-donker);
  border: 2px solid var(--groen-donker); border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  font-variant-numeric: tabular-nums;
}
.geld-wrap input { border-radius: 0 var(--radius) var(--radius) 0; max-width: none; }

/* datum in drie delen */
.datum-rij { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.datum-deel { display: flex; flex-direction: column; }
.datum-deel label { font-size: var(--txt-s); font-weight: 400; margin-bottom: 0.25rem; }
.datum-dag input { width: 5.5rem; }
.datum-jaar input { width: 7.5rem; }
.datum-maand select { width: 11rem; }

/* keuzelijst als grote radio's */
.keuzes { display: grid; gap: 0.85rem; }
.keuze {
  display: flex; gap: 0.9rem; align-items: flex-start;
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  background: var(--wit);
  cursor: pointer;
}
.keuze:hover { background: var(--groen-bleek); }
.keuze input { width: 1.5rem; height: 1.5rem; margin: 0.15rem 0 0; accent-color: #245447; flex: none; }
.keuze:has(input:checked) { background: var(--groen-licht); border-color: var(--groen-donker); border-width: 3px; padding: calc(1rem - 1px) calc(1.1rem - 1px); }
.keuze:focus-within { outline: 3px solid var(--groen-donker); outline-offset: 2px; }
.keuze-titel { display: block; font-weight: 700; }
.keuze-uitleg { display: block; font-size: var(--txt-s); }

/* --- Knoppen ----------------------------------------------------------- */

.knoprij {
  display: flex; flex-wrap: wrap; gap: 0.85rem;
  margin-top: 2rem; padding-top: 1.5rem;
  border-top: 2px solid var(--groen-licht);
}
.knop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.65rem 1.6rem;
  border-radius: var(--radius);
  border: 2px solid var(--groen-donker);
  background: var(--groen-donker);
  color: var(--wit);
  cursor: pointer;
}
/* Omkeren in plaats van vergrijzen: wit op --groen-mid haalt 4,41:1 en dus
   geen AA. Omgekeerd is het 8,63:1 en is de hover-stand duidelijker. */
.knop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-tweede { background: var(--wit); color: var(--groen-donker); }
.knop-tweede:hover { background: var(--groen-licht); }
.knop-volgende { margin-left: auto; }

/* --- Meldingen --------------------------------------------------------- */

.fouten {
  border: 2px solid var(--groen-donker);
  border-left-width: 10px;
  border-radius: var(--radius);
  background: var(--groen-licht);
  padding: 1rem 1.1rem;
  margin: 0 0 1.5rem;
}
.fouten h3 { font-size: var(--txt); margin-bottom: 0.35rem; }
.fouten ul { margin: 0; padding-left: 1.3rem; }
.fouten li { margin: 0.2rem 0; }

.noot {
  background: var(--groen-bleek);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 0.9rem 1.1rem;
  font-size: var(--txt-s);
  margin: 0 0 1rem;
}
/* De waarschuwing op stap 5 moet opvallen zonder kleur: het palet kent geen
   rood, dus het onderscheid zit in het vlak en de rand, niet in de tint. */
.noot-let-op {
  background: var(--groen-licht); border-color: var(--groen-donker);
  font-size: var(--txt);
}

/* --- Resultaat --------------------------------------------------------- */

.res-kop { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: baseline; justify-content: space-between; }
.res-sub { font-size: var(--txt-s); margin: 0.25rem 0 1.5rem; }

.res-uitgelicht {
  background: var(--groen-donker);
  color: var(--wit);
  border-radius: var(--radius);
  padding: 1.4rem 1.5rem;
  margin: 0 0 1.75rem;
}
.res-uitgelicht .res-label { display: block; font-size: var(--txt-s); }
.res-uitgelicht .res-groot { display: block; font-size: 2.1rem; font-weight: 700; line-height: 1.15; }
.res-uitgelicht .res-bij { display: block; font-size: var(--txt-s); margin-top: 0.4rem; }

.tabel-wrap { overflow-x: auto; margin: 0 0 1.5rem; }
table.data {
  border-collapse: collapse;
  width: 100%;
  font-variant-numeric: tabular-nums;
}
table.data caption {
  text-align: left; font-weight: 700; padding: 0 0 0.6rem;
}
table.data th, table.data td {
  border-bottom: 2px solid var(--groen-licht);
  padding: 0.7rem 0.85rem;
  text-align: right;
  white-space: nowrap;
}
table.data thead th { background: var(--groen-licht); border-bottom-color: var(--groen-mid); }
table.data th[scope="row"], table.data thead th:first-child { text-align: left; white-space: normal; }
table.data tbody tr:nth-child(even) { background: var(--groen-bleek); }
table.data tr.totaal { font-weight: 700; }
table.data tr.totaal th, table.data tr.totaal td { border-top: 3px solid var(--groen-mid); }
table.data td.gekozen, table.data thead th.gekozen {
  background: var(--groen-licht); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--groen-mid), inset -3px 0 0 var(--groen-mid);
}
.sectierij th { background: var(--groen-bleek); font-weight: 700; }

.dg-keuze { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin: 0 0 1.5rem; }
.dg-keuze label { font-weight: 700; }
.dg-keuze select { max-width: 12rem; }
.alleen-afdruk { display: none; }

/* --- Controlescherm ----------------------------------------------------
   Het palet kent geen rood. Een afwijking wordt daarom met vorm en gewicht
   gemeld, niet met kleur: een dikke rand, vette tekst en de woorden zelf.
   Dat leest ook zonder kleurwaarneming. Wilt u hier toch een signaalkleur,
   dan hoort die eerst door de contrasttoets in test/browser.mjs. */

/* Alle drie op --groen-donker: wit op --groen-mid haalt 4,41:1 en dus geen AA
   voor normale tekst. Het onderscheid zit in de balk, niet in de kleur. */
.ctrl-neutraal { background: var(--groen-donker); }
.ctrl-binnen { background: var(--groen-donker); box-shadow: inset 10px 0 0 var(--groen-mid); }
.ctrl-buiten { background: var(--groen-donker); box-shadow: inset 10px 0 0 var(--wit); }

table.data .oor { white-space: normal; font-size: var(--txt-s); }
table.data td.oor-buiten { font-weight: 700; box-shadow: inset 5px 0 0 var(--groen-donker); }
table.data tr.rij-buiten { background: var(--groen-licht); }
table.data tr.rij-buiten th[scope="row"] { font-weight: 700; }
.ctrl-tabel td .rap-hint { display: block; font-size: var(--txt-s); font-weight: 400; }
.ctrl-tabel td { white-space: normal; }
.leeg { font-style: italic; }
.dg-vast { font-weight: 400; }
.ctrl-lijst { margin: 0 0 1.5rem; padding-left: 1.4rem; }
.ctrl-lijst li { margin: 0 0 0.6rem; }

@media (max-width: 30rem) {
  table.stapel tr.rij-buiten { border-color: var(--groen-donker); border-width: 3px; }
  table.stapel td.oor-buiten { box-shadow: none; border-left: 5px solid var(--groen-donker); padding-left: 0.5rem; }
}

.metriek-keuze { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; margin: 0 0 0.75rem; }
.metriek-keuze label { font-weight: 700; font-size: var(--txt-s); }
.metriek-keuze select { max-width: 17rem; }

/* --- Gegevensscherm ---------------------------------------------------- */

.rap-kop { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
.rap-kop:first-child { margin-top: 0; }
table.rap { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-variant-numeric: tabular-nums; }
table.rap th, table.rap td {
  border-bottom: 1px solid var(--groen-licht);
  padding: 0.6rem 0.85rem; vertical-align: top; text-align: left;
}
table.rap td { text-align: right; white-space: nowrap; }
table.rap thead th { background: var(--groen-licht); text-align: right; }
table.rap thead th:first-child { text-align: left; }
table.rap th[scope="row"] { font-weight: 400; width: 55%; }
table.rap .rap-label { font-weight: 700; display: block; }
table.rap .rap-hint { display: block; font-size: var(--txt-s); font-weight: 400; }
table.rap .rap-sub { padding-left: 1.5rem; display: block; }
table.rap tr.tot { font-weight: 700; }
table.rap tr.tot th, table.rap tr.tot td { border-top: 2px solid var(--groen-mid); }
.rap-noot { font-size: var(--txt-s); margin: 0 0 1rem; }
/* De voorbehoudregel stond tussen twee streepjes: haar eigen bovenrand en
   die van de knoppenrij eronder. Zij krijgt nu hetzelfde groene kader als de
   andere noten op deze schermen; de lijn boven de knoppenrij blijft, want
   die scheidt de inhoud van de bediening op elk scherm. */
.rap-voetnoot {
  font-size: var(--txt-s); font-weight: 700;
  background: var(--groen-bleek); border: 2px solid var(--groen-licht);
  border-radius: var(--radius); padding: 0.9rem 1.1rem; margin: 1.5rem 0 0;
}

/* --- Voet -------------------------------------------------------------- */

.voet {
  border-top: 2px solid var(--groen-licht);
  background: var(--wit);
  padding: 1.5rem 1.25rem;
}
.voet-binnen { max-width: var(--max); margin: 0 auto; font-size: var(--txt-s); }
/* Ruime raakvlakken: de links staan op één regel, maar krijgen elk genoeg
   hoogte om met een vinger te raken. */
.voet-meta { margin: 0; display: flex; flex-wrap: wrap; gap: 0 0.5rem; align-items: center; }
.voet a { color: var(--groen-donker); display: inline-block; padding: 0.5rem 0.2rem; }
.voet .uit { margin-left: 0.2em; text-decoration: none; }

/* --- Smalle schermen --------------------------------------------------- */

@media (max-width: 40rem) {
  :root { --txt-l: 20px; }
  .kop-band { padding: 1.1rem 1rem; }
  .kop-band h1 { font-size: 1.35rem; }
  .romp { padding: 1.1rem 1rem 2.5rem; }
  .kaart { padding: 1.15rem; border-radius: var(--radius); }
  .res-uitgelicht .res-groot { font-size: 1.7rem; }
  .knoprij > .knop { flex: 1 1 100%; }
  .knop-volgende { margin-left: 0; order: -1; }
  input[type="number"], input[type="text"], select, .geld-wrap { max-width: none; }
  .datum-dag input, .datum-jaar input, .datum-maand select { width: 100%; }
  .datum-dag { flex: 0 0 5rem; }
  .datum-maand { flex: 1 1 8rem; }
  .datum-jaar { flex: 1 1 100%; }
  table.data th, table.data td { padding: 0.55rem 0.4rem; font-size: var(--txt-s); }
  table.data thead th { font-size: var(--txt-s); }
  table.rap th, table.rap td { padding: 0.5rem 0.45rem; }
  .tabel-wrap[tabindex] {
    border: 2px dashed var(--groen-mid); border-radius: var(--radius); padding: 0.25rem;
  }
  table.rap th[scope="row"] { width: auto; }
}

/* Zeer smal: tabellen stapelen, zodat niemand horizontaal hoeft te schuiven. */
@media (max-width: 30rem) {
  table.stapel, table.stapel tbody, table.stapel tr, table.stapel th, table.stapel td { display: block; }
  table.stapel thead { display: none; }
  /* `:not(.sr-only)`: zonder dat maakt `width: 100%` een onzichtbare,
     absoluut gepositioneerde caption alsnog schermbreed, en schuift de
     pagina horizontaal. */
  table.stapel caption:not(.sr-only) { display: block; width: 100%; }
  table.stapel tr {
    border: 2px solid var(--groen-licht); border-radius: var(--radius);
    margin: 0 0 0.6rem; padding: 0.35rem 0.6rem; background: var(--wit);
  }
  table.stapel tbody tr:nth-child(even) { background: var(--wit); }
  table.stapel th[scope="row"] {
    border: 0; padding: 0.35rem 0; font-weight: 700; text-align: left; background: none;
  }
  table.stapel td {
    border: 0; border-top: 1px solid var(--groen-licht);
    padding: 0.4rem 0; text-align: right;
    display: flex; gap: 1rem; justify-content: space-between; align-items: baseline;
  }
  table.stapel td::before {
    content: attr(data-k); text-align: left; font-size: var(--txt-s); font-weight: 400;

  table.rap.stapel th[scope="row"] { padding-bottom: 0.15rem; }
  table.rap.stapel .rap-hint { font-weight: 400; }
  table.stapel td.gekozen { box-shadow: none; border-left: 5px solid var(--groen-mid); padding-left: 0.5rem; }
  table.stapel tr.sectierij, table.stapel tr.totaal, table.stapel tr.tot {
    background: var(--groen-licht); border-color: var(--groen-mid);
  }
  table.stapel tr.sectierij th { padding: 0.25rem 0; }
  .tabel-wrap[tabindex] { border: 0; padding: 0; }
  table.rap.stapel th[scope="row"] { width: auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* --- Afdrukken --------------------------------------------------------- */

@media print {
  body { background: var(--wit); font-size: 11pt; }
  .kop-band { background: var(--wit); color: var(--groen-donker); padding: 0 0 0.5cm; border-bottom: 2pt solid var(--groen-donker); }

}

  function toonBedrag(waarde) {

  function knoprij(stap) {
    var lijst = invoerStappen();
    var laatste = lijst[lijst.length - 1];
    var detail = stap === 'resultaat' && v.subscherm === 'detail';
    /* Het detailscherm hangt aan dezelfde workflowstap als de controle, dus
       "Vorige" zou daar naar de vórige invoerstap springen. Het krijgt daarom
       een eigen terugknop. */
    var terug = stap !== 'persoonlijk';
    var knoppen = '';
    if (terug) knoppen += '<button type="button" class="knop knop-tweede" data-nav="terug">Vorige</button>';
    /* Tussen de genummerde stappen schakelt u met Vorige en Volgende, overal
       hetzelfde. De twee zijsprongen vanaf de controle houden hun eigen naam,
       want die zeggen waar u heen gaat en zijn geen volgende stap. */
    if (detail || stap === 'parameters') {
      knoppen += '<button type="button" class="knop knop-tweede" data-nav="afdruk">Afdrukken of opslaan als pdf</button>';
    } else if (stap === 'resultaat') {
      knoppen += '<button type="button" class="knop knop-tweede" data-nav="afdruk">Afdrukken of opslaan als pdf</button>';
      knoppen += '<button type="button" class="knop knop-tweede" data-nav="detail">Mijn pensioen na invaren</button>';
      knoppen += '<button type="button" class="knop knop-tweede" data-nav="verder">Het volledige rapport</button>';
    } else {
      knoppen += '<button type="button" class="knop knop-volgende" data-nav="verder">Volgende</button>';
    }
    return '<div class="knoprij">' + knoppen + '</div>';
  }

  /* ----------------------------------------------------- invoerschermen */

  function briefGeldVeld(id, naam, label, waarde, stap, hint, eenheid) {
    return veld('<label for="' + id + '">' + esc(label) + '</label>' +
      geldInvoer(id, 'data-brief="' + naam + '"', waarde, eenheid) +
      (hint ? '<p class="hint">' + esc(hint) + '</p>' : ''));
  }

  /**
   * Scherm 2: wat u nu ontvangt, overgenomen van uw eigen UPO's.
   *
   * Dit is bewust een andere bron dan de brief. Komt alles uit de brief, dan
   * rekent de calculator met de cijfers die hij moet controleren en valt een
   * ontbrekend pensioen nergens op. Met de UPO's ernaast wel.
   *
   * De kern kent één bruto bedrag en één nabestaandenpensioen; de regels
   * hieronder worden daarvoor opgeteld. Dat is exact: de kapitaalwaarde is
   * lineair in het pensioenbedrag.
   */
  function schermNu() {
    var i = ctrl.status().inputs;
    var meer = v.aantalUpo > 1;
    var regels = '';
    for (var n = 0; n < v.aantalUpo; n++) {
      var r = v.upo[n] || {bruto: null, np: null};
      var kop = meer ? '<h3 class="groep-kop">UPO ' + (n + 1) + '</h3>' : '';
      var paar =
        upoVeld('in-upo-' + n + '-bruto', n, 'bruto',
          'Ouderdomspensioen', r.bruto, '') +
        (i.hasPartner
          ? upoVeld('in-upo-' + n + '-np', n, 'np',
              'Nabestaandenpensioen', r.np, '')
          : '') +
        (i.highLow
          ? upoVeld('in-upo-' + n + '-laag', n, 'laag',
              'Ouderdomspensioen laag', r.laag, '')
          : '');
      regels += kop + '<div class="bedrag-paar">' + paar + '</div>';
    }

    var extra = '';
    if (v.aowAan) {
      extra += geldVeld('in-aowjaar', 'aowJaar',
          'AOW-compensatiepensioen', v.aowJaar,
          100, 'Dit pensioen krijgt bij het invaren een eigen verhoging en wordt daarom apart ' +
          'bijgehouden.', null, 'veld-groep');
    }

    return '<h2 id="staptitel" tabindex="-1">Uw pensioen nu</h2>' +
      '<p class="kaart-intro">Neem deze bedragen over van uw UPO\u2019s van mei 2026, niet uit ' +
      'de brief. ' +
      'Juist doordat ze van een andere bron komen, valt het op wanneer er in de brief iets ' +
      'ontbreekt.</p>' +
      foutenBlok() + regels + extra + totaalBlok(i);
  }

  /* Een berekening kost ongeveer een derde seconde. Daarom pas rekenen als het
     typen even stilvalt, niet bij elke toetsaanslag. */
  var kvTimer = null;
  function planKapitaalwaarde() {
    if (kvTimer) clearTimeout(kvTimer);
    kvTimer = setTimeout(werkKapitaalwaardeBij, 350);
  }

  /**
   * Waarom de kapitaalwaarde er nog niet staat. De codes komen van de kern
   * (`validateForCalculation`); het scherm beslist alleen welke tekst erbij
   * hoort. De knipdatum verdient een eigen zin: die staat op de vorige stap,
   * dus zonder uitleg is hij hier niet te vinden.
   */
  function toonReden() {
    var vak = document.getElementById('kv-reden');
    if (!vak) return;
    var codes = K.validateForCalculation(ctrl.status().inputs);
    var tekst = '';
    if (codes.indexOf('MISSING_CUTOVER') >= 0) {
      tekst = 'De kapitaalwaarde kan nog niet worden berekend: de datum waarop het lagere ' +
        'bedrag ingaat ontbreekt. Ga met Vorige terug naar uw gegevens om hem in te vullen.';
    } else if (codes.length) {
      tekst = 'Zodra alle bedragen zijn ingevuld, verschijnt hier de kapitaalwaarde.';
    }
    vak.textContent = tekst;
    vak.hidden = tekst === '';
  }

  function werkKapitaalwaardeBij() {
    toonReden();
    var el = document.getElementById('kv-op');
    if (!el) return;
    var zet = function (id, waarde) {
      var cel = document.getElementById(id);
      if (cel) cel.textContent = (typeof waarde === 'number' && isFinite(waarde))
        ? eur(waarde) : '\u2014';
    };
    var leeg = function () { ['kv-op', 'kv-np', 'kv-aowc', 'kv-totaal'].forEach(function (id) {
      zet(id, null);
    }); };

    var invoer = K.invoerUitBesturingV4(ctrl.status());
    if (!invoer) { leeg(); return; }
    var dg = K.CONFIG.dekkingsgraden[0];
    var config = Object.assign({}, K.CONFIG, {dekkingsgraden: [dg]});
    var uitkomst = K.berekenInvaar(invoer, config, {
      dekkingsgraden: [dg], methodes: ['standaard'], methodevergelijking: false
    });
    if (!uitkomst.ok) { leeg(); return; }
    var sc = uitkomst.scenarios[K.dekkingsgraadSleutelV4(dg)].standaard;
    /* De splitsing komt uit de tussenresultaten: `KV_OP + KV_NP` is exact
       `kapitaalwaarde`. Het AOW-compensatiepensioen heeft een eigen `KV` die
       daar niet in zit. */
    var m1 = sc.tussenresultaten.m1 || {};
    var aow = sc.tussenresultaten.aowUitkomst;
    zet('kv-op', m1.KV_OP);
    zet('kv-np', m1.KV_NP);
    zet('kv-aowc', aow ? aow.KV : null);
    zet('kv-totaal', sc.kapitaalwaarde + (aow ? aow.KV : 0));
  }

  function upoVeld(id, n, soort, label, waarde, hint, eenheid) {
    return veld('<label for="' + id + '">' + esc(label) + '</label>' +
      geldInvoer(id, 'data-upo="' + n + '" data-soort="' + soort + '"', waarde, eenheid) +
      (hint ? '<p class="hint">' + esc(hint) + '</p>' : ''));
  }

  /**
   * Overzicht van de aanspraken, zodat het naast de brief te leggen is. Bij een
   * hoog-laag-regeling komt er een tweede tabel voor de periode vanaf de
   * knipdatum. Alleen het ouderdomspensioen verandert daar: de kern kent één
   * nabestaandenpensioen en één AOW-compensatiepensioen, die niet met de knip
   * meebewegen.
   */
  /** `kvId` is gezet wanneer de regel ook een kapitaalwaarde krijgt. */
  function overzichtRij(label, waarde, id, kvId) {
    return '<tr><th scope="row">' + esc(label) + '</th>' +
      '<td data-k="bruto per jaar" id="' + id + '">' + eur(waarde || 0) + '</td>' +
      (kvId ? '<td data-k="kapitaalwaarde" id="' + kvId + '">\u2014</td>' : '') +
      '</tr>';
  }

  function overzichtTabel(kop, rijen, metKapitaal) {
    return '<div class="tabel-wrap"><table class="data stapel">' +
      '<caption class="sr-only">' + esc(kop) + '</caption>' +
      '<thead><tr><th scope="col">' + esc(kop) + '</th>' +
      '<th scope="col">Bruto per jaar</th>' +
      (metKapitaal ? '<th scope="col">Kapitaalwaarde</th>' : '') +
      '</tr></thead><tbody>' + rijen + '</tbody></table></div>';
  }

  function totaalBlok(i) {
    if (v.aantalUpo < 2 && !v.aowAan && !i.hasPartner && !i.highLow) return '';
    var rijen = overzichtRij('Ouderdomspensioen', i.grossAnnual, 'tot-op', 'kv-op');
    if (i.hasPartner) {
      rijen += overzichtRij('Nabestaandenpensioen', i.partnerGrossAnnual, 'tot-np', 'kv-np');
    }
    if (v.aowAan) {
      rijen += overzichtRij('AOW-compensatiepensioen', v.aowJaar, 'tot-aow', 'kv-aowc');
    }
    if (i.hasPartner || v.aowAan) {
      /* Alle kapitaalwaarden tellen op: het zijn contante waarden op dezelfde
         datum. Dat ze apart worden berekend, elk met hun eigen verhoging, staat
         daar los van. De bruto bedragen tellen niet op, want het
         nabestaandenpensioen gaat pas in na overlijden; die cel blijft leeg. */
      rijen += '<tr class="totaal"><th scope="row">Samen</th>' +
        '<td data-k="bruto per jaar">\u2014</td>' +
        '<td data-k="kapitaalwaarde" id="kv-totaal">\u2014</td></tr>';
    }
    var uit = overzichtTabel('Overzicht voor invaren', rijen, true);
    var noten = [];
    if (i.hasPartner) {
      noten.push('De kapitaalwaarden tellen op; de bruto bedragen niet, want het ' +
        'nabestaandenpensioen gaat pas in na uw overlijden.');
    }
    if (v.aowAan) {
      noten.push('Het AOW-compensatiepensioen krijgt bij het invaren een eigen, iets hogere ' +
        'verhoging; daarom rekent de calculator het apart door. De kapitaalwaarde telt gewoon ' +
        'mee in het totaal.');
    }
    /* Leeg en verborgen tot `toonReden` hem vult; zonder `hidden` staat er bij
       het tekenen een leeg omlijnd vak tot de wachttijd van 350 ms voorbij is. */
    uit += '<p class="noot" id="kv-reden" hidden></p>' +
      (noten.length ? '<p class="noot">' + esc(noten.join(' ')) + '</p>' : '');
    if (i.highLow) {
      var vanaf = isoUit(v.knip) ? datumNl(isoUit(v.knip)) : 'de knipdatum';
      var rijen2 = overzichtRij('Ouderdomspensioen', i.lowGrossAnnual, 'tot2-op');
      if (i.hasPartner) {
        rijen2 += overzichtRij('Nabestaandenpensioen', i.partnerGrossAnnual, 'tot2-np');
      }
      if (v.aowAan) rijen2 += overzichtRij('AOW-compensatiepensioen', v.aowJaar, 'tot2-aow');
      var ongewijzigd = [];
      if (i.hasPartner) ongewijzigd.push('het nabestaandenpensioen');
      if (v.aowAan) ongewijzigd.push('het AOW-compensatiepensioen');
      var staart = ongewijzigd.length === 0 ? ''
        : ' ' + ongewijzigd.join(' en ').replace(/^h/, 'H') +
          (ongewijzigd.length > 1 ? ' lopen' : ' loopt') + ' ongewijzigd door.';
      uit += overzichtTabel('Overzicht vanaf ' + vanaf, rijen2) +
        '<p class="noot">Alleen het ouderdomspensioen verandert op de knipdatum.' +
        staart + '</p>';
    }
    return uit;
  }

  /** Scherm 3: wat de brief zegt dat het wordt. */
  /**
   * Scherm: de dekkingsgraad uit de brief.
   *
   * Dit is het moment in de route waarop de dekkingsgraad nodig is: alles
   * daarna wordt erop gebaseerd. `bereken()` geeft hem mee aan de kern, en
   * de kern bouwt de gevoeligheidskolommen eromheen. Daarom staat hij op een
   * eigen stap, vóór de bedragen uit de brief: die zijn referentiemateriaal
   * voor de vergelijking en sturen de berekening niet.
   *
   * Wat de dekkingsgraad bepaalt, is beide kanten van de verdeling: hoe groot
   * het te verdelen overschot is (het fondsvermogen schuift ermee mee, de
   * reserves niet) en welk deel daarvan bij deze deelnemer terechtkomt. De
   * kapitaalwaarde nu hangt er niet van af; die komt uit M1.
   */
  function schermDg() {
    return '<h2 id="staptitel" tabindex="-1">De dekkingsgraad uit uw brief</h2>' +
      '<p class="kaart-intro">Dit is het enige getal uit uw brief dat de calculator nodig ' +
      'heeft om te rekenen. Het bepaalt hoe groot de te verdelen buffer is en welk deel ' +
      'daarvan bij u terechtkomt — en daarmee uw kapitaal en uw pensioen ná ' +
      'invaren. De andere bedragen uit uw brief vraagt de calculator later, bij de ' +
      'vergelijking.</p>' +
      foutenBlok() +
      veld('<label for="in-brief-dg">Dekkingsgraad op de invaardatum</label>' +
        '<span class="geld-wrap">' +
        '<span class="geld-teken" id="in-brief-dg-eenheid">%</span>' +
        '<input type="text" id="in-brief-dg" data-brief="dg" inputmode="decimal" ' +
        'aria-describedby="in-brief-dg-eenheid" ' +
        'autocomplete="off" value="' + esc(v.brief.dg) + '"></span>' +
        '<p class="hint">U vindt dit getal in de brief met de persoonlijke berekening ' +
        'van november 2026. Neem het over zoals het er staat: 140 als het een rond getal ' +
        'is, 138,7 als er cijfers achter de komma staan.</p>');
  }

  /**
   * Scherm: de bedragen uit de brief, in dezelfde vorm als stap 2.
   *
   * De aanname is dat de persoonlijke berekening van SSPF de huidige
   * UPO-bedragen naast die ná invaren zet. Wie op stap 2 zijn UPO overnam,
   * herkent hier dus dezelfde regels en vult ze in met de nieuwe bedragen.
   * Daardoor kan de controle regel voor regel vergelijken en hoeft niemand
   * zelf op te tellen of te herleiden.
   *
   * Deze bedragen gaan de berekening NIET in; die is al klaar. Ze staan in
   * `v.briefUpo` en `v.briefAowJaar`, naast de besturing om.
   */
  function schermBrief() {
    var i = ctrl.status().inputs;
    var meer = v.aantalUpo > 1;
    var sc = huidigScenario();
    var na = sc ? naInvaren(sc) : {};
    /* De kern rekent met de opgetelde UPO's, dus er is per soort \u00e9\u00e9n uitkomst.
       Die wordt over de regels verdeeld naar rato van wat op stap 2 stond; de
       verhoging is \u00e9\u00e9n percentage over het hele ouderdoms- en
       nabestaandenpensioen, dus dat is precies wat de kern zou uitrekenen als
       de UPO's los waren ingevoerd. Zie `verdeelOverUpo`. */
    var deel = function (soort) {
      return verdeelOverUpo(na[soort] === undefined ? null : na[soort],
        v.upo.map(function (r) {
          var w = r ? r[soort] : null;
          /* Leeg "laag" betekent op stap 2: dit pensioen verandert niet. */
          if ((w === null || w === undefined) && soort === 'laag') w = r ? r.bruto : null;
          return (w === null || w === undefined) ? null : w;
        }));
    };
    var naBruto = deel('bruto'), naNp = deel('np'), naLaag = deel('laag');
    var nuVan = function (n, soort) {
      var r = v.upo[n];
      if (!r) return null;
      var w = r[soort];
      if ((w === null || w === undefined) && soort === 'laag') w = r.bruto;
      return (w === null || w === undefined) ? null : w;
    };

    var regels = '';
    for (var n = 0; n < v.aantalUpo; n++) {
      var r = v.briefUpo[n] || {bruto: null, np: null, laag: null};
      var kop = meer ? '<h3 class="groep-kop">UPO ' + (n + 1) + '</h3>' : '';
      var paar =
        briefUpoVeld('in-briefupo-' + n + '-bruto', n, 'bruto',
          'Ouderdomspensioen', r.bruto, referentie(nuVan(n, 'bruto'), naBruto[n])) +
        (i.hasPartner
          ? briefUpoVeld('in-briefupo-' + n + '-np', n, 'np',
              'Nabestaandenpensioen', r.np, referentie(nuVan(n, 'np'), naNp[n]))
          : '') +
        (i.highLow
          ? briefUpoVeld('in-briefupo-' + n + '-laag', n, 'laag',
              'Ouderdomspensioen laag', r.laag, referentie(nuVan(n, 'laag'), naLaag[n]))
          : '');
      regels += kop + '<div class="bedrag-paar">' + paar + '</div>';
    }

    var extra = '';
    if (v.aowAan) {
      extra += veld('<label for="in-briefaow">AOW-compensatiepensioen</label>' +
          geldInvoer('in-briefaow', 'data-briefaow="1"', v.briefAowJaar, '\u20ac/jaar') +
          referentie(v.aowJaar, na.aow === undefined ? null : na.aow),
        'veld-groep');
    }
    var aowU = sc ? sc.tussenresultaten.aowUitkomst : null;
    extra += veld('<label for="in-briefkapitaal">Pensioenkapitaal n\u00e1 invaren</label>' +
        geldInvoer('in-briefkapitaal', 'data-briefkapitaal="1"', v.briefKapitaal, '\u20ac') +
        referentie(sc ? sc.kapitaalwaarde + (aowU ? aowU.KV : 0) : null,
          sc ? sc.pensioenkapitaalNaInvaren + (aowU ? aowU.ppk : 0) : null) +
        '<p class="hint">Het bedrag waarmee u een vast pensioen bij een verzekeraar zou kunnen ' +
        'kopen, inclusief nabestaandenpensioen. In uw brief heet dit het shoprecht.</p>',
      'veld-groep');

    return '<h2 id="staptitel" tabindex="-1">De bedragen uit uw brief</h2>' +
      '<p class="kaart-intro">Neem hier over wat ' + esc(K.CONFIG.shortLabel) + ' in de ' +
      'persoonlijke berekening schrijft dat uw pensioen n\u00e1 het invaren w\u00f3rdt. ' +
      'Het zijn dezelfde regels als bij stap 2. Onder elk vak staat wat dit pensioen nu is ' +
      'en wat deze calculator ervan maakt; vult u iets anders in, dan ziet u dat verschil ' +
      'op de volgende stap.</p>' +
      foutenBlok() + regels + extra;
  }

  function briefUpoVeld(id, n, soort, label, waarde, ref) {
    return veld('<label for="' + id + '">' + esc(label) + '</label>' +
      geldInvoer(id, 'data-briefupo="' + n + '" data-briefsoort="' + soort + '"',
        waarde, '\u20ac/jaar') + (ref || ''));
  }

  function schermGegevens(s) {
    var i = s.inputs;
    /* Grenzen van de oorspronkelijke calculator (invaarcalculator.nl):
       deelnemer jaar-110 t/m jaar-67, partner jaar-110 t/m jaar-18. Daar is
       het peiljaar `new Date().getFullYear()`; hier is het de invaardatum,
       zoals overal in dit pakket. Dat scheelt één jaar aan de bovengrens en
       houdt de weergave vrij van een klok.

       De bovengrens van de deelnemer is niet jaar-67 maar JONGSTE_JAAR: de
       AOW-leeftijd is hier niet de bindende, de pensioengerechtigde leeftijd
       van het reglement wel. Zie de toelichting bij die constante. Zo zegt
       deze lijst hetzelfde als het openingsscherm. */
    var inhoud =
      datumVelden('dob', v.dob, 'Uw geboortedatum', MAX_JAAR - 110, JONGSTE_JAAR) +
      geslachtVeld('in-g', 'geslacht', 'Uw geslacht', s.geslacht) +
      jaNee('in-partner', 'partner',
        'Heeft uw partner recht op nabestaandenpensioen na uw overlijden?', i.hasPartner);
    if (i.hasPartner) {
      inhoud += '<div class="vervolg">' +
        datumVelden('dobPartner', v.dobPartner, 'Geboortedatum van uw partner',
          MAX_JAAR - 110, MAX_JAAR - 18) +
        geslachtVeld('in-g-partner', 'partnerGeslacht', 'Geslacht van uw partner',
          s.partnerGeslacht) +
        '</div>';
    }
    inhoud += jaNee('in-hooglaag', 'hoogLaag',
      'Ontvangt u nu tijdelijk een hoger pensioen dat later lager wordt?', i.highLow,
      'Een regeling waarbij u eerst een hoger en vanaf een afgesproken datum (knipdatum) in ' +
      MAX_JAAR + ' of later een lager pensioen ontvangt.');
    if (i.highLow) {
      /* Een datum op of vóór de invaardatum is geen fout: de kern rekent dan
         met het lagere bedrag, want dat ontvangt u op de invaardatum al, en
         meldt dat zelf op het controlescherm (`KNIP_VOOR_INVAARDATUM`). */
      inhoud += '<div class="vervolg">' +
        /* Vanaf het jaar van de invaardatum, zoals de vraag hierboven zegt,
           t/m +30; de oorspronkelijke calculator hanteert dezelfde span vanaf
           het huidige jaar. Een eerdere verlaging hoort bij Nee: wie toen al
           is gezakt, ontvangt nu geen hoger pensioen meer. */
        datumVelden('knip', v.knip, 'Datum waarop het lagere bedrag ingaat',
          MAX_JAAR, MAX_JAAR + 30, true) +
        '</div>';
    }
    inhoud += keuzeKnoppen('in-aantal-upo', 'data-aantal', 'aantalUpo',
      'Hoeveel UPO\u2019s heeft u voor uw ouderdomspensioen?',
      [['1', '1'], ['2', '2'], ['3', '3']], String(v.aantalUpo),
      'Bouwde u bij ' + K.CONFIG.shortLabel + ' pensioen op onder verschillende ' +
      'pensioenreglementen, dan heeft u voor elk van deze pensioenen in mei 2026 een aparte ' +
      'UPO ontvangen. Een aparte UPO voor een AOW-compensatiepensioen telt hier niet mee; ' +
      'daar is de vraag hieronder voor.');
    inhoud += jaNee('in-aow', 'aow',
      'Heeft u een apart AOW-compensatiepensioen, met een eigen UPO?', v.aowAan);
    return '<h2 id="staptitel" tabindex="-1">Uw gegevens</h2>' +
      foutenBlok() + inhoud;
  }

  /* -------------------------------------------------------- berekeningen */

  function huidigScenario() {
    if (!v.resultaat) return null;
    var sleutel = K.dekkingsgraadSleutelV4(Number(v.dgKeuze) / 100);
    var perDg = v.resultaat.scenarios[sleutel];
    return perDg ? perDg.standaard : null;
  }

  /**
   * De dekkingsgraad uit de brief, van procenten naar de fractie die de kern
   * gebruikt. Dit is een eenheidsomrekening, geen modelformule; de afronding
   * op 0,001 procentpunt houdt drijvende-kommaruis uit de sleutel.
   */
  function briefDg() {
    /* Het veld toont al een %-teken, maar wie het toch intypt ("140%") hoort
       daar geen foutmelding voor te krijgen: de bedoeling is onmiskenbaar.
       Alles wat geen cijfer, komma of punt is, gaat eruit. Een komma is het
       decimaalteken; een punt laten we staan, want in een dekkingsgraad is
       die nooit een duizendtalscheiding. (Bij geldbedragen is dat anders;
       die gaan daarom door `naarGetal()` en niet hierlangs.) */
    var ruw = String(v.brief.dg).replace(/[^0-9.,]/g, '').replace(',', '.').trim();
    if (ruw === '') return null;
    var p = Number(ruw);
    if (!isFinite(p) || p <= 0) return null;
    return Math.round(p * 1000) / 100000;
  }

  /* De dekkingsgraad zoals hij op het scherm hoort te staan. Uit `briefDg()`
     en dus uit de gelezen waarde, niet uit de ruwe invoer: wie "140%" typt
     zou anders "140%%" terugzien, en wie "138.7" typt een punt in plaats van
     een komma. Leeg of onleesbaar geeft null; de aanroeper beslist wat er
     dan staat. */
  function dgTekst() {
    var dg = briefDg();
    if (dg === null) return null;
    return (dg * 100).toLocaleString('nl-NL', {maximumFractionDigits: 3}) + '%';
  }

  function bereken() {
    var status = ctrl.status();
    var invoer = K.invoerUitBesturingV4(status);
    if (!invoer) { v.fouten = ['MISSING_ROUTE']; return false; }

    var dg = briefDg();
    if (dg === null) { v.fouten = ['GEEN_DEKKINGSGRAAD']; v.resultaat = null; return false; }
    /* Of deze dekkingsgraad in de staffel valt, beslist de kern, niet dit
       scherm. Onder de ondergrens is er geen transitiebijdrage en rekent
       `berekenInvaar` het scenario helemaal niet door. */
    if (K.bijstortVoorDekkingsgraadV4(dg, K.CONFIG) === null) {
      v.fouten = ['DEKKINGSGRAAD_BUITEN_STAFFEL']; v.resultaat = null; return false;
    }

    /* De negen roosterwaarden in de configuratie zijn een keuzelijst, geen
       rekenregel: `bijstortVoorDekkingsgraadV4` werkt op elke dekkingsgraad
       vanaf de ondergrens. Door hier precies de dekkingsgraad uit de brief
       mee te geven, rekent de kern op hetzelfde uitgangspunt als de brief.
       De band eromheen (±2,5 procentpunt) komt daarna uit de
       gevoeligheidsmatrix van de kern zelf. */
    var config = Object.assign({}, K.CONFIG, { dekkingsgraden: [dg] });
    v.dgKeuze = K.dekkingsgraadSleutelV4(dg);

    var uitkomst = K.berekenInvaar(invoer, config, {
      dekkingsgraden: [dg],
      methodes: ['standaard'],
      methodevergelijking: false
    });
    if (!uitkomst.ok) {
      v.fouten = uitkomst.fouten.map(function (f) { return f.code; });
      v.resultaat = null;
      return false;
    }
    v.resultaat = uitkomst;
    v.resultaatRevisie = status.revision;
    v.fouten = [];
    return true;
  }

  /* --------------------------------------------------- resultaatscherm */

  var METRIEKEN = [
    ['pct', '% ten opzichte van nu'],
    ['na_jaar', 'Na invaren per jaar'],
    ['na_maand', 'Na invaren per maand'],
    ['versch_jaar', 'Verschil per jaar'],
    ['versch_maand', 'Verschil per maand']
  ];

  function celTekst(cel, bruto) {
    if (!cel || !cel.beschikbaar) return '—';
    switch (v.metriek) {
      case 'na_jaar': return eur(cel.jaar);
      case 'na_maand': return bruto ? eurCent(cel.maand) : eur(cel.maand);
      case 'versch_jaar': return eurGetekend(cel.verschilJaar);
      case 'versch_maand': return bruto ? eurCentGetekend(cel.verschilMaand) : eurGetekend(cel.verschilMaand);
      default: return cel.pct === null ? '—' : pctGetekend(cel.pct);
    }
  }

  function bedragRij(label, kolom, bruto, getekend, eenheid) {
    var maand = getekend
      ? (bruto ? eurCentGetekend(kolom.maand) : eurGetekend(kolom.maand))
      : (bruto ? eurCent(kolom.maand) : eur(kolom.maand));
    var jaar = getekend ? eurGetekend(kolom.jaar) : eur(kolom.jaar);
    return '<tr><th scope="row">' + esc(label) + '</th>' +
      '<td data-k="' + esc(eenheid + ' per maand') + '">' + maand + '</td>' +
      '<td data-k="' + esc(eenheid + ' per jaar') + '">' + jaar + '</td></tr>';
  }

  function vergelijkingsRijen(vg, bruto, eenheid) {
    return bedragRij('Nu', vg.nu, bruto, false, eenheid) +
      bedragRij('Na invaren', vg.na, bruto, false, eenheid) +
      bedragRij('Verschil', vg.verschil, bruto, true, eenheid);
  }

  function hoofdtabel(sc, eenheid) {
    var bruto = eenheid === 'bruto';
    var kop = '<thead><tr><th scope="col">&nbsp;</th>' +
      '<th scope="col">' + eenheid + ' per maand</th>' +
      '<th scope="col">' + eenheid + ' per jaar</th></tr></thead>';
    var body = '';
    if (sc.aowCompensatie) {
      /* Geen "(UPO 1)" en "(UPO 2)" erachter: dit scherm telt meerdere UPO's
         op, dus die nummers kloppen hier niet. De pensioenen staan er al met
         hun eigen naam; het nummer voegde niets toe. */
      body += '<tr class="sectierij"><th scope="row" colspan="3">Ouderdomspensioen</th></tr>' +
        vergelijkingsRijen(sc.ouderdomspensioen, bruto, eenheid) +
        '<tr class="sectierij"><th scope="row" colspan="3">AOW-compensatiepensioen</th></tr>' +
        vergelijkingsRijen(sc.aowCompensatie, bruto, eenheid) +
        '<tr class="sectierij"><th scope="row" colspan="3">Totaal</th></tr>' +
        vergelijkingsRijen(sc.totaal, bruto, eenheid);
    } else {
      body += vergelijkingsRijen(sc.ouderdomspensioen, bruto, eenheid);
    }
    return '<div class="tabel-wrap"><table class="data stapel">' +
      '<caption>Uw pensioen nu en na invaren</caption>' + kop +
      '<tbody>' + body + '</tbody></table></div>';
  }

  function gevoeligheidsTabel(sc, bruto) {
    if (!sc.tabel) return '';
    var t = sc.tabel;
    /* Alleen de middelste rij: de twee nevenrijen projecteren uit hetzelfde
       kapitaal en tonen een rentegevoeligheid die bij consistente doorrekening
       vrijwel wegvalt (zie OVERDRACHT, bevinding oktober 2026). */
    var rij = 1;
    var kop = t.kolommen.map(function (k) {
      return '<th scope="col"' + (k.gekozen ? ' class="gekozen"' : '') + '>' +
        pct(k.dekkingsgraad) + (k.gekozen ? '<span class="sr-only"> (uw keuze)</span>' : '') + '</th>';
    }).join('');
    var cellen = t.kolommen.map(function (k, kol) {
      return '<td' + (k.gekozen ? ' class="gekozen"' : '') +
        ' data-k="dekkingsgraad ' + esc(pct(k.dekkingsgraad)) + '">' +
        celTekst(t.cellen[rij][kol], bruto) + '</td>';
    }).join('');
    var metriekLabel = METRIEKEN.filter(function (m) { return m[0] === v.metriek; })[0][1];
    return '<h3 class="rap-kop">Als de dekkingsgraad anders uitvalt</h3>' +
      '<div class="metriek-keuze"><label for="in-metriek">Wat de cellen tonen</label>' +
      '<select id="in-metriek" data-metriek>' +
      METRIEKEN.map(function (m) {
        return '<option value="' + m[0] + '"' + (m[0] === v.metriek ? ' selected' : '') + '>' +
          esc(m[1]) + '</option>';
      }).join('') + '</select></div>' +
      '<div class="tabel-wrap"><table class="data stapel">' +
      '<caption>Uw pensioen na invaren bij een andere dekkingsgraad op de invaardatum</caption>' +
      '<thead><tr><th scope="col">Dekkingsgraad</th>' + kop + '</tr></thead>' +
      '<tbody><tr><th scope="row">' + esc(metriekLabel) + '</th>' + cellen + '</tr></tbody>' +
      '</table></div>';
  }

  function hoogLaagBlok(sc, bruto) {
    if (!sc.hoogLaag) return '';
    var hl = sc.hoogLaag;
    return '<h3 class="rap-kop">Uw hoog-laag-regeling</h3>' +
      '<div class="tabel-wrap"><table class="data stapel">' +
      '<caption>Bruto per jaar, voor en na de afgesproken datum</caption>' +
      '<thead><tr><th scope="col">&nbsp;</th><th scope="col">Nu</th>' +
      '<th scope="col">Na invaren</th><th scope="col">Verschil</th></tr></thead><tbody>' +
      '<tr><th scope="row">Tot de afgesproken datum</th>' +
      '<td data-k="nu">' + eur(hl.voorKnip.nu.jaar) + '</td>' +
      '<td data-k="na invaren">' + eur(hl.voorKnip.na.jaar) + '</td>' +
      '<td data-k="verschil">' + eurGetekend(hl.voorKnip.verschil.jaar) + '</td></tr>' +
      '<tr><th scope="row">Vanaf de afgesproken datum</th>' +
      '<td data-k="nu">' + eur(hl.naKnip.nu.jaar) + '</td>' +
      '<td data-k="na invaren">' + eur(hl.naKnip.na.jaar) + '</td>' +
      '<td data-k="verschil">' + eurGetekend(hl.naKnip.verschil.jaar) + '</td></tr>' +
      '</tbody></table></div>' +
      '<p class="noot">Beide bedragen stijgen met hetzelfde percentage: ' +
      pctGetekend(hl.verhogingsfactor - 1) + '.</p>';
  }

  function schermResultaat() {
    var r = v.resultaat, sc = huidigScenario();
    if (!r || !sc) {
      return '<h2 id="staptitel" tabindex="-1">Mijn pensioen na invaren</h2>' + foutenBlok() +
        '<p>Er is nog geen berekening beschikbaar.</p>';
    }
    var bruto = r.eenheid === 'bruto';
    var tot = sc.totaal;
    var meldingen = r.meldingen.map(function (m) {
      return MELDINGTEKST[m.code] ? '<p class="noot">' + esc(MELDINGTEKST[m.code]) + '</p>' : '';
    }).join('');

    return '<div class="res-kop"><h2 id="staptitel" tabindex="-1">Mijn pensioen na invaren</h2></div>' +
      '<p class="res-sub">Berekend met de bruto bedragen uit uw brief' +
      ' · invaardatum ' + datumNl(K.CONFIG.invaardatum) + '</p>' +
      '<div class="res-uitgelicht">' +
      '<span class="res-label">' + (bruto ? 'Bruto' : 'Netto') + ' per maand na invaren</span>' +
      '<span class="res-groot">' + (bruto ? eurCent(tot.na.maand) : eur(tot.na.maand)) + '</span>' +
      '<span class="res-bij">Nu ' + (bruto ? eurCent(tot.nu.maand) : eur(tot.nu.maand)) +
      ' · verschil ' + (bruto ? eurCentGetekend(tot.verschil.maand) : eurGetekend(tot.verschil.maand)) +
      ' per maand (' + pctGetekend(tot.procentueel) + ')</span></div>' +
      '<div class="dg-keuze"><span class="dg-vast">Gerekend met de dekkingsgraad uit uw brief: ' +
      '<strong>' + esc(dgTekst() || '\u2014') + '</strong></span></div>' +
      hoofdtabel(sc, r.eenheid) +
      gevoeligheidsTabel(sc, bruto) +
      hoogLaagBlok(sc, bruto) +
      '<h3 class="rap-kop">Uitgangspunten van deze uitkomst</h3>' +
      '<div class="tabel-wrap"><table class="data">' +
      '<caption class="sr-only">Uitgangspunten</caption><tbody>' +
      '<tr><th scope="row">Uw leeftijd op de invaardatum</th><td>' +
      r.afgeleid.leeftijd.toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
      ' jaar</td></tr>' +
      '<tr><th scope="row">Rekenrente bij uw leeftijd</th><td>' + pct(r.afgeleid.rente, 2) + '</td></tr>' +
      (r.afgeleid.levensverwachting !== null
        ? '<tr><th scope="row">Verwachte levensduur</th><td>' +
          r.afgeleid.levensverwachting.toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
          ' jaar</td></tr>' : '') +
      '<tr><th scope="row">Kapitaalwaarde nu</th><td>' + eur(sc.kapitaalwaarde) + '</td></tr>' +
      '<tr><th scope="row">Kapitaalwaarde na invaren</th><td>' + eur(sc.pensioenkapitaalNaInvaren) + '</td></tr>' +
      '<tr class="totaal"><th scope="row">Verhoging van de kapitaalwaarde</th><td>' +
      pctGetekend(sc.verhouding - 1) + '</td></tr>' +
      '</tbody></table></div>' +
      meldingen +
      '<p class="noot">Dit is een indicatieve berekening met model ' + esc(r.modelVersie) +
      '. Aan de uitkomsten kunt u geen rechten ontlenen.</p>';
  }

  /* ------------------------------------------------------------- triage */

  /**
   * De openingsvraag uit de oorspronkelijke calculator: voor wie is dit
   * bedoeld, en geldt dat voor u? Deze vraag hoort niet bij de workflow van de
   * kern, want zij bepaalt alleen of iemand verder gaat, en staat daarom in
   * `v.triage`, net als het privacyscherm buiten `maakInputControllerV4`.
   */
  function schermTriage() {
    /* De geboortedatum vervangt "U ontvangt pensioen van SSPF" en "U ontvangt
       AOW": wie op of v\u00f3\u00f3r die datum is geboren, ontvangt op de invaardatum
       allebei. Een datum is bovendien na te kijken; "ontvangt u een regulier
       ouderdomspensioen" vraagt van de lezer een oordeel. De naam van het
       fonds blijft in het eerste punt staan, want dit scherm hoort ook
       iemand zonder SSPF-pensioen weg te sturen. */
    var criteria = [
      'U bent geboren op of v\u00f3\u00f3r ' + JONGSTE_DATUM + ' en ontvangt pensioen van ' +
        K.CONFIG.shortLabel,
      'U heeft de brief met de persoonlijke berekening van november 2026 bij de hand',
      'U heeft voor al uw pensioenen de UPO\u2019s van mei 2026 bij de hand'
    ];
    return '<h2 id="staptitel" tabindex="-1">Voor wie is deze calculator geschikt?</h2>' +
      foutenBlok() +
      '<ul class="triage-criteria">' +
      criteria.map(function (c) {
        return '<li><span class="vink" aria-hidden="true">✓</span>' + esc(c) + '</li>';
      }).join('') +
      '</ul>' +
      '<fieldset class="triage-vraag">' +
      '<legend>Gelden deze drie punten voor u?</legend>' +
      '<label class="keuze keuze-groot"><input type="radio" name="triage" value="ja"' +
      (v.triage === 'ja' ? ' checked' : '') + ' data-triage>' +
      '<span><span class="keuze-titel">Ja, dit klopt</span></span></label>' +
      '<label class="keuze keuze-groot"><input type="radio" name="triage" value="nee"' +
      (v.triage === 'nee' ? ' checked' : '') + ' data-triage>' +
      '<span><span class="keuze-titel">Nee, dit klopt niet</span></span></label>' +
      '</fieldset>' +
      '<div class="knoprij"><button type="button" class="knop knop-volgende" ' +
      'data-nav="triage-verder">Volgende</button></div>';
  }

    return '<h2 id="staptitel" tabindex="-1">Dan kunt u deze calculator nog niet gebruiken</h2>' +
      '<p>De vergelijking werkt alleen wanneer alle drie de punten gelden. Zonder de ' +

      'uw UPO\u2019s van mei 2026 ontbreekt de onafhankelijke bron waarmee die berekening wordt ' +
      'nagerekend. Heeft u die stukken nog niet bij de hand, kom dan terug zodra u ze heeft.</p>' +
      '<p>Bent u ná ' + esc(JONGSTE_DATUM) + ' geboren, dan heeft u op ' +
      datumNl(K.CONFIG.invaardatum) + ' de pensioengerechtigde leeftijd van het reglement ' +
      'nog niet bereikt; die is ' + PENSIOENLEEFTIJD + ' jaar. Deze calculator is gemaakt ' +

      'reden, dan klopt de uitkomst niet. Datzelfde geldt wanneer u geen pensioen van ' +
      esc(K.CONFIG.shortLabel) + ' ontvangt of onder een andere regeling valt.</p>' +

      'data-nav="triage-wijzig">Wijzig uw keuze</button></div>';
  }
