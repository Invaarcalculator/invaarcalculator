<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvaarRentes</title>
<meta name="description" content="Welke rentes bepalen mede uw nieuwe pensioen? De rekenrente die hoort bij uw pensioen vóór invaren, en de projectierente die hoort bij uw kapitaal en uw pensioen na invaren. Rekent volledig in uw eigen browser.">
<meta name="color-scheme" content="light">
<style>
/* ==========================================================================
   InvaarVergelijker: weergavelaag (presentatie)
   Palet: #245447 #51826D #D8E7DB #F4F7F2 #FFFFFF
   Doelgroep 60+: basis 18px, grote velden en knoppen, duidelijke focus.
   Contrast (nagerekend, zie README): tekst altijd #245447 — 8,63:1 op wit,
   7,98:1 op #F4F7F2, 6,73:1 op #D8E7DB.
   #51826D haalt 4,41:1 tegen wit en is daarmee GEEN tekstkleur op 18px en
   GEEN vlak onder witte tekst; gebruik hem alleen als rand of als accentbalk
   zonder tekst erop. Vlakken met witte tekst zijn altijd #245447.
   (Een eerdere versie van deze kop noemde hier 5,2:1 en raadde #51826D juist
   aan als vlak onder witte tekst; dat was onjuist en leverde AA-fouten op.)
   ========================================================================== */

:root {
  --groen-donker: #245447;
  --groen-mid: #51826D;
  --groen-licht: #D8E7DB;
  --groen-bleek: #F4F7F2;
  --wit: #FFFFFF;

  --txt: 18px;
  --txt-s: 16px;
  --txt-l: 21px;
  --radius: 10px;
  --rij: 1.55;
  --veld-hoogte: 3.1rem;
  --max: 56rem;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: var(--txt);
  line-height: var(--rij);
  color: var(--groen-donker);
  background: var(--groen-bleek);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 700; }
p { margin: 0 0 0.85em; }
p:last-child { margin-bottom: 0; }

/* --- Hulpmiddelen ------------------------------------------------------- */

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skiplink {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--groen-donker); color: var(--wit);
  padding: 0.75rem 1.25rem; border-radius: 0 0 var(--radius) 0;
  font-weight: 700; text-decoration: none;
}
.skiplink:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--groen-donker);
  outline-offset: 2px;
}
.kop-band :focus-visible { outline-color: var(--wit); }

/* --- Kop --------------------------------------------------------------- */

.kop-band {
  background: var(--groen-donker);
  color: var(--wit);
  padding: 1.5rem 1.25rem;
}
.kop-binnen {
  max-width: var(--max); margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 0.75rem 2rem;
  align-items: center; justify-content: space-between;
}
.kop-band h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
/* Geen kader en geen vet: in deze band is een afgerond kader een knop, en
   deze regel is tekst. Het onderscheid zit dus in de vorm, niet alleen in de
   tekengrootte. */
/* "InvaarVergelijker" is één woord en breekt uit zichzelf nergens. Bij 200%
   tekst op een smal scherm is het breder dan de kopband, en dan schuift de
   hele pagina horizontaal — precies wat deze opmaak wil voorkomen. In
   `shell.html` staat daarom een <wbr> tussen "Invaar" en "Vergelijker", zodat
   het afbreekpunt op een leesbare plek ligt; `overflow-wrap` vangt af wat
   daarnaast nog te breed wordt. Hernoemt u de calculator, controleer dit dan
   opnieuw: de vorige naam was kort genoeg om het probleem te verbergen. */
.kop-titel { min-width: 0; }
.kop-band h1 { overflow-wrap: break-word; }
/* De ondertitel staat binnen de <h1>, zodat de koptekst één kop blijft: de
   toets eist precies één <h1>, en een tweede kop zou de structuur verdelen
   zonder dat er een tweede onderwerp is. Als blok op een eigen regel, en
   kleiner dan de naam, zodat de naam de kop blijft dragen. */
.kop-sub { display: block; margin: 0.3rem 0 0; font-size: var(--txt-s); font-weight: 400; letter-spacing: 0; }
.kop-waarschuwing { margin: 0.3rem 0 0; font-size: var(--txt-s); }
/* Wit op --groen-donker: 8,63:1. Hoogte volgt --veld-hoogte, net als de
   overige knoppen, zodat ook deze boven de 48px blijft. */
/* Wrap, want het zijn er drie: zonder wrap staan ze op één onbreekbare regel
   en schuift de kopband horizontaal bij 360px of 200% tekst. .kop-binnen
   wrapt al, maar dat verplaatst de groep als geheel. */
.kop-knoppen { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.knop-kop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.5rem 1.1rem;
  border: 2px solid var(--wit); border-radius: var(--radius);
  background: var(--groen-donker); color: var(--wit);
  cursor: pointer;
}
.knop-kop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-kop[aria-pressed="true"] { background: var(--wit); color: var(--groen-donker); }

/* Vervolgvragen die pas verschijnen na een Ja: ingesprongen met een lijn,
   zodat zichtbaar is waar ze bij horen. */
.vervolg {
  border-left: 4px solid var(--groen-licht);
  padding-left: 1.1rem;
  margin: 0 0 1.6rem;
}
.vervolg > :last-child { margin-bottom: 0; }

/* Twee bedragen van hetzelfde UPO naast elkaar; ze breken naar onder elkaar
   zodra er geen ruimte meer is. */
.bedrag-paar { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
/* Labels breken over verschillend veel regels af: "Ouderdomspensioen met
   AOW-compensatie" neemt er twee, "Nabestaandenpensioen" ernaast één. Zonder
   dit zouden de invoervelden op verschillende hoogten beginnen. Elk veld is
   daarom zelf een kolom, en het label rekt uit om de hoogte op te nemen
   (`flex: 1`), zodat wat eronder hangt — het invoervak en de regel met de
   bedragen — bij alle velden op dezelfde hoogte staat.

   Niet met `justify-content: space-between`: dat werkte toen label en invoer
   de enige twee kinderen waren, maar sinds er een regel onder de invoer staat
   duwt het de invoer naar het midden van de overgebleven ruimte, en daar
   belandt hij bij een kort label hoger dan bij een lang. */
.bedrag-paar .veld {
  flex: 1 1 13rem; min-width: 0; margin-bottom: 1.1rem;
  display: flex; flex-direction: column;
}
.bedrag-paar .veld > label { flex: 1 0 auto; }
/* `.veld:last-child` haalt elders de ondermarge weg. In deze rij zou het
   laatste veld daardoor 1,1rem dieper doorlopen dan zijn buren, en dan staat
   zijn invoerveld niet meer op één lijn. Binnen de rij dus gelijke marges. */
.bedrag-paar .veld:last-child { margin-bottom: 1.1rem; }
/* Kop boven een groep invoervelden ("UPO 1", "UPO 2"). Eerder stond hier de
   `.rap-kop` van de rapporttabellen, met een ondermarge van 2rem die bij een
   tabel hoort. Boven invoer telt die op bij de 1,1rem van de velderij erboven,
   waardoor er tussen twee UPO's bijna drie keer zoveel ruimte stond als tussen
   een velderij en het label eronder. Hier hoort de maat van het formulier. */
.groep-kop { font-size: 1.15rem; margin: 0.9rem 0 0.75rem; }
.groep-kop:first-child { margin-top: 0; }
.bedrag-paar .geld-wrap { max-width: none; }

/* --- Keuze uit twee ----------------------------------------------------- */

.keuzeknoppen { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.keuzeknop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  min-width: 7rem;
  padding: 0.6rem 1.5rem;
  border: 2px solid var(--groen-mid); border-radius: var(--radius);
  background: var(--wit); color: var(--groen-donker);
  cursor: pointer;
}
.keuzeknop:hover { background: var(--groen-licht); }
/* De gekozen knop: wit op --groen-donker (8,63:1), plus een dikkere rand,
   zodat het verschil niet alleen in kleur zit. */
.keuzeknop.aan {
  background: var(--groen-donker); color: var(--wit); border-color: var(--groen-donker);
  box-shadow: inset 0 0 0 2px var(--wit);
}

/* --- Openingsvraag ------------------------------------------------------ */

.triage-criteria { list-style: none; margin: 0 0 1.75rem; padding: 0; }
.triage-criteria li {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0; font-weight: 700;
}
.triage-criteria .vink {
  flex: 0 0 auto;
  width: 2rem; height: 2rem; border-radius: var(--radius);
  background: var(--groen-licht); color: var(--groen-donker);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.triage-vraag { border: 0; padding: 0; margin: 0 0 1.5rem; }
.triage-vraag legend { padding: 0 0 0.75rem; font-weight: 700; font-size: var(--txt-l); }
.triage-vraag .keuze { margin: 0 0 0.75rem; }
.keuze-groot .keuze-titel { font-size: var(--txt-l); }

/* Lopende tekst over de volle breedte van de kaart, zoals de disclaimer. */
.lange-tekst { margin: 0 0 1.5rem; }
.lange-tekst p { margin: 0 0 1rem; }

/* --- Privacyscherm ------------------------------------------------------ */

.priv-kaarten { display: flex; flex-direction: column; gap: 1rem; margin: 0 0 1.5rem; }
.priv-kaart {
  border: 2px solid var(--groen-licht); border-radius: var(--radius);
  background: var(--wit); padding: 1.1rem 1.25rem;
}
.priv-kaart.uitgelicht { background: var(--groen-licht); border-color: var(--groen-mid); }
.priv-kaart h3 { font-size: var(--txt); margin: 0 0 0.45rem; }
.priv-kaart p { margin: 0; }
/* Niet het blauw van de browser: tekstkleur is overal --groen-donker. */
.priv-kaart a { color: var(--groen-donker); }

/* --- Romp -------------------------------------------------------------- */

.romp { max-width: var(--max); margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

.voortgang { margin-bottom: 1.25rem; }
.voortgang-tekst { font-weight: 700; margin: 0 0 0.5rem; }
.voortgang-balk {
  height: 0.75rem; background: var(--groen-licht);
  border-radius: 999px; overflow: hidden;
}
.voortgang-vulling {
  display: block; height: 100%; background: var(--groen-mid);
  border-radius: 999px; transition: width 0.25s ease;
}

.kaart {
  background: var(--wit);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 1.75rem;
}
.kaart > h2 {
  font-size: 1.35rem;
  margin: 0 0 0.35rem;
}
.kaart-intro { margin: 0 0 1.5rem; }
.kaart-intro:only-of-type { margin-bottom: 1.25rem; }

/* --- Formulier --------------------------------------------------------- */

.veld { margin: 0 0 1.6rem; }
.veld:last-child { margin-bottom: 0; }
/* Een veld dat zelf een groep begint (AOW-compensatiepensioen, pensioenkapitaal)
   heeft geen kop boven zich. Zonder dit staat het tegen de UPO-groep erboven
   aan terwijl het een ander pensioen is; dezelfde maat als `.groep-kop` zet
   alle groepen op hetzelfde ritme. */
.veld-groep { margin-top: 0.9rem; }
/* Het blok met de vormvragen op stap 5. De laatste vraag verliest zijn
   ondermarge aan `.veld:last-child`; zonder deze regel staat de eerste
   UPO-kop er dichter op dan de vragen op elkaar. */
.brief-vorm { margin-bottom: 0.7rem; }
/* Naam van het pensioen boven de twee vakken "Vóór invaren" en "Ná invaren".
   Kleiner dan `.groep-kop`, want dat is op stap 5 de UPO erboven. */
.paar-kop { font-size: 1.02rem; margin: 0.9rem 0 0.6rem; }
.paar-kop:first-child { margin-top: 0; }
.groep-kop + .paar-kop { margin-top: 0; }
.veld > label, .veld-kop {
  display: block; font-weight: 700; margin-bottom: 0.5rem;
}
.hint { font-size: var(--txt-s); margin: 0.45rem 0 0; }

input[type="number"], input[type="text"], select {
  font: inherit;
  color: var(--groen-donker);
  background: var(--wit);
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 0.6rem 0.75rem;
  min-height: var(--veld-hoogte);
  width: 100%;
  max-width: 22rem;
}
select {
  /* eigen pijl, geen externe bron */
  appearance: none; -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, #245447 50%),
    linear-gradient(135deg, #245447 50%, transparent 50%);
  background-position: right 1.25rem center, right 0.9rem center;
  background-size: 0.42rem 0.42rem, 0.42rem 0.42rem;
  background-repeat: no-repeat;
  padding-right: 2.5rem;
}
input:hover, select:hover { border-color: var(--groen-donker); }
input[aria-invalid="true"] { border-color: var(--groen-donker); border-width: 3px; }

.geld-wrap { display: flex; align-items: stretch; max-width: 22rem; }
/* De eenheid staat voluit in dit vlak ("€/jaar"), dus het is breder dan het
   oude €-teken. `white-space: nowrap` houdt hem op één regel; `flex: 0 0 auto`
   laat hem zijn eigen breedte nemen zonder het invoerveld te verdringen.
   Groen-licht met groen-donkere tekst: ruim boven AA. */
.geld-teken {
  flex: 0 0 auto; display: flex; align-items: center;
  padding: 0 0.75rem; white-space: nowrap;
  background: var(--groen-licht); color: var(--groen-donker);
  border: 2px solid var(--groen-donker); border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  font-variant-numeric: tabular-nums;
}
.geld-wrap input { border-radius: 0 var(--radius) var(--radius) 0; max-width: none; }

/* datum in drie delen */
.datum-rij { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.datum-deel { display: flex; flex-direction: column; }
.datum-deel label { font-size: var(--txt-s); font-weight: 400; margin-bottom: 0.25rem; }
.datum-dag input { width: 5.5rem; }
.datum-jaar input { width: 7.5rem; }
.datum-maand select { width: 11rem; }

/* keuzelijst als grote radio's */
.keuzes { display: grid; gap: 0.85rem; }
.keuze {
  display: flex; gap: 0.9rem; align-items: flex-start;
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  background: var(--wit);
  cursor: pointer;
}
.keuze:hover { background: var(--groen-bleek); }
.keuze input { width: 1.5rem; height: 1.5rem; margin: 0.15rem 0 0; accent-color: #245447; flex: none; }
.keuze:has(input:checked) { background: var(--groen-licht); border-color: var(--groen-donker); border-width: 3px; padding: calc(1rem - 1px) calc(1.1rem - 1px); }
.keuze:focus-within { outline: 3px solid var(--groen-donker); outline-offset: 2px; }
.keuze-titel { display: block; font-weight: 700; }

/* --- Uitlegscherm -------------------------------------------------------
   De drie delen van de doorloop. Een genummerde lijst, want de volgorde is
   de boodschap: eerst wat u nu heeft, dan wat de calculator ervan maakt, dan
   wat SSPF ervan maakt. */
.stappen-uitleg { margin: 0 0 1.5rem; padding-left: 1.6rem; }
.stappen-uitleg li { margin: 0 0 0.8rem; padding-left: 0.3rem; }
.stappen-uitleg li strong { color: var(--groen-donker); }

/* --- Knoppen ----------------------------------------------------------- */

.knoprij {
  display: flex; flex-wrap: wrap; gap: 0.85rem;
  margin-top: 2rem; padding-top: 1.5rem;
  border-top: 2px solid var(--groen-licht);
}
.knop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.65rem 1.6rem;
  border-radius: var(--radius);
  border: 2px solid var(--groen-donker);
  background: var(--groen-donker);
  color: var(--wit);
  cursor: pointer;
}
/* Omkeren in plaats van vergrijzen: wit op --groen-mid haalt 4,41:1 en dus
   geen AA. Omgekeerd is het 8,63:1 en is de hover-stand duidelijker. */
.knop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-tweede { background: var(--wit); color: var(--groen-donker); }
.knop-tweede:hover { background: var(--groen-licht); }
.knop-volgende { margin-left: auto; }

/* --- Meldingen --------------------------------------------------------- */

.fouten {
  border: 2px solid var(--groen-donker);
  border-left-width: 10px;
  border-radius: var(--radius);
  background: var(--groen-licht);
  padding: 1rem 1.1rem;
  margin: 0 0 1.5rem;
}
.fouten h3 { font-size: var(--txt); margin-bottom: 0.35rem; }
.fouten ul { margin: 0; padding-left: 1.3rem; }
.fouten li { margin: 0.2rem 0; }

.noot {
  background: var(--groen-bleek);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 0.9rem 1.1rem;
  font-size: var(--txt-s);
  margin: 0 0 1rem;
}
/* Advies over de schermbreedte, op het uitlegscherm. Staat op elke breedte.

   Eerder verscheen hij alleen onder 30rem, daar waar de tabellen stapelen.
   Dat was logischer, maar gedrag dat je op een breed scherm nooit te zien
   krijgt, wordt bij onderhoud over het hoofd gezien — het viel zelfs bij de
   eigen oplevering niet op. Nu staat hij er altijd, iets kleiner dan de
   lopende tekst, en op papier helemaal niet (zie `@media print`).

   Gemeten op 01-11-2026 (3 UPO's, partner, hoog/laag, AOW-compensatie): de
   vergelijking kost 6,7 schermhoogtes op 360px breed en 2,6 vanaf 481px —
   dezelfde 2,6 als op een laptop van 1280px. Er loopt op geen enkele breedte
   iets over, van 320px tot 1280px; dit is dus een advies en geen eis, en er
   wordt niemand tegengehouden. Wie alleen een telefoon heeft, kan door. */
.scherm-advies { font-style: italic; margin: 0 0 1.25rem; }

.tabel-wrap { overflow-x: auto; margin: 0 0 1.5rem; }
table.data {
  border-collapse: collapse;
  width: 100%;
  font-variant-numeric: tabular-nums;
}
table.data caption {
  text-align: left; font-weight: 700; padding: 0 0 0.6rem;
}
table.data th, table.data td {
  border-bottom: 2px solid var(--groen-licht);
  padding: 0.7rem 0.85rem;
  text-align: right;
  white-space: nowrap;
}
table.data thead th { background: var(--groen-licht); border-bottom-color: var(--groen-mid); }
table.data th[scope="row"], table.data thead th:first-child { text-align: left; white-space: normal; }
table.data tbody tr:nth-child(even) { background: var(--groen-bleek); }
table.data tr.totaal { font-weight: 700; }
/* De naam van de totaalregel van stap 2 staat in de tweede kolom, rechts
   uitgelijnd tegen het bedrag dat hij benoemt. */
table.data th.totaal-naam { text-align: right; white-space: nowrap; }
table.data tr.totaal th, table.data tr.totaal td { border-top: 3px solid var(--groen-mid); }
table.data td.gekozen, table.data thead th.gekozen {
  background: var(--groen-licht); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--groen-mid), inset -3px 0 0 var(--groen-mid);
}
/* Haak voor losse woorden die alleen op de afdruk horen te staan. */
.alleen-afdruk { display: none; }

/* Het blok met de ingevulde gegevens onder aan de afdruk. Op het scherm staat
   die invoer al op de stappen zelf, dus daar is het blok overbodig; op papier
   is het juist het enige dat de cijfers hun uitgangspunt geeft. */
.afdruk-kop { display: none; }

/* --- Controlescherm ----------------------------------------------------
   Het palet kent geen rood. Een afwijking wordt daarom met vorm en gewicht
   gemeld, niet met kleur: een dikke rand, vette tekst en de woorden zelf.
   Dat leest ook zonder kleurwaarneming. Wilt u hier toch een signaalkleur,
   dan hoort die eerst door de contrasttoets in test/browser.mjs. */

.ctrl-tabel td .rap-hint, .ctrl-tabel th .rap-hint {
  display: block; font-size: var(--txt-s); font-weight: 400;
}
.ctrl-tabel td { white-space: normal; }
/* Breekt een regelnaam over twee regels af, dan zouden gecentreerde cellen de
   bedragen ernaast omlaag duwen en niet meer uitlijnen met het verschil, dat
   zelf uit twee regels bestaat. Bovenaan uitlijnen zet alle eerste regels op
   dezelfde hoogte: de drie bedragen naast elkaar, het percentage eronder. */
.ctrl-tabel th, .ctrl-tabel td { vertical-align: top; }
.leeg { font-style: italic; }

/* --- Gegevensscherm ---------------------------------------------------- */

.rap-kop { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
.rap-kop:first-child { margin-top: 0; }
table.rap { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-variant-numeric: tabular-nums; }
table.rap th, table.rap td {
  border-bottom: 1px solid var(--groen-licht);
  padding: 0.6rem 0.85rem; vertical-align: top; text-align: left;
}
table.rap td { text-align: right; white-space: nowrap; }
table.rap thead th { background: var(--groen-licht); text-align: right; }
table.rap thead th:first-child { text-align: left; }
table.rap th[scope="row"] { font-weight: 400; width: 55%; }
table.rap .rap-label { font-weight: 700; display: block; }
table.rap .rap-hint { display: block; font-size: var(--txt-s); font-weight: 400; }
table.rap .rap-sub { padding-left: 1.5rem; display: block; }
table.rap tr.tot { font-weight: 700; }
table.rap tr.tot th, table.rap tr.tot td { border-top: 2px solid var(--groen-mid); }
.rap-noot { font-size: var(--txt-s); margin: 0 0 1rem; }
/* De voorbehoudregel stond tussen twee streepjes: haar eigen bovenrand en
   die van de knoppenrij eronder. Zij krijgt nu hetzelfde groene kader als de
   andere noten op deze schermen; de lijn boven de knoppenrij blijft, want
   die scheidt de inhoud van de bediening op elk scherm. */
.rap-voetnoot {
  font-size: var(--txt-s); font-weight: 700;
  background: var(--groen-bleek); border: 2px solid var(--groen-licht);
  border-radius: var(--radius); padding: 0.9rem 1.1rem; margin: 1.5rem 0 0;
}

/* --- Voet -------------------------------------------------------------- */

.voet {
  border-top: 2px solid var(--groen-licht);
  background: var(--wit);
  padding: 1.5rem 1.25rem;
}
.voet-binnen { max-width: var(--max); margin: 0 auto; font-size: var(--txt-s); }
/* Ruime raakvlakken: de links staan op één regel, maar krijgen elk genoeg
   hoogte om met een vinger te raken. */
.voet-meta { margin: 0; display: flex; flex-wrap: wrap; gap: 0 0.5rem; align-items: center; }
.voet a { color: var(--groen-donker); display: inline-block; padding: 0.5rem 0.2rem; }
.voet .uit { margin-left: 0.2em; text-decoration: none; }

/* --- Smalle schermen --------------------------------------------------- */

@media (max-width: 40rem) {
  :root { --txt-l: 20px; }
  .kop-band { padding: 1.1rem 1rem; }
  .kop-band h1 { font-size: 1.35rem; }
  .romp { padding: 1.1rem 1rem 2.5rem; }
  .kaart { padding: 1.15rem; border-radius: var(--radius); }
  .knoprij > .knop { flex: 1 1 100%; }
  .knop-volgende { margin-left: 0; order: -1; }
  input[type="number"], input[type="text"], select, .geld-wrap { max-width: none; }
  .datum-dag input, .datum-jaar input, .datum-maand select { width: 100%; }
  /* 5rem (80px) knipte het woord "dag" af; de lijst heeft met het pijltje
     erbij 89px nodig. 6rem geeft dat met een kleine marge, en blijft duidelijk
     smaller dan de maandlijst. Drie keuzelijsten naast elkaar passen niet:
     "september" maakt de maandlijst 148px, en samen vragen ze 359px tegen
     357px op de breedste iPhone — gemeten 01-11-2026. Jaar wikkelt daarom
     naar de tweede regel, en bij 200% tekst staan ze alle drie onder elkaar. */
  .datum-dag { flex: 0 0 6rem; }
  .datum-maand { flex: 1 1 8rem; }
  .datum-jaar { flex: 1 1 100%; }
  table.data th, table.data td { padding: 0.55rem 0.4rem; font-size: var(--txt-s); }
  table.data thead th { font-size: var(--txt-s); }
  table.rap th, table.rap td { padding: 0.5rem 0.45rem; }
  .tabel-wrap[tabindex] {
    border: 2px dashed var(--groen-mid); border-radius: var(--radius); padding: 0.25rem;
  }
  table.rap th[scope="row"] { width: auto; }
}

/* Zeer smal: tabellen stapelen, zodat niemand horizontaal hoeft te schuiven. */
@media (max-width: 30rem) {
  table.stapel, table.stapel tbody, table.stapel tr, table.stapel th, table.stapel td { display: block; }
  table.stapel thead { display: none; }
  /* `:not(.sr-only)`: zonder dat maakt `width: 100%` een onzichtbare,
     absoluut gepositioneerde caption alsnog schermbreed, en schuift de
     pagina horizontaal. */
  table.stapel caption:not(.sr-only) { display: block; width: 100%; }
  table.stapel tr {
    border: 2px solid var(--groen-licht); border-radius: var(--radius);
    margin: 0 0 0.6rem; padding: 0.35rem 0.6rem; background: var(--wit);
  }
  table.stapel tbody tr:nth-child(even) { background: var(--wit); }
  table.stapel th[scope="row"] {
    border: 0; padding: 0.35rem 0; font-weight: 700; text-align: left; background: none;
  }
  table.stapel td {
    border: 0; border-top: 1px solid var(--groen-licht);
    padding: 0.4rem 0; text-align: right;
    display: flex; gap: 1rem; justify-content: space-between; align-items: baseline;
  }
  /* Gestapeld is de lege eerste cel van de totaalregel alleen een lege regel. */
  table.stapel td.totaal-leeg { display: none; }
  table.stapel th.totaal-naam { text-align: left; white-space: normal; }
  table.stapel td::before {
    content: attr(data-k); text-align: left; font-size: var(--txt-s); font-weight: 400;
  }
  table.rap.stapel th[scope="row"] { padding-bottom: 0.15rem; }
  table.rap.stapel .rap-hint { font-weight: 400; }
  table.stapel td.gekozen { box-shadow: none; border-left: 5px solid var(--groen-mid); padding-left: 0.5rem; }
  table.stapel tr.totaal, table.stapel tr.tot {
    background: var(--groen-licht); border-color: var(--groen-mid);
  }
  .tabel-wrap[tabindex] { border: 0; padding: 0; }
  table.rap.stapel th[scope="row"] { width: auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* --- Afdrukken --------------------------------------------------------- */

@media print {
  body { background: var(--wit); font-size: 11pt; }
  .kop-band { background: var(--wit); color: var(--groen-donker); padding: 0 0 0.5cm; border-bottom: 2pt solid var(--groen-donker); }

  /* `.scherm-advies` gaat niet mee de printer in: het advies gaat over het
     scherm waarop gelezen wordt, en op papier is het onzin. */
  .skiplink, .knoprij, .voortgang, .kop-knoppen, .scherm-advies { display: none !important; }
  .alleen-afdruk { display: inline; font-weight: 700; }
  /* Het gegevensblok begint op een nieuwe pagina, zodat de vergelijking niet
     halverwege wordt afgebroken en het blok als geheel bij elkaar blijft. */
  .afdruk-kop {
    display: block; page-break-before: always; break-before: page;
    margin-top: 0; padding-top: 0;
  }
  .afdruk-kop h2 { font-size: 1.15rem; margin: 0 0 0.3cm; }
  .afdruk-kop p { margin: 0 0 0.4cm; font-size: 10pt; }
  .afdruk-kop th[scope="row"] { font-weight: 400; width: 55%; }
  .romp { max-width: none; padding: 0.5cm 0; }
  .kaart { border: 0; padding: 0; }
  table.data, table.rap { page-break-inside: auto; }
  tr, .noot { page-break-inside: avoid; }
  .rap-kop { page-break-after: avoid; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; }
}

/* De knoppen bij een wijziging zijn GEEN navigatie. `.knoprij` draagt een
   streep en 2rem ruimte omdat zij de onderkant van een scherm markeert; dat
   tussen elke trede herhalen hakt het scherm in stukken. En zij krijgen de
   tweede stijl: een knop die een wijziging weggooit hoort niet dezelfde
   nadruk te hebben als Volgende. */
/* --- De invoertabel van stap 2 ------------------------------------------
   Eén tabel per reeks bedragen (pensioen, partnerpensioen): per regel de
   periode, de leeftijd waarop het bedrag ingaat, en het bedrag. Het is een
   raster en geen <table>: de cellen zijn invoervelden met elk hun eigen label,
   en op een smal scherm moeten ze onder elkaar kunnen vallen zonder dat een
   schermlezer een tabel van één kolom voorgelezen krijgt. */
.reeks { margin: 0 0 1.5rem; }
/* Sinds de intro-alinea van stap 2 weg is, volgt de eerste tabel direct op de
   titel; zonder deze regel staat haar naam er strak tegenaan. */
h2 + .reeks { margin-top: 1rem; }
/* De naam van de reeks. Kleiner dan `.groep-kop`, de UPO erboven. */
.reeks-naam { font-size: 1.05rem; line-height: 1.25; margin: 0 0 0.5rem; }
.reeks-rij {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 11.5rem 11.5rem 6.75rem;
  gap: 0 1rem;
}
.reeks-kop {
  background: var(--groen-licht); border-bottom: 2px solid var(--groen-mid);
  padding: 0.5rem 0.75rem; font-size: var(--txt-s); font-weight: 700;
}
.reeks-rij {
  align-items: start;
  padding: 0.8rem 0.75rem; border-bottom: 1px solid var(--groen-licht);
}
.reeks-periode { font-weight: 700; align-self: center; }
/* De leeftijd heeft kleine labels ("Jaar", "Maanden") boven haar keuzelijsten
   en een regel eronder ("Dat is ..."). Het bedrag en de knop ernaast zakken
   precies de hoogte van dat labeltje, zodat de invoervakken van één regel op
   één lijn staan, wat er ook onder de keuzelijsten bij komt. */
.reeks-rij[data-trede] .reeks-bedrag, .reeks-rij[data-trede] .reeks-actie,
.reeks-rij[data-nptrede] .reeks-bedrag, .reeks-rij[data-nptrede] .reeks-actie {
  padding-top: calc(var(--txt-s) * var(--rij) + 0.25rem);
}
.reeks-actie .knop { min-height: var(--veld-hoogte); }
.reeks-bedrag .geld-wrap { max-width: none; }
.reeks-leeftijd { border: 0; padding: 0; margin: 0; min-width: 0; }
.reeks-leeftijd .datum-rij { flex-wrap: nowrap; gap: 0.5rem; }
.reeks-leeftijd .datum-deel { flex: 1 1 0; min-width: 0; }
.reeks-leeftijd select { width: 100%; max-width: none; }
.reeks-actie .knop { width: 100%; padding: 0.5rem 0.6rem; }
/* De afgeleide datum en een melding horen bij de hele regel. */
.reeks-rij .trede-tevroeg { grid-column: 1 / -1; margin: 0.6rem 0 0; }
.reeks + .trede-knoppen, .reeks .trede-knoppen { margin: 0.75rem 0 0; }
@media (max-width: 48rem) {
  /* Smal: de periode boven, daaronder leeftijd en bedrag, dan de knop. */
  .reeks-kop { display: none; }
  .reeks-rij { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem 0.75rem; }
  .reeks-periode { grid-column: 1 / -1; }
  .reeks-grens:empty { display: none; }
  .reeks-grens:empty + .reeks-bedrag { grid-column: 1 / -1; }
  .reeks-actie { grid-column: 1 / -1; }
  .reeks-actie:empty { display: none; }
  .reeks-actie .knop { width: auto; min-height: 0; }
  .reeks-rij[data-trede] .reeks-actie, .reeks-rij[data-nptrede] .reeks-actie { padding-top: 0; }
}
@media (max-width: 30rem) {
  .reeks-rij[data-trede] .reeks-bedrag, .reeks-rij[data-nptrede] .reeks-bedrag { padding-top: 0; }
}
@media (max-width: 30rem) {
  .reeks-rij { grid-template-columns: minmax(0, 1fr); }
}

.trede-knoppen { margin: 0.9rem 0 0; }
.trede-knoppen .knop { padding: 0.5rem 1.1rem; }

/* --- Overgenomen uit InvaarPlus (ui/eenvoudig.html): alles op één telefoonscherm --- */
body.schatter { --veld-hoogte: 2.75rem; }
.schatter .skiplink { display: none; }
.schatter .kop-binnen { gap: 0.5rem 2rem; }
.schatter .kop-sub { margin-top: 0.1rem; }
.schatter .knop-kop { min-height: 2.4rem; padding: 0.25rem 0.9rem; font-size: var(--txt-s); }
.schatter .kop-band { padding-top: 0.6rem; padding-bottom: 0.6rem; }
.schatter .kop-band h1 { font-size: 1.3rem; }
.schatter .kop-waarschuwing { margin-top: 0.1rem; }
.schatter .romp { padding: 0.75rem 0.75rem 0.75rem; }
.schatter .kaart { padding: 1rem; }
.rooster { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 0.75rem; }
.vak { min-width: 0; }
.vak.breed { grid-column: 1 / -1; }
.vak-kop { display: block; font-weight: 700; font-size: var(--txt-s); margin: 0 0 0.2rem; }
.paar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.rooster select, .rooster input[type="text"] { max-width: none; min-width: 0; padding-top: 0.35rem; padding-bottom: 0.35rem; }
.paar .keuzeknop { min-width: 0; padding: 0.35rem 0.5rem; }
.uitkomst { margin: 0.8rem 0 0.7rem; padding-top: 0.7rem; border-top: 2px solid var(--groen-licht); }
.uit-lijn { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; white-space: nowrap; }
.uit-naam { font-weight: 700; }
.uit-getal { font-weight: 700; }
/* De uitkomst is "RTS +0,03 %-punt": alleen het getal is groot. Past dat niet
   naast de naam, dan gaat het als geheel naar de volgende regel, rechts. */
/* De uitkomst is een geheel: "RTS", het getal en "%-punt" in dezelfde letter
   en hetzelfde gewicht, even groot als de naam ervoor (opdrachtgever, 19
   november: "niet strak weergegeven", toen het getal groot stond tussen twee
   kleine woorden). De grootte loopt mee met de schermbreedte, zodat naam en
   uitkomst op een regel passen. Altijd een slag groter dan de getallen
   eronder en erboven (18 px of meer tegen 16 px). */
.uit-groot { flex-wrap: wrap; gap: 0 0.5rem; margin-top: 0.15rem; font-size: clamp(1.125rem, 4.7vw, 1.3rem); line-height: 1.25; }
.uit-groot .uit-getal { margin-left: auto; }
.uit-getal #uit-kop { font-variant-numeric: tabular-nums; }
/* Het scherm Rekenrente: twee kolommen, standaard en indexatie (27 november).
   Even breed en rechts uitgelijnd, zodat de getallen recht onder elkaar staan.
   Past een regel niet, dan gaan de twee getallen samen naar de volgende regel,
   rechts, zoals bij de uitkomstregel. Op 320 px is er 260 px; naam en twee
   bedragen samen vragen er ongeveer 340. */
#uit .uit-lijn:has(.uit-twee) { flex-wrap: wrap; row-gap: 0; }
.uit-twee { display: inline-grid; grid-template-columns: repeat(2, 5.3em); column-gap: 0.5em; margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.uit-groot .uit-twee { grid-template-columns: repeat(2, 4.6em); }
.uit-groot .uit-waarde { font-weight: 700; }
.uit-kolomkop { margin-top: 0.1rem; }
.uit-melding { margin: 0.6rem 0; font-size: var(--txt-s); }
.knoprij-schatter { margin: 0; }
.schatter .kaart-intro { margin-bottom: 0.8rem; }
.schatter .tabel-wrap { margin-bottom: 0.6rem; }
table.data.smal th, table.data.smal td { padding: 0.5rem 0.6rem; }
/* Uw uitkomst: een ring om het getal, niet een gekleurde cel. */
table.data td .uw {
  display: inline-block; font-weight: 700; padding: 0.1rem 0.5rem; margin: -0.2rem -0.6rem -0.2rem 0;
  border: 2px solid var(--groen-donker); border-radius: 999px; background: var(--wit);
}
.schatter .lange-tekst p { font-size: var(--txt-s); margin-bottom: 0.7rem; }
.schatter .priv-kaart { padding: 0.8rem 0.9rem; font-size: var(--txt-s); }
.schatter .priv-kaarten, .schatter .lange-tekst { margin-bottom: 1rem; }
/* --- Eigen regels van InvaarRentes ------------------------------------ */
/* Maand en jaar naast elkaar, zoals InvaarPlus. De pijl van de keuzelijst
   schuift naar de rand en de tekst krijgt minder lucht, zodat "september" ook
   op een smal scherm past. */
.datum select {
  padding-left: 0.55rem; padding-right: 1.55rem;
  background-position: right 0.85rem center, right 0.5rem center;
}
/* Het bedrag met zijn eenheid ervoor, zoals in de InvaarVergelijker, in een
   vak van een halve regel breed. */
/* Onder de 400 px wikkelt "% van uw pensioen" naar twee regels. De vakken
   lijnen daarom op hun onderkant uit, zodat knoppen en veld op één hoogte
   blijven, en de knoppen krijgen minder lucht opzij, anders raakt "Vrouw" de
   rand. */
.rooster { align-items: end; row-gap: 0.35rem; }
/* "Pensioen vóór invaren" is een paar beeldpunten breder dan een halve
   kolom op 402 px en brak daardoor over twee regels (21 px hoogte). Vanaf
   400 px breekt een opschrift niet meer en is de linkerkolom een fractie
   breder dan de rechter (174 tegen 160 px op 402 px, met 8 px ertussen),
   zodat het opschrift van 173 px past. Smaller mag het breken. Die hoogte
   is nodig voor het opschrift boven de keuze van de RTS. */
@media (min-width: 25rem) {
  .rooster { grid-template-columns: 1.09fr 1fr; column-gap: 0.5rem; }
  .rooster .vak-kop { white-space: nowrap; }
}
/* Met een partner heeft dit formulier een regel meer dan dat van InvaarPlus,
   en de uitkomst heeft twee regels extra voor de delta en haar basis. Deze maten halen de
   hoogte terug die dat kost, zodat het op 402 px breed onder de 700 px blijft
   (gemeten in test/browser-rente.mjs). */
/* "Pensioen vóór invaren" is breder dan een half vak en wikkelt naar twee
   regels. De opschriften staan daarom dichter op elkaar; dat wint meer hoogte
   terug dan die tweede regel kost. */
.rooster .vak-kop { margin-bottom: 0.2rem; line-height: 1.3; }
.schatter .uitkomst { margin: 0.5rem 0 0.5rem; padding-top: 0.45rem; }
.schatter .kaart { padding: 0.8rem 1rem; }
.schatter .kop-band { padding-top: 0.4rem; padding-bottom: 0.4rem; }
.schatter .romp { padding-top: 0.55rem; }
/* De ondertitel "Welke rentes bepalen mede uw nieuwe pensioen?" (opdrachtgever,
   18 november) is op een telefoon twee regels: gemeten op 402 px 378 px nodig,
   370 px beschikbaar. Die tweede regel kost 20 px en het invoerscherm met
   partner kwam daarmee op 705 px. De kop is daarom iets krapper gezet. */
.schatter .kop-band { padding-top: 0.25rem; padding-bottom: 0.25rem; }
.schatter .kop-binnen { row-gap: 0.35rem; }
.schatter .kop-sub { line-height: 1.2; }
.schatter .romp { padding-top: 0.45rem; }
/* Met de keuze van de RTS heeft het invoerscherm een regel meer (20
   november); op 402 px kwam het daarmee op 744 px. De hoogte is teruggehaald
   door Privacy en Disclaimer op een telefoon rechts naast de naam te zetten
   in plaats van op een eigen regel eronder (34 px), en door de kaart en het
   rooster een fractie krapper te zetten. Onder 384 px passen de twee knoppen
   niet ruim genoeg naast de naam; daar staan zij eronder, zoals voorheen. */
@media (min-width: 24rem) and (max-width: 41.5rem) {
  .schatter .kop-binnen { position: relative; }
  .schatter .kop-knoppen { position: absolute; top: 0; right: 0; gap: 0.4rem; flex-wrap: nowrap; }
  .schatter .knop-kop { padding-left: 0.7rem; padding-right: 0.7rem; }
  .schatter .kop-band h1 { line-height: 2.4rem; }
  .schatter .kop-sub { margin-top: 0; }
}
.schatter .kaart { padding-top: 0.6rem; padding-bottom: 0.55rem; }
.schatter .romp { padding-top: 0.3rem; }
.rooster { row-gap: 0.3rem; }
.paar .keuzeknop { padding-left: 0.25rem; padding-right: 0.25rem; }
.rooster .geld-wrap { max-width: none; }
.rooster .geld-wrap input { padding-left: 0.5rem; padding-right: 0.5rem; }
.rooster .geld-teken { padding: 0 0.5rem; font-size: var(--txt-s); }
table.data.smal td { font-variant-numeric: tabular-nums; }
/* De delta ten opzichte van de risicovrije rente: een tweede, kleinere regel
   onder de projectierente. */
.uit-delta, .uit-klein { font-size: var(--txt-s); line-height: 1.2; }
/* De kleine regels boven de rekenrente: de stappen die ernaartoe leiden. */
.uit-klein { margin-bottom: 0.25rem; }
/* Minder vet op de uitkomstschermen (opdrachtgever, 20 november: "door
   veelvuldig gebruik van bold accenten oogt niet strak"; keuze voor schets A,
   met ook de kop van de tabel niet vet). Vet zijn nog: de paginakop, de
   kopjes Invoer en Berekend, de uitkomstregel en een controlemelding. Bedragen, percentages, de duiding en de hele
   tabel verder niet. */
.uit-klein .uit-waarde { font-weight: 400; font-variant-numeric: tabular-nums; }
#uit-tabel th { font-weight: 400; }
/* Drie knoppen onder de uitkomst in plaats van de twee van InvaarPlus. */
.trio { display: grid; grid-template-columns: 1.1fr 1.4fr 0.8fr; gap: 0.4rem; }
/* Het invoerscherm heeft geen uitkomst meer boven de knoppen. */
.schatter .knoppen-onder { margin-top: 0.5rem; }
/* Een uitkomstscherm: de uitkomst staat direct onder de kop, zonder de lijn
   die haar op het oude formulier van de velden scheidde. */
.resultaat .uitkomst { border-top: 0; padding-top: 0; margin-top: 0.4rem; }
.resultaat .tabel-wrap { margin-top: 0.55rem; }
.uit-duiding-regel { margin-bottom: 0; }
/* De kopjes "Invoer" en "Berekend" boven de twee groepen van een uitkomst:
   een dunne lijn eronder, geen kleinere letter dan de regels zelf. */
.uit-groep { font-size: var(--txt-s); line-height: 1.2; font-weight: 700; margin: 0.6rem 0 0.35rem; padding-bottom: 0.2rem;
  border-bottom: 1px solid var(--groen-mid); }
.uit-groep:first-child { margin-top: 0; }
/* De koppen "Bandbreedte" en "Projectierente" mogen op hun zachte
   afbreekstreepje breken; de korte koppen zakken dan mee naar de onderste
   regel. */
.resultaat table.data.smal thead th { white-space: normal; vertical-align: bottom; line-height: 1.2; }
/* Terug en Uitleg naast elkaar onder een uitkomst. */
.knoppen-uitkomst { display: flex; gap: 0.5rem; }
/* Terug en Uitleg zijn even hoog en hebben dezelfde letter als de drie
   knoppen onder het invoerscherm (opdrachtgever, 20 november: zij waren
   hoger dan de rest, 51 tegen 44 px, door de ruimere binnenruimte en de
   grotere letter van de gedeelde knop). */
.knoprij-schatter .keuzeknop { padding-top: 0.35rem; padding-bottom: 0.35rem; font-size: var(--txt-s); }
.resultaat table.data.smal th, .resultaat table.data.smal td { padding-top: 0.4rem; padding-bottom: 0.4rem; }
.trio .keuzeknop { min-width: 0; padding: 0.35rem 0.2rem; font-size: var(--txt-s); }
/* Onder de uitkomst: de RTS en de delta als twee kleine regels (schets A,
   opdrachtgever, 20 november). Het label van de RTS mag over twee regels;
   het percentage staat dan naast de onderste. De datum en het stuk tussen
   haakjes breken niet middendoor. */
.uit-rts { white-space: normal; align-items: flex-end; gap: 0.5rem; }
.uit-rts-naam { min-width: 0; }
.uit-rts .uit-waarde { flex: none; }
.uit-datum { white-space: nowrap; }
/* Een lettergrootte voor alle getallen op een uitkomstscherm (opdrachtgever,
   20 november): de bedragen, de RTS, de delta en de hele tabel staan in
   --txt-s; alleen de uitkomstregel is een slag groter. De gedeelde opmaak
   zet een tabel op brede schermen in --txt; daardoor stond de risicovrije
   rente in de tabel groter dan op de regel erboven. De delta tussen haakjes
   is even groot als de rente ervoor, alleen lichter van kleur. */
#uit-tabel th, #uit-tabel td { font-size: var(--txt-s); }
/* De kop "Pensioen / jaar" past op een telefoon niet naast de twee andere en
   staat daar op twee regels. Vanaf 400 px blijft "Bandbreedte" dan heel;
   smaller is haar afbreekpunt nodig om de tabel binnen het kader te houden. */
@media (min-width: 25rem) { #band-kop { white-space: nowrap; } }
/* Ook het omcirkelde getal is niet vet (opdrachtgever, 20 november): vet oogt
   groter, en de ring wijst het al aan. */
#uit-tabel td .uw { font-weight: 400; }
.tab-delta { font-weight: 400; white-space: nowrap; opacity: 0.8; }
/* Onzichtbare tekens die de getallen in de tabel recht onder elkaar zetten. */
.tab-vul { visibility: hidden; user-select: none; }
.uit-duiding { font-weight: 400; white-space: nowrap; }
/* Een controle op de invoer: vet, onder de delta of onder de melding dat de
   rente buiten het bereik ligt. */
.uit-controle { font-weight: 700; margin-bottom: 0.7rem; }
/* Vier kolommen in plaats van de drie van InvaarPlus: minder lucht opzij,
   anders schuift de tabel onder de 400 px. */
table.data.smal th, table.data.smal td { padding-left: 0.4rem; padding-right: 0.4rem; }
/* De ring steekt precies zo ver uit als zijn rand en zijn binnenruimte breed
   zijn, zodat het getal erin recht onder de andere staat. */
table.data.smal td .uw { padding: 0.1rem 0.4rem; margin-right: calc(-0.4rem - 2px); }
/* Onder de 392 px (24.5rem) past de tabel met de koppen "Bandbreedte" en
   "Projectierente" alleen met nog minder lucht opzij (gemeten op 375 px:
   8 px te breed met de lucht van hierboven). */
@media (max-width: 24.5rem) {
  table.data.smal th, table.data.smal td { padding-left: 0.25rem; padding-right: 0.25rem; }
  table.data.smal td .uw { padding: 0.1rem 0.3rem; margin-right: calc(-0.3rem - 2px); }
}
/* De Uitleg-pagina heeft koppen en lijsten; de andere tekstpagina's niet. */
.uitleg h3 { font-size: var(--txt); margin: 0 0 0.5rem; }
.uitleg h4 { font-size: var(--txt-s); line-height: 1.25; margin: 1rem 0 0.3rem; }
.uitleg ul { margin: 0 0 0.7rem; padding-left: 1.2rem; font-size: var(--txt-s); }
.uitleg li { margin: 0.15rem 0; }
/* Het rekenvoorbeeld in de Uitleg: een smalle tabel, niets vet, de bedragen
   rechts onder elkaar. */
.uitleg #uitleg-voorbeeld { width: auto; min-width: 15rem; margin: 0 0 0.7rem; }
.uitleg #uitleg-voorbeeld th, .uitleg #uitleg-voorbeeld td { font-size: var(--txt-s); font-weight: 400; white-space: nowrap; }
.uitleg #uitleg-voorbeeld td, .uitleg #uitleg-voorbeeld thead th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.uitleg h3 + h4 { margin-top: 0.3rem; }
.uitleg #uitleg-rts-deel { margin-top: 1.4rem; }
/* De lijngrafiek van de RTS in de Uitleg. De lijn is 2 px; het raster en de
   as zijn haarlijnen in het lichte groen en blijven op de achtergrond. Alle
   tekst heeft de gewone tekstkleur en de gewone kleine letter; alleen de lijn
   en de stippen dragen de gegevenskleur. */
.rts-grafiek { position: relative; margin: 0 0 0.7rem; touch-action: pan-y; border-radius: 6px; }
.rts-grafiek:focus-visible { outline: 2px solid var(--groen-donker); outline-offset: 3px; }
.rts-grafiek svg { display: block; overflow: visible; }
.rts-raster { stroke: var(--groen-licht); stroke-width: 1; }
.rts-as, .rts-label { font-size: var(--txt-s); fill: var(--groen-donker); font-variant-numeric: tabular-nums; }
.rts-as { opacity: 0.8; }
/* Een witte rand om de labels in de grafiek: zij blijven leesbaar waar de
   aanwijzer of de lijn erdoor loopt. */
.rts-label { paint-order: stroke; stroke: var(--wit); stroke-width: 4px; stroke-linejoin: round; }
.rts-lijn { fill: none; stroke: #2E8B68; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.rts-stip { fill: #2E8B68; stroke: var(--wit); stroke-width: 2; }
.rts-kruis { stroke: var(--groen-donker); stroke-width: 1; }
.rts-tip { position: absolute; top: 0; padding: 0.05rem 0.45rem; background: var(--wit); border: 1px solid var(--groen-mid);
  border-radius: 6px; font-size: var(--txt-s); line-height: 1.4; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
/* De RTS onderaan de Uitleg: looptijd en rente, in drie kolommen op een
   telefoon (twee onder 368 px) en zes op een breed scherm, van boven naar
   beneden gelezen. */
.uitleg .rts-lijst { list-style: none; margin: 0 0 0.9rem; padding: 0; columns: 3; column-gap: 1rem;
  font-size: var(--txt-s); font-variant-numeric: tabular-nums; }
.uitleg .rts-lijst li { display: flex; justify-content: space-between; gap: 0.4rem; margin: 0; padding: 0.15rem 0.2rem;
  border-bottom: 1px solid var(--groen-licht); break-inside: avoid; }
.rts-jaar { opacity: 0.8; }
@media (min-width: 40rem) { .uitleg .rts-lijst { columns: 6; } }
@media (max-width: 23rem) { .uitleg .rts-lijst { columns: 2; } }
/* Het overzicht bevat zinnen, geen getallen: de cellen mogen wikkelen, anders
   valt de laatste kolom op een telefoon buiten het kader. */
.uitleg table.data th, .uitleg table.data td { white-space: normal; text-align: left; font-variant-numeric: normal; }
@media (max-width: 30rem) {
  .uitleg table.stapel td { text-align: right; }
  .uitleg table.stapel td::before { flex: none; }
}
/* Smaller dan 368 px (23rem) passen twee vakken naast elkaar niet meer zonder
   dat "Vrouw" wordt afgeknipt. Dan staat alles onder elkaar; de maand krijgt
   meer breedte dan het jaar. Het ene scherm zonder scrollen is daar
   losgelaten; afgeknipte tekst is erger. */
@media (max-width: 23rem) {
  .rooster { grid-template-columns: 1fr; }
  .datum { grid-template-columns: 1.3fr 1fr; }
  .uit-basis { white-space: normal; }
  .trio { grid-template-columns: 1fr 1fr; }
  .trio .keuzeknop:last-child { grid-column: 1 / -1; }
  .knoppen-onder .keuzeknop { font-size: var(--txt-s); }
  /* Op de smalste schermen past "2,58% (-0,73)" niet naast de twee andere
     kolommen. Eerder kreeg de tabel hier een kleinere letter; sinds alle
     getallen even groot moeten zijn (opdrachtgever, 20 november) staat de
     delta hier onder de rente, in dezelfde letter. */
  table.data.smal th, table.data.smal td { padding: 0.5rem 0.15rem; }
  table.data.smal td .uw { padding: 0.1rem 0.4rem; margin-right: calc(-0.4rem - 2px); border-radius: 0.8rem; text-align: right; }
  #uit-tabel .tab-delta { display: block; }
  #uit-tabel td { line-height: 1.25; }
  /* Een opschrift en een lange waarde passen op 320 px niet altijd naast
     elkaar met de gewone tussenruimte; past het in een ander lettertype nog
     niet, dan gaat de waarde naar de volgende regel. */
  .uitleg table.stapel td { gap: 0.5rem; flex-wrap: wrap; }
  .uitleg table.stapel td::before { font-size: 14px; }
}

(function(){

function profielSom(profiel, levenslang, tijdelijk) {
    let som = profiel[profiel.length - 1].bedrag * levenslang;
    for (let i = 0; i < profiel.length - 1; i++) {
        const verschil = profiel[i].bedrag - profiel[i + 1].bedrag;
        if (verschil === 0)
            continue;
        som += verschil * tijdelijk(profiel[i].tot);
    }
    return som;
}
function profielBijdragen(profiel, levenslang, tijdelijk) {
    const uit = [];
    let vorige = 0;
    for (let i = 0; i < profiel.length; i++) {
        const tot = i === profiel.length - 1
            ? levenslang
            : tijdelijk(profiel[i].tot);
        uit.push(profiel[i].bedrag * (tot - vorige));
        vorige = tot;
    }
    return uit;
}
function valideerProfiel(profiel) {
    if (profiel.length === 0) {
        throw new Error('profiel — leeg profiel; verwacht minstens één trede');
    }
    if (profiel[profiel.length - 1].tot !== undefined) {
        throw new Error('profiel — de laatste trede loopt levenslang en mag geen `tot` dragen');
    }
    for (let i = 0; i < profiel.length - 1; i++) {
        const tot = profiel[i].tot;
        if (tot === undefined) {
            throw new Error(`profiel — trede ${i} heeft geen \`tot\`; alleen de laatste mag die weglaten`);
        }
        if (!Number.isFinite(tot)) {
            throw new Error(`profiel — \`tot\` van trede ${i} is geen getal`);
        }
        if (Math.abs(tot * 12 - Math.round(tot * 12)) > 1e-9) {
            throw new Error(`profiel — \`tot\` van trede ${i} (${tot}) is geen leeftijd in hele maanden`);
        }
        const volgende = profiel[i + 1].tot;
        if (volgende !== undefined && !(volgende > tot)) {
            throw new Error(`profiel — de \`tot\`-grenzen moeten oplopen; trede ${i + 1} ligt niet na trede ${i}`);
        }
    }
    for (let i = 0; i < profiel.length; i++) {
        if (!Number.isFinite(profiel[i].bedrag) || profiel[i].bedrag < 0) {
            throw new Error(`profiel — bedrag van trede ${i} is negatief of geen getal`);
        }
    }

    /* DE STAND VAN DE RTS IS EEN KEUZE (opdrachtgever, 20 november 2026): de
       gebruiker kiest op het invoerscherm een van de standen in
       `rentecurve.sets`, de maandeinden van 2026 uit het spreadsheet van
       DNB. De keuze reist mee in het geval, als `geval.rts` (een peildatum,

        if (pNa >= 0 && pNa <= p + 1e-9) {
          for (i = eerste; i < 12; i++) doel[j * 12 + i] += gewicht * (p + (i / 12) * (pNa - p)) / 12;
        } else {

             dan gelijk over de maanden. */
          for (i = eerste; i < 12; i++) doel[j * 12 + i] += gewicht * c / n;
          pNa = Math.max(0, Math.min(p, pNa));

      }

    function legPaar(doel, bakken, gewicht) {
      for (var j = 0; j < bakken.length; j++) {
        var c = bakken[j], eerste = j === 0 ? 1 : 0, n = 12 - eerste, i;
        if (!(c > 0)) continue;
        var hier = c * 12 / n;
        var voor = j === 0 ? hier : bakken[j - 1] * (j === 1 ? 12 / 11 : 1);
        var na = j + 1 < bakken.length ? bakken[j + 1] : 0;
        var helling = (na - voor) / (j === 0 ? 1 : 2) / 144;
        var midden = eerste ? 6 : 5.5, laagste = c / n + helling * ((helling < 0 ? 11 : eerste) - midden);
        if (laagste < 0) helling = 0;

      }
    }

    var stroomSleutel = null, stroomMemo = null;
    /**
     * De verwachte betalingen per maand voor 1 euro pensioen per jaar, zonder
     * kostenopslag: {c, z, rho}. c[k] is de betaling op t = k/12, z[k] de
     * DNB-rente bij die looptijd, rho de kostenopslag van de kern.
     *
     * De betalingen hangen niet van de stand van de RTS af en worden per
     * persoon onthouden; de rentes z komen uit de stand die het geval kiest.

    function stroom(geval) {

    function betalingen(geval) {
      var sl = sleutel(geval);
      if (sl === stroomSleutel) return stroomMemo;

      var pr = geval.partner;
      if (pr) {
        var pF = Math.floor(pr.x), fp = pr.x - pF;
        var hoek = function (xd, xp, gewicht) {
          if (!(gewicht > 0)) return;
          legPaar(c, jaarbakken(function (j) {
            return K.jointLifeAnnuityTemporaryFractional(xd, xp, xp + j, 0, P.t0, geval.g, pr.g, paarOpts);
          }), gewicht * pr.deel);
        };
        hoek(xF, pF, (1 - f) * (1 - fp)); hoek(xF + 1, pF, f * (1 - fp));
        hoek(xF, pF + 1, (1 - f) * fp); hoek(xF + 1, pF + 1, f * fp);

     * Het kapitaal dat 1 euro pensioen per jaar kost als elke betaling contant
     * wordt gemaakt tegen de DNB-rente van haar looptijd plus `opslag`. Met
     * `pi` groeit het pensioen met dat percentage per jaar (de indexatie).

      for (var k = 1; k < c.length; k++) if (c[k] > 0) som += c[k] * Math.pow(groei / (1 + z[k] + opslag), k / 12);
      return (1 + st.rho) * som;

    function waardeVlak(geval, rente, pi) {
      var st = stroom(geval), c = st.c, som = 0, g = (1 + (pi || 0)) / (1 + rente);
      for (var k = 1; k < c.length; k++) if (c[k] > 0) som += c[k] * Math.pow(g, k / 12);

      if (!(doel > 0) || !isFinite(doel)) return {code: 'MISLUKT'};
      if (F(S_MIN) < doel) return {code: 'ONDER_BEREIK'};
      if (F(S_MAX) > doel) return {code: 'BOVEN_BEREIK'};
      var lo = S_MIN, hi = S_MAX;
      for (var i = 0; i < 60; i++) {

    /** De opslag op de DNB-curve waarbij `pensioen` per jaar precies `kapitaal` waard is. */

      return zoekOpslag(function (s) { return waardeOpCurve(geval, s, 0); }, kapitaal / pensioen);
    }
    /** Het pensioen in jaar 1 dat `kapitaal` geeft bij de DNB-curve plus `opslag`. */

       (`berekenIndexatieMethodeV353`), dus het kapitaal na invaren per euro
       pensioen is (1 - al) x waarde zonder indexatie + al x waarde met de

    function naOpCurve(geval, opslag, dg) {
      var al = K.aandeelVerwachteIndexatie(dg);

    }
    /**
     * De opslag op de DNB-curve waarbij het pensioen voor invaren, verhoogd
     * volgens de indexatiemethode, precies het kapitaal na invaren waard is.
     * Geeft {code} of {s, kapitaalVoor, verhoging}.
     */
    function opslagRekenrente(geval, kapitaalNa, pensioenVoor, dg) {
      var o = zoekOpslag(function (s) { return naOpCurve(geval, s, dg); }, kapitaalNa / pensioenVoor);
      if (o.code) return o;
      var kv = waardeOpCurve(geval, o.s, 0);
      return {s: o.s, kapitaalVoor: pensioenVoor * kv, verhoging: naOpCurve(geval, o.s, dg) / kv - 1};
    }

    /* ---- De standaardmethode -----------------------------------------
       Besluit van de opdrachtgever, 27 november 2026: het scherm Rekenrente
       toont naast de indexatiemethode ook de standaardmethode, op dezelfde
       regel. De standaardmethode is die van de InvaarVergelijker: M2 uit de
       kern (`computeM2`), het surplus van het fonds verdeeld via de
       cohorten. Zij wordt niet nagebouwd; hieronder staat dezelfde aanroep
       als in de keten (`berekenResultaatProjectieV4`): M1 met de
       spreiding, en M2 met het fondsvermogen bij de gekozen dekkingsgraad en
       zonder bijstort.

       M2 rekent bij een vlakke rente. De verhouding kapitaal na / kapitaal
       voor hangt daar nauwelijks van af (gemeten, maart 1956 met partner,
       DG 140%: 26,70% bij 2,5% en 26,67% bij 3,5%). Zij hangt ook niet af
       van de hoogte van het pensioen: het compensatiedepot in de
       modelparameters van M2 is 0, dus elk deel van M2 is evenredig met het
       pensioen (gemeten van 5.000 tot 60.000 per jaar, DG 125% tot 145%). Daarom rekent dit
       blok per euro pensioen, bij de vlakke rente die de curve plus de

    var M2 = K.MODELCONTEXT.m2;

      var n = Math.round(rente * PER);
      if (memoSt[n] !== undefined) return memoSt[n];

      var q = Object.assign({}, M2, {r: r, dekkingsgraad: dg,
        fondsvermogen: dg * (M2.fondsvermogen / M2.dekkingsgraad), bijstort: 0});
      var u = K.computeM2(d, {KV: m.KV, KV_OP: m.KV_OP, KV_NP: m.KV_NP,
        cw_star_op: m.cw_star_op || 0, cw_star_np: m.cw_star_np || 0}, q, AG);
      memoSt[n] = {KV: m.KV, ppk: u.ppkTotal, ratio: u.ppkTotal / m.KV};

    }
    /**
     * De opslag op de DNB-curve waarbij het pensioen voor invaren, verhoogd
     * volgens de standaardmethode, precies het kapitaal na invaren waard is.
     * Eerst met de verhouding bij de RTS zelf, dan nog eens met die bij de
     * gevonden opslag. Geeft {code} of {s, kapitaalVoor, verhoging}.
     */
    function opslagStandaard(geval, kapitaalNa, pensioenVoor, dg) {
      var r = curveGelijkeRente(geval, 0), o = null, v = 1;
      for (var i = 0; i < 2; i++) {
        v = standaard(geval, r, dg).ratio;
        o = zoekOpslag(function (s) { return v * waardeOpCurve(geval, s, 0); }, kapitaalNa / pensioenVoor);
        if (o.code) return o;
        r = curveGelijkeRente(geval, o.s);

    /**
     * De vlakke rente die voor de betalingen van dit geval dezelfde waarde
     * geeft als de DNB-curve: de curve als een getal, voor deze persoon.
     */
    function curveGelijkeRente(geval, opslag) {
      /* Met een opslag: de vlakke rente die dezelfde waarde geeft als de
         curve plus die opslag. Zo staat een projectierente of rekenrente als
         een percentage op het scherm (opdrachtgever, 20 november: de
         calculator gaat over rentes, dus de uitkomst is een rente). */
      var doel = waardeOpCurve(geval, opslag || 0, 0), lo = -0.15, hi = 0.5;
      for (var i = 0; i < 70; i++) {

    /**

    function bandOpslag(geval) {

    function somBetalingen(geval, pi) {

    function somNa(geval, dg) {
      var al = K.aandeelVerwachteIndexatie(dg);

      leeftijd: leeftijd, leeftijdMaand: leeftijdMaand, kapitaalPerEuro: kapitaalPerEuro, uitkering: uitkering,

      kostenopslag: kostenopslag, indexatie: indexatie, rekenrente: rekenrente, standaard: standaard,
      verwachteIndexatie: C.indexatiemethode.verwacht,
      grenzen: {min: N_MIN / PER, max: N_MAX / PER},
      /* Het rekenen op de DNB-curve; de functies hierboven rekenen vlak en
         dienen nog als maatstaf in de proef. */
      curve: {
        peildatum: STANDAARD, standen: Object.keys(SETS).sort(), stand: curveVan, renteOp: curveRenteOp, stroom: stroom,
        waarde: waardeOpCurve, waardeVlak: waardeVlak, opslag: opslagProjectie, pensioenBij: pensioenBijOpslag,
        na: naOpCurve, opslagRekenrente: opslagRekenrente, opslagStandaard: opslagStandaard, gelijkeRente: curveGelijkeRente, band: bandOpslag,
        somBetalingen: somBetalingen, somNa: somNa, grenzen: {min: S_MIN, max: S_MAX},

  }

  return {maak: maak};
})();

<script>
/**
 * Het scherm van InvaarRentes. Een invoerscherm met alle velden, en voor elke
 * uitkomst een eigen scherm: Projectierente (met de bandbreedte) en
 * Rekenrente. Daarnaast Uitleg, Privacy en Disclaimer. Alle getallen komen
 * uit `InvaarRente` (zie rente-reken.js), en die haalt ze uit de kern; dit
 * bestand leest alleen de invoer en zet de uitkomst neer.

 * De vakken en knoppen zijn die van InvaarPlus (ui/eenvoudig-scherm.js). De
 * indeling in een invoerscherm en twee uitkomstschermen is een besluit van de
 * opdrachtgever (18 november 2026), net als de namen van de bedragen:
 * "Kapitaal na invaren", "Pensioen na invaren", "Pensioen voor invaren".
 */
(function () {
  'use strict';

  var K = Rekenkern;
  var Z = InvaarRente.maak(K);
  var NBSP = '\u00a0';
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli',
    'augustus', 'september', 'oktober', 'november', 'december'];

  /* De jarenlijsten hebben de grenzen van de InvaarVergelijker (ui/ui.js,

     18 tot 110. Het peiljaar is dat van de invaardatum, niet van de klok. */
  var PEILJAAR = Number(K.CONFIG.invaardatum.slice(0, 4));
  var OUDSTE_JAAR = PEILJAAR - 110;
  var JONGSTE_JAAR = PEILJAAR - 55 - 1;
  var JONGSTE_JAAR_PARTNER = PEILJAAR - 18;

  var v = {scherm: 'hoofd', gm: '', gj: '', g: '', partner: 'nee',
    pm: '', pj: '', pg: '', deel: '70',
    pensioenVoor: '', dg: '140', kapitaal: '', pensioenNa: '',
    /* De stand van de RTS van DNB waarmee wordt gerekend (opdrachtgever, 20

       uit dit spreadsheet"). Vooraf staat de keuze op de peildatum van de

    rts: Z.curve.peildatum};
  /** De gekozen stand, of de standaard als de keuze geen bekende stand is. */
  function rtsDatum() { return Z.curve.standen.indexOf(v.rts) >= 0 ? v.rts : Z.curve.peildatum; }

  /* De dekkingsgraad heeft het bereik van InvaarPlus, 125% tot en met 145%.
     Zij staat vooraf op 140: dat is een besluit van de opdrachtgever (18

  var DG_MIN = 125, DG_MAX = 145;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /** 0.03869 -> "3,87%"; een negatieve rente krijgt een echt minteken. */

    var s = Math.abs(f * 100).toFixed(dec === undefined ? 2 : dec);
    return (f < 0 && Number(s) !== 0 ? '\u2212' : '') + s.replace('.', ',') + '%';
  }
  /** 39156.4 -> "€ 39.156" */
  function eur(bedrag) {
    return '€' + NBSP + String(Math.round(bedrag)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  /**
   * Een verschil tussen twee rentes in procentpunten, met teken: 0.0022 ->

   * twee afgeronde percentages op het scherm; die twee kunnen 0,01 uiteenlopen.
   */
  function ppunt(f) {
    var s = Math.abs(f * 100).toFixed(2);
    return (Number(s) === 0 ? '' : f < 0 ? '\u2212' : '+') + s.replace('.', ',');
  }

    var d = iso.split('-');
    return Number(d[2]) + ' ' + MAANDEN[Number(d[1]) - 1] + ' ' + d[0];
  }
  /* Bedragen lezen zoals de InvaarVergelijker (ui/ui.js, naarGetal): punten
     zijn duizendtallen, de komma is het decimaalteken, en een minteken voor

    return '<div class="vak"><span class="vak-kop" id="' + id + '-kop">' + esc(label) + '</span>' +
