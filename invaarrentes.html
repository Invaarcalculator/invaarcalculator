        return '<button type="button" class="keuzeknop' + (aan ? ' aan' : '') + '" id="' + id + '-' + k[0] +
          '" data-veld="' + veld + '" data-waarde="' + k[0] + '" aria-pressed="' + (aan ? 'true' : 'false') + '">' +
          esc(k[1]) + '</button>';
      }).join('') + '</div></div>';
  }
  /** Maand en jaar naast elkaar, over de volle breedte; zoals InvaarPlus. */
  function maandJaar(id, label, veldM, veldJ, jaarVan, jaarTot) {
    return '<div class="vak breed"><span class="vak-kop" id="' + id + '-kop">' + esc(label) + '</span>' +
      '<div class="paar datum" role="group" aria-labelledby="' + id + '-kop">' +
      '<select id="' + id + '-m" data-veld="' + veldM + '" aria-label="Maand" autocomplete="off"><option value="">maand</option>' +
      opties(reeks(1, 12, 1), v[veldM], MAANDEN) + '</select>' +
      '<select id="' + id + '-j" data-veld="' + veldJ + '" aria-label="Jaar" autocomplete="off"><option value="">jaar</option>' +
      opties(reeks(jaarTot, jaarVan, -1), v[veldJ]) + '</select></div></div>';
  }
  /** Een bedrag met zijn eenheid ervoor, één vak breed. */
  function geld(id, veld, label, eenheid) {
    return '<div class="vak"><label class="vak-kop" for="' + id + '">' + esc(label) + '</label>' +
      '<span class="geld-wrap"><span class="geld-teken" id="' + id + '-eenheid">' + esc(eenheid) + '</span>' +
      '<input type="text" id="' + id + '" data-veld="' + veld + '" inputmode="numeric" autocomplete="off" ' +
      'aria-describedby="' + id + '-eenheid" value="' + esc(v[veld]) + '"></span></div>';
  }

  function formulier() {
    var h = '<div class="rooster">' +
      maandJaar('in-g', 'Geboren', 'gm', 'gj', OUDSTE_JAAR, JONGSTE_JAAR) +
      knoppen('in-geslacht', 'g', 'Geslacht', [['M', 'Man'], ['V', 'Vrouw']]) +
      knoppen('in-partner', 'partner', 'Partnerpensioen', [['ja', 'Ja'], ['nee', 'Nee']]);
    if (v.partner === 'ja') {
      h += maandJaar('in-p', 'Partner geboren', 'pm', 'pj', OUDSTE_JAAR, JONGSTE_JAAR_PARTNER) +
        knoppen('in-pgeslacht', 'pg', 'Geslacht partner', [['M', 'Man'], ['V', 'Vrouw']]) +
        '<div class="vak"><label class="vak-kop" for="in-deel">% van uw pensioen</label>' +
        '<input type="text" id="in-deel" data-veld="deel" inputmode="decimal" autocomplete="off" value="' + esc(v.deel) + '"></div>';
    }
    /* De vier bedragen: boven wat er voor het invaren was, onder wat er daarna
       is. De twee pensioenen staan onder elkaar in de linkerkolom (besluit van
       de opdrachtgever, 18 november). De projectierente gebruikt de onderste
       twee, de rekenrente de bovenste twee en het kapitaal. */
    return h +
      geld('in-pensioen-voor', 'pensioenVoor', 'Pensioen v\u00f3\u00f3r invaren', '\u20ac/jaar') +
      geld('in-dg', 'dg', 'Dekkingsgraad', '%') +
      geld('in-pensioen-na', 'pensioenNa', 'Pensioen na invaren', '\u20ac/jaar') +
      geld('in-kapitaal', 'kapitaal', 'Kapitaal na invaren', '\u20ac') +
      /* De keuze van de stand. Het opschrift schrijft de afkorting hier
         voluit (opdrachtgever, 20 november): "Rentetermijnstructuur (RTS)
         van DNB". Daarna, op de uitkomstschermen en in de Uitleg, staat
         "RTS van DNB". Het opschrift staat boven de keuzelijst, zoals bij
         de andere velden; naast elkaar past het niet meer. */
      '<div class="vak breed datum"><label class="vak-kop" for="in-rts">Rentetermijnstructuur (RTS) van DNB</label>' +
      '<select id="in-rts" data-veld="rts" autocomplete="off">' +
      opties(Z.curve.standen, rtsDatum(), Z.curve.standen.map(datumNl)) + '</select></div>' +
      '</div>';
  }

  /** De persoon: {geval} of {melding}. */
  function leesPersoon() {
    if (!v.gm || !v.gj || !v.g) return {melding: 'Vul geboortemaand, -jaar en geslacht in.'};
    var geval = {g: v.g, x: Z.leeftijdMaand(Number(v.gj), Number(v.gm)), partner: null, rts: rtsDatum()};
    if (v.partner === 'ja') {
      if (!v.pm || !v.pj || !v.pg) return {melding: 'Vul geboortemaand, -jaar en geslacht van uw partner in.'};
      var deel = naarProcent(v.deel);
      if (deel === null || deel > 200) return {melding: 'Vul het partnerpensioen in als % van uw pensioen.'};
      geval.partner = {g: v.pg, x: Z.leeftijdMaand(Number(v.pj), Number(v.pm)), deel: deel / 100};
    }
    return {geval: geval};
  }
  /* Ontbreekt er meer dan een ding, dan zegt de melding niet alleen het
     eerste, maar dat het openingsscherm nog moet worden ingevuld
     (opdrachtgever, 18 november: wie een uitkomst opende met een leeg scherm
     kreeg "Vul geboortemaand, -jaar en geslacht in", terwijl ook de bedragen
     ontbraken). Het woord "openingsscherm" is het zijne. Ontbreekt er precies
     een ding, dan blijft de melding zeggen welk; dat laatste is een keuze van
     de bouwer. `tekort` is de lijst van alles wat ontbreekt. */
  var ALLES_INVULLEN = 'Vul eerst het openingsscherm in.';
  function tekortMelding(tekort) {
    return tekort.length > 1 ? ALLES_INVULLEN : tekort[0];
  }
  /** Wat er aan de persoon ontbreekt, als lijst van meldingen. */
  function persoonTekort() {
    var t = [];
    if (!v.gm || !v.gj || !v.g) t.push('Vul geboortemaand, -jaar en geslacht in.');
    if (v.partner === 'ja') {
      var deel = naarProcent(v.deel);
      if (!v.pm || !v.pj || !v.pg) t.push('Vul geboortemaand, -jaar en geslacht van uw partner in.');
      if (deel === null || deel > 200) t.push('Vul het partnerpensioen in als % van uw pensioen.');
    }
    return t;
  }
  /**
   * De invoer voor de projectierente: de persoon, het kapitaal na invaren en
   * het pensioen na invaren. Geeft {geval, kapitaal, pensioenNa} of {melding}.
   */
  function leesProjectie() {
    var t = persoonTekort();
    var kapitaal = naarBedrag(v.kapitaal), pensioenNa = naarBedrag(v.pensioenNa);
    if (!(kapitaal > 0) || !(pensioenNa > 0)) t.push('Vul uw kapitaal na invaren en uw pensioen na invaren in.');
    if (t.length) return {melding: tekortMelding(t)};
    return {geval: leesPersoon().geval, kapitaal: kapitaal, pensioenNa: pensioenNa};
  }
  /**
   * De invoer voor de rekenrente: de persoon, het kapitaal na invaren, de
   * dekkingsgraad en het pensioen voor invaren. Het pensioen na invaren doet
   * hier niet mee.
   */
  function leesRekenrente() {
    var t = persoonTekort();
    var kapitaal = naarBedrag(v.kapitaal);
    if (!(kapitaal > 0)) t.push('Vul uw kapitaal na invaren in.');
    var dg = naarProcent(v.dg);
    if (dg === null || dg < DG_MIN || dg > DG_MAX) {
      t.push('Vul een dekkingsgraad in van ' + DG_MIN + '% tot en met ' + DG_MAX + '%.');
    }
    var pensioenVoor = naarBedrag(v.pensioenVoor);
    if (!(pensioenVoor > 0)) t.push('Vul uw pensioen v\u00f3\u00f3r invaren in.');
    if (t.length) return {melding: tekortMelding(t)};
    return {geval: leesPersoon().geval, kapitaal: kapitaal, dg: dg / 100, pensioenVoor: pensioenVoor};
  }

  /* Een fout uit de kern wordt hier gevangen en als melding getoond. Zij gaat
     ook naar de console: de browsertoets luistert daar, zodat een ingeslikte
     fout niet onopgemerkt blijft. */
  function veilig(f) {
    try { return f(); } catch (e) {
      if (window.console && console.error) console.error(e);
      return {code: 'MISLUKT'};
    }
  }
  function codeTekst(code, welke) {
    var naam = welke || 'projectierente', g = Z.curve.grenzen;
    if (code === 'ONDER_BEREIK') return 'Bij deze bedragen ligt de ' + naam + ' meer dan ' + Math.round(-g.min * 100) + ' procentpunt onder de RTS.';
    if (code === 'BOVEN_BEREIK') return 'Bij deze bedragen ligt de ' + naam + ' meer dan ' + Math.round(g.max * 100) + ' procentpunt boven de RTS.';
    return 'De berekening is mislukt.';
  }
  function melding(tekst) {
    return '<p class="uit-melding" id="uit-melding">' + esc(tekst) + '</p>';
  }

  /**
   * Onder de uitkomst: waaruit zij bestaat (opdrachtgever, 20 november,
   * keuze voor schets A: "de calculator gaat over rentes en geeft delta's,
   * dat is niet logisch"). De uitkomst zelf is een rente; eronder staan de
   * RTS van DNB op de peildatum, als de ene rente waaraan zij voor deze
   * persoon equivalent is, en de delta: de opslag op de RTS.
   *
   * De duiding staat er alleen nog als er iets te doen is: "Navragen" of
   * "Controleer invoer". "Rond risicovrij" verschijnt niet meer
   * (opdrachtgever, 20 november: weinig informatief, dat ziet men zelf).
   */
  function rtsRegel(band) {
    return '<p class="uit-lijn uit-klein uit-rts"><span class="uit-rts-naam">RTS van DNB, <span class="uit-datum">' +
      esc(datumNl(rtsDatum())) + '</span> <span class="uit-datum">(voor u equivalent)</span></span>' +
      '<span class="uit-waarde" id="uit-basis">' + pct(band.basis) + '</span></p>';
  }
  function deltaRegel(band, delta, metDuiding) {
    var d = metDuiding ? duiding(delta, band) : null;
    return '<p class="uit-lijn uit-klein"><span>Delta t.o.v. RTS</span>' +
      '<span class="uit-waarde"><span id="uit-delta">' + ppunt(delta) + '</span> %-punt</span></p>' +
      (d && d.soort !== 'rond' ? '<p class="uit-lijn uit-klein uit-duiding-regel"><span></span>' +
        '<span class="uit-duiding" id="uit-duiding" data-soort="' + d.soort + '">' + esc(d.tekst) + '</span></p>' : '');
  }

  /* ---- De duiding van de delta bij de projectierente -----------------
     Een kort etiket onder de delta (opdrachtgever, 18 november): een fonds
     rekent in principe met een projectierente rond de risicovrije rente, en
     het etiket zegt of de uitkomst daarbij past. De drie etiketten zijn door
     de opdrachtgever vastgesteld; de grenzen zijn een voorstel van de bouwer
     dat hij heeft aanvaard. Alleen bij de projectierente, niet bij de
     rekenrente.

       Rond risicovrij     de delta is hooguit MARGE
       Navragen            de delta is groter, maar ligt binnen de
                           bandbreedte of hooguit MARGE erbuiten
       Controleer invoer   de delta ligt meer dan MARGE buiten de bandbreedte

     Sinds 19 november is de delta de opslag op de RTS (zie rente-reken.js) en
     is de bandbreedte ook in opslagen uitgedrukt: `band` is {basis, min, max}.

     MARGE is 0,30 procentpunt, voor elke leeftijd. Zij is de optelsom van wat
     aan onzekerheid is gemeten: de kostenopslag (0,2 bij 70 jaar als het
     fonds zonder opslag rekent), het ontbreken van de geboortedag (hooguit
     0,11) en 1% verschil in een bedrag (ongeveer 0,1). Bij 90 jaar is de
     kostenopslag alleen al 0,6: voor hoge leeftijden is de marge krap. Zij
     geldt ook aan de rand van de bandbreedte, zodat een fonds dat precies op
     het maximum zit niet "Controleer invoer" krijgt.

     Vergeleken wordt op honderdsten van een procentpunt, zoals het scherm de
     delta toont: een delta die als 0,30 op het scherm staat is "rond". */
  var MARGE = 30;
  function honderdsten(f) { return Math.round(f * 10000); }
  function duiding(delta, band) {
    if (Math.abs(honderdsten(delta)) <= MARGE) return {soort: 'rond', tekst: 'Rond risicovrij'};
    if (honderdsten(delta - band.max) <= MARGE && honderdsten(band.min - delta) <= MARGE) return {soort: 'navragen', tekst: 'Navragen'};
    return {soort: 'controleer', tekst: 'Controleer invoer'};
  }
  function margeTekst() { return (MARGE / 100).toFixed(1).replace('.', ','); }

  /* ---- Eenvoudige controles op de invoer -----------------------------
     Vier regels die duidelijk verkeerde invoer afvangen en zeggen wat er
     waarschijnlijk mis is (voorstel van de bouwer, door de opdrachtgever
     aanvaard op 18 november, met de teksten). Zij gelden op beide
     uitkomstschermen. Er wordt hooguit een melding getoond, de eerste die
     opgaat, in deze volgorde:

       verwisseld   het pensioen is hoger dan het kapitaal. Zelfs op 100 jaar
                    hoort bij een pensioen nog 1,8 keer zoveel kapitaal.
       maand        het kapitaal is hoger dan alle verwachte betalingen
                    samen, maar met 12 keer het pensioen valt de delta binnen
                    de bandbreedte of hooguit MARGE erbuiten.
       negatief     het kapitaal is hoger dan alle verwachte betalingen samen
                    (met de kostenopslag, en op het scherm Rekenrente met de
                    verhoging). Zoveel kan een pensioen zonder rente al niet
                    waard zijn.
       voorNa       pensioen na invaren is lager dan pensioen voor invaren, of
                    meer dan 2 keer zo hoog. Gemeten over mannen en vrouwen
                    van 55 tot 100 jaar, met en zonder partner, bij 125% tot
                    145%: als alles klopt is dat 1,00 tot 1,84 keer. Alleen
                    als beide pensioenen zijn ingevuld.

     Tot 19 november was "negatief": de berekende vlakke rente is lager dan
     0%. Dat is hetzelfde, nu rechtstreeks gemeten in plaats van aan een rente
     afgelezen. Is er een melding, dan toont het scherm Projectierente de
     bandbreedtetabel niet (opdrachtgever). */
  var CONTROLE = {
    verwisseld: 'Kapitaal en pensioen lijken verwisseld.',
    maand: 'Heeft u het pensioen per maand ingevuld? Vul het bedrag per jaar in.',
    negatief: 'Het ingevulde kapitaal na invaren is hoger dan alle pensioen dat u naar verwachting nog krijgt. Controleer uw invoer.',
    voorNa: 'Uw pensioen na invaren past niet bij uw pensioen v\u00f3\u00f3r invaren. Controleer beide bedragen.'
  };
  /**
   * `pensioen` is het pensioen van dit scherm, `som` wat 1 euro pensioen zonder
   * rente waard is, `band` de bandbreedte of null, en `metTwaalf` geeft de
   * delta bij 12 keer dat pensioen, als {s} of {code}.
   * Geeft de naam van de regel die opgaat, of null.
   */
  function controle(kapitaal, pensioen, som, band, metTwaalf) {
    if (pensioen > kapitaal) return 'verwisseld';
    if (kapitaal > pensioen * som) {
      if (band) {
        var t = veilig(metTwaalf);
        if (!t.code && duiding(t.s, band).soort !== 'controleer') return 'maand';
      }
      return 'negatief';
    }
    var voor = naarBedrag(v.pensioenVoor), na = naarBedrag(v.pensioenNa);
    if (voor > 0 && na > 0 && (na < voor || na > 2 * voor)) return 'voorNa';
    return null;
  }
  function controleMelding(regel) {
    return regel ? '<p class="uit-melding uit-controle" id="uit-controle" data-regel="' + regel + '">' +
      esc(CONTROLE[regel]) + '</p>' : '';
  }
  /* Op een uitkomstscherm staan de getallen in twee groepen met een eigen
     kopje: wat is ingevuld en wat is berekend (besluit van de opdrachtgever,
     18 november: "in de resultaten tab's wat invoer is en wat berekend is").
     De woorden "Invoer" en "Berekend" zijn de zijne; dat het twee groepen
     zijn en geen etiket per regel is een keuze van de bouwer. Een etiket per
     regel is uitgeprobeerd: op 402 px breken dan drie van de vijf namen op
     het scherm Rekenrente over twee regels, en op 320 px past het niet.
     Ligt de rente buiten het bereik, dan staat de melding onder "Berekend".
     Ontbreekt er invoer, dan staat er alleen de melding, zonder kopjes. */
  function groep(id, naam) {
    return '<h3 class="uit-groep" id="' + id + '">' + naam + '</h3>';
  }
  /** Een kleine regel: een ingevuld bedrag of een tussenstap. */
  function kleineRegel(id, naam, waarde) {
    return '<p class="uit-lijn uit-klein"><span>' + esc(naam) + '</span>' +
      '<span class="uit-waarde" id="' + id + '">' + waarde + '</span></p>';
  }
  /**
   * De uitkomst zelf: de rente, als een percentage. De calculator rekent
   * elke betaling met de DNB-rente van haar eigen looptijd plus de delta; de
   * rente op deze regel is de ene vaste rente die dezelfde waarde geeft
   * (`Z.curve.gelijkeRente` met de delta als opslag). Zo zijn uitkomst en
   * RTS op dezelfde manier tot een percentage gemaakt.
   *
   * Geschiedenis: op 19 november stond hier alleen de delta ("RTS +0,18
   * %-punt", daarna "Delta projectierente +0,18 %-punt"); op 20 november
   * koos de opdrachtgever voor de rente voorop, met RTS en delta eronder.
   */
  function groteRegel(naam, rente) {
    return '<p class="uit-lijn uit-groot"><span class="uit-naam">' + esc(naam) + '</span>' +
      '<span class="uit-getal"><span id="uit-kop">' + pct(rente) + '</span></span></p>';
  }

  /* ---- Het invoerscherm --------------------------------------------- */
  function hoofd() {
    return '<section class="kaart">' + formulier() +
      '<div class="trio knoppen-onder">' +
      '<button type="button" class="keuzeknop" id="knop-rekenrente" data-scherm="rekenrente">Rekenrente</button>' +
      '<button type="button" class="keuzeknop" id="knop-projectie" data-scherm="projectie">Projectierente</button>' +
      '<button type="button" class="keuzeknop" id="knop-uitleg" data-scherm="uitleg">Uitleg</button></div></section>';
  }

  var TERUG = '<p class="knoprij-schatter"><button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button></p>';
  /* Onder een uitkomst staat naast Terug ook Uitleg (besluit van de
     opdrachtgever, 18 november). Wie de uitleg van daaruit opent, komt met
     Terug weer op dat uitkomstscherm uit en niet op het invoerscherm; dat
     laatste is een keuze van de bouwer. */
  var TERUG_EN_UITLEG = '<div class="knoprij-schatter knoppen-uitkomst">' +
    '<button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button>' +
    '<button type="button" class="keuzeknop" id="knop-uitleg" data-scherm="uitleg">Uitleg</button></div>';
  var uitlegVan = 'hoofd';
  function uitkomstScherm(kop, inhoud) {
    return '<section class="kaart resultaat"><h2 id="pagina-kop" tabindex="-1">' + esc(kop) + '</h2>' +
      inhoud + TERUG_EN_UITLEG + '</section>';
  }

  /* ---- Het scherm Projectierente ------------------------------------
     Bovenaan de twee ingevulde bedragen, de projectierente en haar delta ten
     opzichte van de risicovrije rente. Eronder de bandbreedte: minimum,
     midden en maximum van de projectierente bij deze leeftijd, elk met het
     pensioen dat het ingevulde kapitaal daarbij geeft, en de eigen uitkomst
     op haar plaats ertussen. Boven de tabel staat geen toelichting en geen
     losse kop meer: het woord "Bandbreedte" staat in de groene balk boven de
     eerste kolom, en de kolom met de rentes heet "Projectierente" (besluit
     van de opdrachtgever, 18 november). Die twee woorden passen op een
     telefoon niet naast elkaar op een regel (gemeten op 402 px: 389 px nodig,
     342 px beschikbaar). Daarom staat er in elk een zacht afbreekstreepje
     (&shy;): op een smal scherm breken zij af, op een breed scherm niet. Wat
     de kolommen betekenen staat op het scherm Uitleg; de knop daarheen staat
     onder de tabel. */
  /**
   * Onzichtbare tekens om getallen in een rechts uitgelijnde kolom recht
   * onder elkaar te krijgen: een plusteken waar een tekst geen teken heeft
   * en een andere wel, en een nul per cijfer dat zij korter is. Geeft per
   * tekst de opmaak die ervoor moet, of een lege tekst.
   */
  function vulling(teksten) {
    var teken = /^[+\-\u2212]/;
    var delen = teksten.map(function (t) { var s = teken.test(t) ? 1 : 0; return {s: s, n: t.length - s}; });
    var maxS = Math.max.apply(null, delen.map(function (d) { return d.s; }));
    var maxN = Math.max.apply(null, delen.map(function (d) { return d.n; }));
    return delen.map(function (d) {
      var v = (maxS > d.s ? '+' : '') + new Array(maxN - d.n + 1).join('0');
      return v ? '<span class="tab-vul" aria-hidden="true">' + v + '</span>' : '';
    });
  }
  function projectiePagina() {
    var r = leesProjectie();
    if (r.melding) return uitkomstScherm('Projectierente', melding(r.melding));
    var V = Z.curve;
    var o = veilig(function () { return V.opslag(r.geval, r.kapitaal, r.pensioenNa); });
    var band = veilig(function () { return V.band(r.geval); });
    if (band.code) band = null;
    var regel = o.code === 'MISLUKT' ? null : veilig(function () {
      return {naam: controle(r.kapitaal, r.pensioenNa, V.somBetalingen(r.geval, 0), band, function () {
        return V.opslag(r.geval, r.kapitaal, 12 * r.pensioenNa);
      })};
    }).naam || null;
    var rente = o.code ? o : veilig(function () { return {p: V.gelijkeRente(r.geval, o.s)}; });
    if (rente.code && !o.code) o = rente;
    var boven = '<div class="uitkomst" id="uit">' +
      groep('groep-invoer', 'Invoer') +
      kleineRegel('pr-kapitaal', 'Kapitaal na invaren', eur(r.kapitaal)) +
      kleineRegel('pr-pensioen', 'Pensioen na invaren', eur(r.pensioenNa)) +
      groep('groep-berekend', 'Berekend') +
      (o.code ? melding(codeTekst(o.code)) : groteRegel('Projectierente', rente.p) +
        (band ? rtsRegel(band) + deltaRegel(band, o.s, true) : '')) + controleMelding(regel) + '</div>';
    /* Geen bandbreedtetabel als er een melding staat (opdrachtgever, 18
       november): niet bij een controle op de invoer, en ook niet als de
       uitkomst buiten het bereik ligt. */
    if (!band || regel || o.code) return uitkomstScherm('Projectierente', boven);

    /* De bandbreedte: het minimum, risicovrij (delta 0, dus precies de RTS)
       en het maximum, elk met haar rente, tussen haakjes de delta, en het
       pensioen dat het kapitaal dan geeft (de tabel van schets C, keuze van
       de opdrachtgever, 20 november). De rente in een rij is de ene vaste
       rente die dezelfde waarde geeft als de RTS plus die delta. De eigen
       uitkomst staat op haar plaats ertussen, in de rij "Berekend"; het
       pensioen in die rij is het ingevulde. */
    var rijen = veilig(function () {
      return [['min', 'Minimum', band.min], ['midden', 'Risicovrij', 0], ['max', 'Maximum', band.max]]
        .map(function (x) {
          return {id: x[0], naam: x[1], s: x[2], p: V.gelijkeRente(r.geval, x[2]), u: V.pensioenBij(r.geval, r.kapitaal, x[2])};
        });
    });
    if (rijen.code) return uitkomstScherm('Projectierente', boven);
    var plek = rijen.filter(function (x) { return x.s <= o.s; }).length;
    rijen.splice(plek, 0, {id: 'uw', naam: 'Berekend', s: o.s, p: rente.p, u: r.pensioenNa, uw: true});
    var vp = vulling(rijen.map(function (x) { return pct(x.p); }));
    var vd = vulling(rijen.map(function (x) { return ppunt(x.s); }));
    return uitkomstScherm('Projectierente', boven +
      '<div class="tabel-wrap"><table class="data smal" id="uit-tabel">' +
      '<caption class="sr-only">Bandbreedte van de projectierente</caption>' +
      '<thead><tr><th scope="col" id="band-kop">Band&shy;breedte</th><th scope="col">Projectie&shy;rente</th><th scope="col">Pensioen / jaar</th></tr></thead><tbody>' +
      rijen.map(function (x, i) {
        /* De rentes staan recht onder elkaar, en de delta's ook
           (opdrachtgever, 20 november: "ik verwacht een netjes uitgelijnde
           kolom"). De cel is rechts uitgelijnd en "(0,00)" heeft geen
           teken, dus zonder meer schoof de rente in die rij op. Elke tekst
           krijgt daarom onzichtbare tekens ervoor tot zij even lang is als
           de langste in haar kolom; met tabelcijfers is zij dan even breed. */
        var t = vp[i] + '<span id="c-' + x.id + '-p">' + pct(x.p) + '</span> <span class="tab-delta">' + vd[i] +
          '<span id="c-' + x.id + '-d">(' + ppunt(x.s) + ')</span></span>';
        if (x.uw) t = vp[i] + '<span class="uw" id="uw-rente"><span id="c-uw-p">' + pct(x.p) + '</span> <span class="tab-delta">' + vd[i] +
          '<span id="c-uw-d">(' + ppunt(x.s) + ')</span></span></span><span class="sr-only"> (uw projectierente)</span>';
        return '<tr id="rij-' + x.id + '"><th scope="row">' + esc(x.naam) + '</th>' +
          '<td>' + t + '</td>' +
          '<td id="c-' + x.id + '-u">' + eur(x.u) + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  }

  /* ---- Het scherm Rekenrente ----------------------------------------
     Twee groepen: wat is ingevuld en wat is berekend (besluit van de
     opdrachtgever, 18 november). Binnen elke groep staan de regels van voor
     naar na het invaren: ingevuld zijn het pensioen voor invaren, de
     dekkingsgraad en het kapitaal na invaren; berekend zijn het kapitaal voor
     invaren, de verhoging en de rekenrente. Daarmee is de doorlopende
     volgorde van eerder die dag (pensioen voor, kapitaal voor, dekkingsgraad,
     verhoging, kapitaal na) losgelaten.

     Sinds 27 november staan onder "Berekend" twee kolommen: de
     standaardmethode en de indexatiemethode (opdrachtgever: beide tonen,
     "ruimte genoeg op zelfde regel"). Zie rente-reken.js. De volgorde
     (standaard links), de kolomkoppen "Standaard" en "Indexatie" en
     "%-punt" in de naam van de delta zijn keuzes van de bouwer. De RTS staat
     er een keer: die is voor beide gelijk. De controles op de invoer rekenen
     met de indexatiemethode, zoals tot nu toe. De ids van de
     indexatiemethode zijn de oude; die van de standaardmethode eindigen op
     "-st". */
  function dgTekst(dg) { return String(Math.round(dg * 1000) / 10).replace('.', ',') + '%'; }
  var GEEN = '\u2013';
  /** Een regel met twee waarden, standaard en indexatie. */
  function tweeRegel(klasse, naam, idSt, waardeSt, idIx, waardeIx) {
    return '<p class="uit-lijn ' + klasse + '"><span' + (klasse === 'uit-groot' ? ' class="uit-naam"' : '') + '>' +
      esc(naam) + '</span><span class="uit-twee">' +
      '<span class="uit-waarde" id="' + idSt + '">' + waardeSt + '</span>' +
      '<span class="uit-waarde" id="' + idIx + '">' + waardeIx + '</span></span></p>';
  }
  function rekenrentePagina() {
    var r = leesRekenrente();
    if (r.melding) return uitkomstScherm('Rekenrente', melding(r.melding));
    var V = Z.curve;
    /* Per methode de opslag en de rente als percentage: de ene vaste rente
       die het pensioen v\u00f3\u00f3r invaren dezelfde waarde geeft als de RTS
       plus de delta. Met die rente is het pensioen precies het kapitaal
       v\u00f3\u00f3r invaren waard. */
    function methode(f) {
      var o = veilig(f);
      if (o.code) return o;
      var p = veilig(function () { return {p: V.gelijkeRente(r.geval, o.s)}; });
      if (p.code) return p;
      o.p = p.p;
      return o;
    }
    var st = methode(function () { return V.opslagStandaard(r.geval, r.kapitaal, r.pensioenVoor, r.dg); });
    var ix = methode(function () { return V.opslagRekenrente(r.geval, r.kapitaal, r.pensioenVoor, r.dg); });
    var band = veilig(function () { return V.band(r.geval); });
    if (band.code) band = null;
    var regel = ix.code === 'MISLUKT' ? null : veilig(function () {
      return {naam: controle(r.kapitaal, r.pensioenVoor, V.somNa(r.geval, r.dg), band, function () {
        return V.opslagRekenrente(r.geval, r.kapitaal, 12 * r.pensioenVoor, r.dg);
      })};
    }).naam || null;
    var invoer = groep('groep-invoer', 'Invoer') +
      kleineRegel('rr-pensioen', 'Pensioen v\u00f3\u00f3r invaren', eur(r.pensioenVoor)) +
      kleineRegel('rr-dg', 'Dekkingsgraad', dgTekst(r.dg)) +
      kleineRegel('rr-na', 'Kapitaal na invaren', eur(r.kapitaal)) +
      groep('groep-berekend', 'Berekend');
    if (st.code && ix.code) {
      return uitkomstScherm('Rekenrente', '<div class="uitkomst" id="uit">' + invoer +
        melding(codeTekst(ix.code, 'rekenrente')) + controleMelding(regel) + '</div>');
    }
    function w(o, f) { return o.code ? GEEN : f(o); }
    var meldingen = (st.code ? melding('Standaardmethode: ' + codeTekst(st.code, 'rekenrente')) : '') +
      (ix.code ? melding('Indexatiemethode: ' + codeTekst(ix.code, 'rekenrente')) : '');
    return uitkomstScherm('Rekenrente', '<div class="uitkomst" id="uit">' + invoer +
      '<p class="uit-lijn uit-klein uit-kolomkop" id="rr-koppen"><span></span><span class="uit-twee">' +
      '<span>Standaard</span><span>Indexatie</span></span></p>' +
      tweeRegel('uit-klein', 'Kapitaal v\u00f3\u00f3r invaren', 'rr-voor-st', w(st, function (o) { return eur(o.kapitaalVoor); }),
        'rr-voor', w(ix, function (o) { return eur(o.kapitaalVoor); })) +
      tweeRegel('uit-klein', 'Geschatte verhoging', 'rr-verhoging-st', w(st, function (o) { return pct(o.verhoging, 1); }),
        'rr-verhoging', w(ix, function (o) { return pct(o.verhoging, 1); })) +
      tweeRegel('uit-groot', 'Rekenrente', 'uit-kop-st', w(st, function (o) { return pct(o.p); }),
        'uit-kop', w(ix, function (o) { return pct(o.p); })) +
      (band ? rtsRegel(band) +
        tweeRegel('uit-klein', 'Delta t.o.v. RTS (%-punt)', 'uit-delta-st', w(st, function (o) { return ppunt(o.s); }),
          'uit-delta', w(ix, function (o) { return ppunt(o.s); })) : '') +
      meldingen + controleMelding(regel) + '</div>');
  }

  /**
   * De RTS zelf, onderaan de Uitleg (opdrachtgever, 20 november: "in het
   * uitleg scherm voeg de RTS tabel toe"). De rentes komen uit de kern
   * (`rentecurve.curve`, in procenten, drie decimalen zoals DNB ze geeft).
   * Getoond worden de looptijden 1 tot en met RTS_TOT jaar: de calculator
   * rekent betalingen tot ruim 55 jaar vooruit en gebruikt dus de punten tot
   * en met 56; de RTS zelf loopt tot 100. Welke looptijden, de plaats
   * onderaan, de vorm (een lijst in kolommen) en de zinnen erboven zijn van
   * de bouwer.
   */
  var RTS_TOT = 60;
  function rtsTabel() {
    var curve = Z.curve.stand(rtsDatum()), rijen = '';
    for (var m = 1; m <= RTS_TOT; m++) {
      rijen += '<li><span class="rts-jaar">' + m + '<span class="sr-only"> jaar:</span></span> ' +
        '<span class="rts-rente">' + Number(curve[m]).toFixed(3).replace('.', ',') + '%</span></li>';
    }
    /* De grafiek (opdrachtgever, 20 november: "Is een grafiek ook niet
       inzichtelijk?") wordt na het tekenen van het scherm ingevuld door
       `tekenRts`, op de breedte die er dan is. De lijst eronder is haar
       tabelweergave: elk getal van de grafiek staat daar ook. */
    return '<h4 id="uitleg-rts-kop">RTS van DNB, ' + esc(datumNl(rtsDatum())) + '</h4>' +
      '<p>Dit is de rente per looptijd. De grafiek laat het verloop zien; de getallen staan eronder.</p>' +
      '<div class="rts-grafiek" id="uitleg-rts-grafiek" tabindex="0"></div>' +
      '<p>In de lijst staat de looptijd links, in jaren. De calculator gebruikt de looptijden ' +
      'tot 56 jaar. Voor een looptijd tussen twee jaren neemt hij een rente ertussenin. Korter dan een jaar ' +
      'geldt de rente van 1 jaar. Hier staan de looptijden tot en met ' + RTS_TOT + ' jaar. De RTS zelf loopt ' +
      'door tot 100 jaar.</p>' +
      '<ol class="rts-lijst" id="uitleg-rts">' + rijen + '</ol>';
  }

  /**
   * Wat de RTS is en wat risicovrij betekent (opdrachtgever, 20 november:
   * "in de uitleg wat uitgebreider de RTS omschrijven en ook wat risicovrij
   * is", met een tekst over de nominale rentetermijnstructuur voor
   * pensioenfondsen als materiaal). De bouwer heeft die tekst herschreven in
   * de taal van deze uitleg: "u", korte zinnen, en de afgesproken woorden
   * (dus "betalen" en niet "uitkeren"). Afwijkingen van het materiaal:
   *
   *   - de slotzin noemt de RTS geen "rekenrente": dat woord is in deze
   *     calculator een eigen begrip;
   *   - na het rekenvoorbeeld staat een zin met de echte rente voor 20 jaar
   *     uit de gekozen stand;
   *   - het blok "Wat is risicovrij?" stond niet in het materiaal en is van
   *     de bouwer.
   *
   * De bedragen in het voorbeeld worden hier uitgerekend: 100.000 gedeeld
   * door (1 + rente) tot de macht 20.
   */
  var VOORBEELD_BEDRAG = 100000, VOORBEELD_JAREN = 20;
  function voorbeeldNodig(rente) { return VOORBEELD_BEDRAG / Math.pow(1 + rente, VOORBEELD_JAREN); }
  function rtsUitleg() {
    var rente20 = Number(Z.curve.stand(rtsDatum())[VOORBEELD_JAREN]);
    return '<h3 id="uitleg-rts-deel">De rentetermijnstructuur (RTS)</h3>' +
      '<h4>Wat is de RTS?</h4>' +
      '<p>De RTS is een lijst met rentes. Pensioenfondsen berekenen ermee hoeveel geld zij nu nodig hebben om ' +
      'later de pensioenen te betalen. De Nederlandsche Bank (DNB) maakt elke maand een nieuwe RTS bekend.</p>' +
      '<p>De volledige naam is: nominale rentetermijnstructuur voor pensioenfondsen (zero coupon). Dat ' +
      'betekent:</p>' +
      '<ul id="uitleg-rts-woorden">' +
      '<li><strong>Nominaal:</strong> de rente houdt geen rekening met stijgende prijzen (inflatie).</li>' +
      '<li><strong>Rentetermijnstructuur:</strong> de rente verschilt per looptijd. Bijvoorbeeld 1 jaar, 10 jaar, ' +
      '20 jaar of 30 jaar.</li>' +
      '<li><strong>Zero coupon:</strong> de rente hoort bij \u00e9\u00e9n betaling op \u00e9\u00e9n moment in de toekomst. ' +
      'Tussendoor wordt geen rente betaald.</li></ul>' +
      '<h4>Een voorbeeld</h4>' +
      '<p>Een pensioenfonds moet over ' + VOORBEELD_JAREN + ' jaar ' + eur(VOORBEELD_BEDRAG) + ' aan pensioen betalen. ' +
      'Hoeveel geld is daar vandaag voor nodig? Dat hangt af van de rente.</p>' +
      '<div class="tabel-wrap"><table class="data smal" id="uitleg-voorbeeld">' +
      '<thead><tr><th scope="col">Rente (' + VOORBEELD_JAREN + ' jaar)</th><th scope="col">Vandaag nodig</th></tr></thead><tbody>' +
      [0.01, 0.02, 0.03, 0.04].map(function (r) {
        return '<tr><th scope="row">' + Math.round(r * 100) + '%</th><td>' + eur(voorbeeldNodig(r)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p>Dit voorbeeld rekent met \u00e9\u00e9n vaste rente, die elk jaar wordt bijgeschreven.</p>' +
      '<p id="uitleg-voorbeeld-rts">De RTS van ' + esc(datumNl(rtsDatum())) + ' geeft voor ' + VOORBEELD_JAREN +
      ' jaar een rente van ' + rtsGetal(rente20) + '. Dan is vandaag ' + eur(voorbeeldNodig(rente20 / 100)) + ' nodig.</p>' +
      '<p>Stijgt de rente? Dan heeft een pensioenfonds vandaag minder geld nodig voor dezelfde pensioenen. ' +
      'Daalt de rente? Dan heeft het meer geld nodig.</p>' +
      '<p>Let op: dit is niet de rente die u op uw pensioen krijgt. Het is een rente om de waarde van ' +
      'toekomstige pensioenen te berekenen.</p>' +
      /* Looptijd is geen leeftijd (opdrachtgever, 20 november: "nog wat
         verduidelijking over looptijd en leeftijd toevoegen"). De tekst is
         van de bouwer. Wat er staat volgt uit de berekening: elke
         maandbetaling telt mee met de kans dat zij nodig is, tegen de rente
         van haar eigen looptijd, geteld vanaf het invaren. */
      '<h4 id="uitleg-looptijd-kop">Looptijd en leeftijd</h4>' +
      '<p>De looptijd is niet uw leeftijd. De looptijd is het aantal jaren vanaf het invaren tot een betaling ' +
      'van uw pensioen.</p>' +
      '<p>Uw pensioen wordt elke maand betaald, vele jaren lang. Elke betaling heeft dus een eigen looptijd. ' +
      'De betaling 1 jaar na het invaren heeft een looptijd van 1 jaar. De betaling 20 jaar na het invaren ' +
      'heeft een looptijd van 20 jaar.</p>' +
      '<p>Een voorbeeld. Bent u bij het invaren 70 jaar? Dan heeft de betaling op uw 80e een looptijd van 10 ' +
      'jaar. De betaling op uw 90e heeft een looptijd van 20 jaar.</p>' +
      '<p>De calculator telt alle betalingen mee die u naar verwachting nog krijgt. Een betaling op hoge ' +
      'leeftijd telt minder zwaar mee. De kans dat u dan nog leeft is kleiner.</p>' +
      '<p>Hoe ouder u bent, hoe korter de looptijden die meetellen. Bent u jonger, of heeft u een jongere ' +
      'partner? Dan tellen ook lange looptijden mee. Daarom verschilt de rente achter "voor u equivalent" per ' +
      'persoon.</p>' +
      /* Naar aanleiding van een vraag van een gebruiker (27 november): "mijn
         levensverwachting is ongeveer nog 20 jaar. Daar staat dan 3.448% in de
         tabel bij de uitleg." De tekst is van de bouwer; de opdrachtgever
         vroeg om de aanpassing. De getallen gelden voor een man van 70 bij
         elke stand van 2026: nog 18,6 jaar te leven, 60-61% van de waarde in
         de eerste 10 jaar, en de gelijke rente steeds dichter bij de rente
         voor 10 jaar dan bij die voor 19 jaar. test/browser-rente.mjs rekent
         dat per stand na. */
      '<p id="uitleg-levensverwachting">De rente achter "voor u equivalent" is dus niet de rente bij uw ' +
      'levensverwachting. Een man van 70 leeft naar verwachting nog ongeveer 19 jaar. Toch zit ruim de helft ' +
      'van de waarde van zijn pensioen in de eerste 10 jaar. Die betalingen krijgt hij vrijwel zeker. Daarom ' +
      'ligt zijn equivalente rente dichter bij de rente voor 10 jaar dan bij die voor 19 jaar.</p>' +
      '<h4>Wat is risicovrij?</h4>' +
      '<p>Risicovrij betekent: zonder beleggingsrisico. De risicovrije rente is de rente op geld dat u vrijwel ' +
      'zeker terugkrijgt. Wie belegt, bijvoorbeeld in aandelen, verwacht meer dan die rente. Maar dat is niet ' +
      'zeker: het kan ook minder worden. In de risicovrije rente zit geen opslag voor dat risico.</p>' +
      '<p>Pensioenfondsen gebruiken de RTS van DNB als risicovrije rente. In de tabel bij de projectierente is ' +
      '"Risicovrij" de rij met delta 0. Daar is precies met de RTS gerekend.</p>';
  }

  /**
   * De lijngrafiek van de RTS, getekend in beeldpunten op de breedte van het
   * vak (geen meeschalende viewBox: de letters blijven dan op elke breedte
   * even groot als de rest van de pagina).
   *
   *   - een lijn, dus geen legenda: de kop zegt wat er staat;
   *   - twee labels in de grafiek, het hoogste punt en het laatste; de rest
   *     staat op de assen, in de aanwijzer en in de lijst;
   *   - de aanwijzer: een verticale haarlijn die naar het dichtstbijzijnde
   *     jaar springt, met de rente erbij. Met muis of vinger, en met de
   *     pijltjestoetsen als de grafiek de focus heeft;
   *   - de verticale as begint niet bij nul: het gaat om het verloop tussen
   *     ongeveer 2,7% en 3,5%, en de as zegt welke waarden er staan.
   *
   * De kleur van de lijn (#2E8B68) is een groen uit dezelfde familie als de
   * pagina dat als gegevenskleur voldoende verzadigd is; de twee groenen van
   * de pagina zelf zijn daarvoor te grijs. Alle vormgeving is van de bouwer.
   */
  function rtsGetal(r) { return Number(r).toFixed(3).replace('.', ',') + '%'; }
  function tekenRts() {
    var vak = document.getElementById('uitleg-rts-grafiek');
    if (!vak) return;
    var curve = Z.curve.stand(rtsDatum()), n = RTS_TOT, breed = vak.clientWidth, hoog = 228;
    if (!(breed > 0)) return;
    /* Boven de grafiek is een strook van 30 px vrij voor de aanwijzer, zodat
       die het label van het hoogste punt niet bedekt. */
    var L = 52, R = 14, T = 58, O = 46, pb = breed - L - R, ph = hoog - T - O;
    var laag = Infinity, top = -Infinity, piek = 1, m;
    for (m = 1; m <= n; m++) {
      var r = Number(curve[m]);
      if (r < laag) laag = r;
      if (r > top) { top = r; piek = m; }
    }
    var y0 = Math.floor(laag * 2) / 2, y1 = Math.ceil(top * 2) / 2;
    if (y1 === y0) y1 = y0 + 0.5;
    function X(jaar) { return L + jaar / n * pb; }
    function Y(rente) { return T + (y1 - rente) / (y1 - y0) * ph; }
    function f(g) { return (Math.round(g * 10) / 10).toFixed(1); }
    var svg = '', t;
    for (t = y0; t <= y1 + 1e-9; t += 0.5) {
      svg += '<line class="rts-raster" x1="' + L + '" x2="' + (breed - R) + '" y1="' + f(Y(t)) + '" y2="' + f(Y(t)) + '"/>' +
        '<text class="rts-as" text-anchor="end" x="' + (L - 8) + '" y="' + f(Y(t) + 5) + '">' + t.toFixed(1).replace('.', ',') + '%</text>';
    }
    for (t = 10; t <= n; t += 10) {
      svg += '<text class="rts-as" text-anchor="middle" x="' + f(X(t)) + '" y="' + (hoog - O + 20) + '">' + t + '</text>';
    }
    svg += '<text class="rts-as" text-anchor="end" x="' + (breed - R) + '" y="' + (hoog - 4) + '">looptijd in jaren</text>';
    var punten = '';
    for (m = 1; m <= n; m++) punten += (m > 1 ? ' ' : '') + f(X(m)) + ',' + f(Y(Number(curve[m])));
    svg += '<polyline class="rts-lijn" id="rts-lijn" points="' + punten + '"/>';
    /* Het hoogste punt: het label erboven, binnen de grafiek gehouden. */
    var tekstPiek = piek + ' jaar: ' + rtsGetal(curve[piek]), halve = tekstPiek.length * 4.4;
    var xp = Math.min(Math.max(X(piek), L + halve), breed - R - halve);
    svg += '<circle class="rts-stip" cx="' + f(X(piek)) + '" cy="' + f(Y(top)) + '" r="4"/>' +
      '<text class="rts-label" id="rts-label-piek" text-anchor="middle" x="' + f(xp) + '" y="' + f(Y(top) - 10) + '">' + esc(tekstPiek) + '</text>';
    /* Het laatste punt: het label eronder, als daar ruimte is boven de as. */
    var ye = Y(Number(curve[n]));
    svg += '<circle class="rts-stip" cx="' + f(X(n)) + '" cy="' + f(ye) + '" r="4"/>';
    if (piek !== n && ye + 24 <= hoog - O) {
      svg += '<text class="rts-label" id="rts-label-eind" text-anchor="end" x="' + f(X(n)) + '" y="' + f(ye + 20) + '">' +
        esc(n + ' jaar: ' + rtsGetal(curve[n])) + '</text>';
    }
    svg += '<g id="rts-wijzer" visibility="hidden"><line class="rts-kruis" id="rts-kruis" y1="' + T + '" y2="' + (hoog - O) + '"/>' +
      '<circle class="rts-stip" id="rts-punt" r="5"/></g>';
    vak.innerHTML = '<svg width="' + breed + '" height="' + hoog + '" role="img" focusable="false" aria-label="' +
      esc('Lijngrafiek van de RTS van DNB. De rente is ' + rtsGetal(curve[1]) + ' bij 1 jaar, het hoogst bij ' + piek + ' jaar met ' +
        rtsGetal(curve[piek]) + ', en ' + rtsGetal(curve[n]) + ' bij ' + n + ' jaar. Alle getallen staan in de lijst eronder.') +
      '">' + svg + '</svg><div class="rts-tip" id="rts-tip" aria-live="polite" hidden></div>';

    }
    if (!k) return;
    v[k.getAttribute('data-veld')] = k.getAttribute('data-waarde');
    teken(k.id);
  });
  /* Het invoerscherm toont geen uitkomst; wat wordt ingevuld hoeft alleen
     onthouden te worden. Gerekend wordt pas op een uitkomstscherm. */
  app.addEventListener('change', function (e) {
    var el = e.target, veld = el.getAttribute && el.getAttribute('data-veld');
    if (veld && el.tagName === 'SELECT') v[veld] = el.value;
  });
  app.addEventListener('input', function (e) {
    var el = e.target, veld = el.getAttribute && el.getAttribute('data-veld');
    if (veld && el.tagName === 'INPUT') v[veld] = el.value;
  });

  teken(null);
})();

</script>

</body>
</html>
