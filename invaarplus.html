<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvaarPlus</title>
<meta name="description" content="Een schatting van de verhoging van uw pensioen bij het invaren volgens de indexatiemethode, afgelezen uit een tabel. Met de gevoeligheid voor de dekkingsgraad en de verwachte indexatie.">
<meta name="color-scheme" content="light">
<style>
/* ==========================================================================
   InvaarVergelijker: weergavelaag (presentatie)
   Palet: #245447 #51826D #D8E7DB #F4F7F2 #FFFFFF
   Doelgroep 60+: basis 18px, grote velden en knoppen, duidelijke focus.
   Contrast (nagerekend, zie README): tekst altijd #245447 — 8,63:1 op wit,
   7,98:1 op #F4F7F2, 6,73:1 op #D8E7DB.
   #51826D haalt 4,41:1 tegen wit en is daarmee GEEN tekstkleur op 18px en
   GEEN vlak onder witte tekst; gebruik hem alleen als rand of als accentbalk
   zonder tekst erop. Vlakken met witte tekst zijn altijd #245447.
   (Een eerdere versie van deze kop noemde hier 5,2:1 en raadde #51826D juist
   aan als vlak onder witte tekst; dat was onjuist en leverde AA-fouten op.)
   ========================================================================== */

:root {
  --groen-donker: #245447;
  --groen-mid: #51826D;
  --groen-licht: #D8E7DB;
  --groen-bleek: #F4F7F2;
  --wit: #FFFFFF;

  --txt: 18px;
  --txt-s: 16px;
  --txt-l: 21px;
  --radius: 10px;
  --rij: 1.55;
  --veld-hoogte: 3.1rem;
  --max: 56rem;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: var(--txt);
  line-height: var(--rij);
  color: var(--groen-donker);
  background: var(--groen-bleek);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 700; }
p { margin: 0 0 0.85em; }
p:last-child { margin-bottom: 0; }

/* --- Hulpmiddelen ------------------------------------------------------- */

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skiplink {
  position: absolute; left: -9999px; top: 0; z-index: 10;
  background: var(--groen-donker); color: var(--wit);
  padding: 0.75rem 1.25rem; border-radius: 0 0 var(--radius) 0;
  font-weight: 700; text-decoration: none;
}
.skiplink:focus { left: 0; }

:focus-visible {
  outline: 3px solid var(--groen-donker);
  outline-offset: 2px;
}
.kop-band :focus-visible { outline-color: var(--wit); }

/* --- Kop --------------------------------------------------------------- */

.kop-band {
  background: var(--groen-donker);
  color: var(--wit);
  padding: 1.5rem 1.25rem;
}
.kop-binnen {
  max-width: var(--max); margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 0.75rem 2rem;
  align-items: center; justify-content: space-between;
}
.kop-band h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
/* Geen kader en geen vet: in deze band is een afgerond kader een knop, en
   deze regel is tekst. Het onderscheid zit dus in de vorm, niet alleen in de
   tekengrootte. */
/* "InvaarVergelijker" is één woord en breekt uit zichzelf nergens. Bij 200%
   tekst op een smal scherm is het breder dan de kopband, en dan schuift de
   hele pagina horizontaal — precies wat deze opmaak wil voorkomen. In
   `shell.html` staat daarom een <wbr> tussen "Invaar" en "Vergelijker", zodat
   het afbreekpunt op een leesbare plek ligt; `overflow-wrap` vangt af wat
   daarnaast nog te breed wordt. Hernoemt u de calculator, controleer dit dan
   opnieuw: de vorige naam was kort genoeg om het probleem te verbergen. */
.kop-titel { min-width: 0; }
.kop-band h1 { overflow-wrap: break-word; }
/* De ondertitel staat binnen de <h1>, zodat de koptekst één kop blijft: de
   toets eist precies één <h1>, en een tweede kop zou de structuur verdelen
   zonder dat er een tweede onderwerp is. Als blok op een eigen regel, en
   kleiner dan de naam, zodat de naam de kop blijft dragen. */
.kop-sub { display: block; margin: 0.3rem 0 0; font-size: var(--txt-s); font-weight: 400; letter-spacing: 0; }
.kop-waarschuwing { margin: 0.3rem 0 0; font-size: var(--txt-s); }
/* Wit op --groen-donker: 8,63:1. Hoogte volgt --veld-hoogte, net als de
   overige knoppen, zodat ook deze boven de 48px blijft. */
/* Wrap, want het zijn er drie: zonder wrap staan ze op één onbreekbare regel
   en schuift de kopband horizontaal bij 360px of 200% tekst. .kop-binnen
   wrapt al, maar dat verplaatst de groep als geheel. */
.kop-knoppen { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.knop-kop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.5rem 1.1rem;
  border: 2px solid var(--wit); border-radius: var(--radius);
  background: var(--groen-donker); color: var(--wit);
  cursor: pointer;
}
.knop-kop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-kop[aria-pressed="true"] { background: var(--wit); color: var(--groen-donker); }

/* Vervolgvragen die pas verschijnen na een Ja: ingesprongen met een lijn,
   zodat zichtbaar is waar ze bij horen. */
.vervolg {
  border-left: 4px solid var(--groen-licht);
  padding-left: 1.1rem;
  margin: 0 0 1.6rem;
}
.vervolg > :last-child { margin-bottom: 0; }

/* Twee bedragen van hetzelfde UPO naast elkaar; ze breken naar onder elkaar
   zodra er geen ruimte meer is. */
.bedrag-paar { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
/* Labels breken over verschillend veel regels af: "Ouderdomspensioen met
   AOW-compensatie" neemt er twee, "Nabestaandenpensioen" ernaast één. Zonder
   dit zouden de invoervelden op verschillende hoogten beginnen. Elk veld is
   daarom zelf een kolom, en het label rekt uit om de hoogte op te nemen
   (`flex: 1`), zodat wat eronder hangt — het invoervak en de regel met de
   bedragen — bij alle velden op dezelfde hoogte staat.

   Niet met `justify-content: space-between`: dat werkte toen label en invoer
   de enige twee kinderen waren, maar sinds er een regel onder de invoer staat
   duwt het de invoer naar het midden van de overgebleven ruimte, en daar
   belandt hij bij een kort label hoger dan bij een lang. */
.bedrag-paar .veld {
  flex: 1 1 13rem; min-width: 0; margin-bottom: 1.1rem;
  display: flex; flex-direction: column;
}
.bedrag-paar .veld > label { flex: 1 0 auto; }
/* `.veld:last-child` haalt elders de ondermarge weg. In deze rij zou het
   laatste veld daardoor 1,1rem dieper doorlopen dan zijn buren, en dan staat
   zijn invoerveld niet meer op één lijn. Binnen de rij dus gelijke marges. */
.bedrag-paar .veld:last-child { margin-bottom: 1.1rem; }
/* Kop boven een groep invoervelden ("UPO 1", "UPO 2"). Eerder stond hier de
   `.rap-kop` van de rapporttabellen, met een ondermarge van 2rem die bij een
   tabel hoort. Boven invoer telt die op bij de 1,1rem van de velderij erboven,
   waardoor er tussen twee UPO's bijna drie keer zoveel ruimte stond als tussen
   een velderij en het label eronder. Hier hoort de maat van het formulier. */
.groep-kop { font-size: 1.15rem; margin: 0.9rem 0 0.75rem; }
.groep-kop:first-child { margin-top: 0; }
.bedrag-paar .geld-wrap { max-width: none; }

/* --- Keuze uit twee ----------------------------------------------------- */

.keuzeknoppen { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.keuzeknop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  min-width: 7rem;
  padding: 0.6rem 1.5rem;
  border: 2px solid var(--groen-mid); border-radius: var(--radius);
  background: var(--wit); color: var(--groen-donker);
  cursor: pointer;
}
.keuzeknop:hover { background: var(--groen-licht); }
/* De gekozen knop: wit op --groen-donker (8,63:1), plus een dikkere rand,
   zodat het verschil niet alleen in kleur zit. */
.keuzeknop.aan {
  background: var(--groen-donker); color: var(--wit); border-color: var(--groen-donker);
  box-shadow: inset 0 0 0 2px var(--wit);
}

/* --- Openingsvraag ------------------------------------------------------ */

.triage-criteria { list-style: none; margin: 0 0 1.75rem; padding: 0; }
.triage-criteria li {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0; font-weight: 700;
}
.triage-criteria .vink {
  flex: 0 0 auto;
  width: 2rem; height: 2rem; border-radius: var(--radius);
  background: var(--groen-licht); color: var(--groen-donker);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.triage-vraag { border: 0; padding: 0; margin: 0 0 1.5rem; }
.triage-vraag legend { padding: 0 0 0.75rem; font-weight: 700; font-size: var(--txt-l); }
.triage-vraag .keuze { margin: 0 0 0.75rem; }
.keuze-groot .keuze-titel { font-size: var(--txt-l); }

/* Lopende tekst over de volle breedte van de kaart, zoals de disclaimer. */
.lange-tekst { margin: 0 0 1.5rem; }
.lange-tekst p { margin: 0 0 1rem; }

/* --- Privacyscherm ------------------------------------------------------ */

.priv-kaarten { display: flex; flex-direction: column; gap: 1rem; margin: 0 0 1.5rem; }
.priv-kaart {
  border: 2px solid var(--groen-licht); border-radius: var(--radius);
  background: var(--wit); padding: 1.1rem 1.25rem;
}
.priv-kaart.uitgelicht { background: var(--groen-licht); border-color: var(--groen-mid); }
.priv-kaart h3 { font-size: var(--txt); margin: 0 0 0.45rem; }
.priv-kaart p { margin: 0; }
/* Niet het blauw van de browser: tekstkleur is overal --groen-donker. */
.priv-kaart a { color: var(--groen-donker); }

/* --- Romp -------------------------------------------------------------- */

.romp { max-width: var(--max); margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

.voortgang { margin-bottom: 1.25rem; }
.voortgang-tekst { font-weight: 700; margin: 0 0 0.5rem; }
.voortgang-balk {
  height: 0.75rem; background: var(--groen-licht);
  border-radius: 999px; overflow: hidden;
}
.voortgang-vulling {
  display: block; height: 100%; background: var(--groen-mid);
  border-radius: 999px; transition: width 0.25s ease;
}

.kaart {
  background: var(--wit);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 1.75rem;
}
.kaart > h2 {
  font-size: 1.35rem;
  margin: 0 0 0.35rem;
}
.kaart-intro { margin: 0 0 1.5rem; }
.kaart-intro:only-of-type { margin-bottom: 1.25rem; }

/* --- Formulier --------------------------------------------------------- */

.veld { margin: 0 0 1.6rem; }
.veld:last-child { margin-bottom: 0; }
/* Een veld dat zelf een groep begint (AOW-compensatiepensioen, pensioenkapitaal)
   heeft geen kop boven zich. Zonder dit staat het tegen de UPO-groep erboven
   aan terwijl het een ander pensioen is; dezelfde maat als `.groep-kop` zet
   alle groepen op hetzelfde ritme. */
.veld-groep { margin-top: 0.9rem; }
/* Het blok met de vormvragen op stap 5. De laatste vraag verliest zijn
   ondermarge aan `.veld:last-child`; zonder deze regel staat de eerste
   UPO-kop er dichter op dan de vragen op elkaar. */
.brief-vorm { margin-bottom: 0.7rem; }
/* Naam van het pensioen boven de twee vakken "Vóór invaren" en "Ná invaren".
   Kleiner dan `.groep-kop`, want dat is op stap 5 de UPO erboven. */
.paar-kop { font-size: 1.02rem; margin: 0.9rem 0 0.6rem; }
.paar-kop:first-child { margin-top: 0; }
.groep-kop + .paar-kop { margin-top: 0; }
.veld > label, .veld-kop {
  display: block; font-weight: 700; margin-bottom: 0.5rem;
}
.hint { font-size: var(--txt-s); margin: 0.45rem 0 0; }

input[type="number"], input[type="text"], select {
  font: inherit;
  color: var(--groen-donker);
  background: var(--wit);
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 0.6rem 0.75rem;
  min-height: var(--veld-hoogte);
  width: 100%;
  max-width: 22rem;
}
select {
  /* eigen pijl, geen externe bron */
  appearance: none; -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, #245447 50%),
    linear-gradient(135deg, #245447 50%, transparent 50%);
  background-position: right 1.25rem center, right 0.9rem center;
  background-size: 0.42rem 0.42rem, 0.42rem 0.42rem;
  background-repeat: no-repeat;
  padding-right: 2.5rem;
}
input:hover, select:hover { border-color: var(--groen-donker); }
input[aria-invalid="true"] { border-color: var(--groen-donker); border-width: 3px; }

.geld-wrap { display: flex; align-items: stretch; max-width: 22rem; }
/* De eenheid staat voluit in dit vlak ("€/jaar"), dus het is breder dan het
   oude €-teken. `white-space: nowrap` houdt hem op één regel; `flex: 0 0 auto`
   laat hem zijn eigen breedte nemen zonder het invoerveld te verdringen.
   Groen-licht met groen-donkere tekst: ruim boven AA. */
.geld-teken {
  flex: 0 0 auto; display: flex; align-items: center;
  padding: 0 0.75rem; white-space: nowrap;
  background: var(--groen-licht); color: var(--groen-donker);
  border: 2px solid var(--groen-donker); border-right: 0;
  border-radius: var(--radius) 0 0 var(--radius);
  font-variant-numeric: tabular-nums;
}
.geld-wrap input { border-radius: 0 var(--radius) var(--radius) 0; max-width: none; }

/* datum in drie delen */
.datum-rij { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.datum-deel { display: flex; flex-direction: column; }
.datum-deel label { font-size: var(--txt-s); font-weight: 400; margin-bottom: 0.25rem; }
.datum-dag input { width: 5.5rem; }
.datum-jaar input { width: 7.5rem; }
.datum-maand select { width: 11rem; }

/* keuzelijst als grote radio's */
.keuzes { display: grid; gap: 0.85rem; }
.keuze {
  display: flex; gap: 0.9rem; align-items: flex-start;
  border: 2px solid var(--groen-mid);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  background: var(--wit);
  cursor: pointer;
}
.keuze:hover { background: var(--groen-bleek); }
.keuze input { width: 1.5rem; height: 1.5rem; margin: 0.15rem 0 0; accent-color: #245447; flex: none; }
.keuze:has(input:checked) { background: var(--groen-licht); border-color: var(--groen-donker); border-width: 3px; padding: calc(1rem - 1px) calc(1.1rem - 1px); }
.keuze:focus-within { outline: 3px solid var(--groen-donker); outline-offset: 2px; }
.keuze-titel { display: block; font-weight: 700; }

/* --- Uitlegscherm -------------------------------------------------------
   De drie delen van de doorloop. Een genummerde lijst, want de volgorde is
   de boodschap: eerst wat u nu heeft, dan wat de calculator ervan maakt, dan
   wat SSPF ervan maakt. */
.stappen-uitleg { margin: 0 0 1.5rem; padding-left: 1.6rem; }
.stappen-uitleg li { margin: 0 0 0.8rem; padding-left: 0.3rem; }
.stappen-uitleg li strong { color: var(--groen-donker); }

/* --- Knoppen ----------------------------------------------------------- */

.knoprij {
  display: flex; flex-wrap: wrap; gap: 0.85rem;
  margin-top: 2rem; padding-top: 1.5rem;
  border-top: 2px solid var(--groen-licht);
}
.knop {
  font: inherit; font-weight: 700;
  min-height: var(--veld-hoogte);
  padding: 0.65rem 1.6rem;
  border-radius: var(--radius);
  border: 2px solid var(--groen-donker);
  background: var(--groen-donker);
  color: var(--wit);
  cursor: pointer;
}
/* Omkeren in plaats van vergrijzen: wit op --groen-mid haalt 4,41:1 en dus
   geen AA. Omgekeerd is het 8,63:1 en is de hover-stand duidelijker. */
.knop:hover { background: var(--wit); color: var(--groen-donker); }
.knop-tweede { background: var(--wit); color: var(--groen-donker); }
.knop-tweede:hover { background: var(--groen-licht); }
.knop-volgende { margin-left: auto; }

/* --- Meldingen --------------------------------------------------------- */

.fouten {
  border: 2px solid var(--groen-donker);
  border-left-width: 10px;
  border-radius: var(--radius);
  background: var(--groen-licht);
  padding: 1rem 1.1rem;
  margin: 0 0 1.5rem;
}
.fouten h3 { font-size: var(--txt); margin-bottom: 0.35rem; }
.fouten ul { margin: 0; padding-left: 1.3rem; }
.fouten li { margin: 0.2rem 0; }

.noot {
  background: var(--groen-bleek);
  border: 2px solid var(--groen-licht);
  border-radius: var(--radius);
  padding: 0.9rem 1.1rem;
  font-size: var(--txt-s);
  margin: 0 0 1rem;
}
/* Advies over de schermbreedte, op het uitlegscherm. Staat op elke breedte.

   Eerder verscheen hij alleen onder 30rem, daar waar de tabellen stapelen.
   Dat was logischer, maar gedrag dat je op een breed scherm nooit te zien
   krijgt, wordt bij onderhoud over het hoofd gezien — het viel zelfs bij de
   eigen oplevering niet op. Nu staat hij er altijd, iets kleiner dan de
   lopende tekst, en op papier helemaal niet (zie `@media print`).

   Gemeten op 01-11-2026 (3 UPO's, partner, hoog/laag, AOW-compensatie): de
   vergelijking kost 6,7 schermhoogtes op 360px breed en 2,6 vanaf 481px —
   dezelfde 2,6 als op een laptop van 1280px. Er loopt op geen enkele breedte
   iets over, van 320px tot 1280px; dit is dus een advies en geen eis, en er
   wordt niemand tegengehouden. Wie alleen een telefoon heeft, kan door. */
.scherm-advies { font-style: italic; margin: 0 0 1.25rem; }

.tabel-wrap { overflow-x: auto; margin: 0 0 1.5rem; }
table.data {
  border-collapse: collapse;
  width: 100%;
  font-variant-numeric: tabular-nums;
}
table.data caption {
  text-align: left; font-weight: 700; padding: 0 0 0.6rem;
}
table.data th, table.data td {
  border-bottom: 2px solid var(--groen-licht);
  padding: 0.7rem 0.85rem;
  text-align: right;
  white-space: nowrap;
}
table.data thead th { background: var(--groen-licht); border-bottom-color: var(--groen-mid); }
table.data th[scope="row"], table.data thead th:first-child { text-align: left; white-space: normal; }
table.data tbody tr:nth-child(even) { background: var(--groen-bleek); }
table.data tr.totaal { font-weight: 700; }
/* De naam van de totaalregel van stap 2 staat in de tweede kolom, rechts
   uitgelijnd tegen het bedrag dat hij benoemt. */
table.data th.totaal-naam { text-align: right; white-space: nowrap; }
table.data tr.totaal th, table.data tr.totaal td { border-top: 3px solid var(--groen-mid); }
table.data td.gekozen, table.data thead th.gekozen {
  background: var(--groen-licht); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--groen-mid), inset -3px 0 0 var(--groen-mid);
}
/* Haak voor losse woorden die alleen op de afdruk horen te staan. */
.alleen-afdruk { display: none; }

/* Het blok met de ingevulde gegevens onder aan de afdruk. Op het scherm staat
   die invoer al op de stappen zelf, dus daar is het blok overbodig; op papier
   is het juist het enige dat de cijfers hun uitgangspunt geeft. */
.afdruk-kop { display: none; }

/* --- Controlescherm ----------------------------------------------------
   Het palet kent geen rood. Een afwijking wordt daarom met vorm en gewicht
   gemeld, niet met kleur: een dikke rand, vette tekst en de woorden zelf.
   Dat leest ook zonder kleurwaarneming. Wilt u hier toch een signaalkleur,
   dan hoort die eerst door de contrasttoets in test/browser.mjs. */

.ctrl-tabel td .rap-hint, .ctrl-tabel th .rap-hint {
  display: block; font-size: var(--txt-s); font-weight: 400;
}
.ctrl-tabel td { white-space: normal; }
/* Breekt een regelnaam over twee regels af, dan zouden gecentreerde cellen de
   bedragen ernaast omlaag duwen en niet meer uitlijnen met het verschil, dat
   zelf uit twee regels bestaat. Bovenaan uitlijnen zet alle eerste regels op
   dezelfde hoogte: de drie bedragen naast elkaar, het percentage eronder. */
.ctrl-tabel th, .ctrl-tabel td { vertical-align: top; }
.leeg { font-style: italic; }

/* --- Gegevensscherm ---------------------------------------------------- */

.rap-kop { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
.rap-kop:first-child { margin-top: 0; }
table.rap { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-variant-numeric: tabular-nums; }
table.rap th, table.rap td {
  border-bottom: 1px solid var(--groen-licht);
  padding: 0.6rem 0.85rem; vertical-align: top; text-align: left;
}
table.rap td { text-align: right; white-space: nowrap; }
table.rap thead th { background: var(--groen-licht); text-align: right; }
table.rap thead th:first-child { text-align: left; }
table.rap th[scope="row"] { font-weight: 400; width: 55%; }
table.rap .rap-label { font-weight: 700; display: block; }
table.rap .rap-hint { display: block; font-size: var(--txt-s); font-weight: 400; }
table.rap .rap-sub { padding-left: 1.5rem; display: block; }
table.rap tr.tot { font-weight: 700; }
table.rap tr.tot th, table.rap tr.tot td { border-top: 2px solid var(--groen-mid); }
.rap-noot { font-size: var(--txt-s); margin: 0 0 1rem; }
/* De voorbehoudregel stond tussen twee streepjes: haar eigen bovenrand en
   die van de knoppenrij eronder. Zij krijgt nu hetzelfde groene kader als de
   andere noten op deze schermen; de lijn boven de knoppenrij blijft, want
   die scheidt de inhoud van de bediening op elk scherm. */
.rap-voetnoot {
  font-size: var(--txt-s); font-weight: 700;
  background: var(--groen-bleek); border: 2px solid var(--groen-licht);
  border-radius: var(--radius); padding: 0.9rem 1.1rem; margin: 1.5rem 0 0;
}

/* --- Voet -------------------------------------------------------------- */

.voet {
  border-top: 2px solid var(--groen-licht);
  background: var(--wit);
  padding: 1.5rem 1.25rem;
}
.voet-binnen { max-width: var(--max); margin: 0 auto; font-size: var(--txt-s); }
/* Ruime raakvlakken: de links staan op één regel, maar krijgen elk genoeg
   hoogte om met een vinger te raken. */
.voet-meta { margin: 0; display: flex; flex-wrap: wrap; gap: 0 0.5rem; align-items: center; }
.voet a { color: var(--groen-donker); display: inline-block; padding: 0.5rem 0.2rem; }
.voet .uit { margin-left: 0.2em; text-decoration: none; }

/* --- Smalle schermen --------------------------------------------------- */

@media (max-width: 40rem) {
  :root { --txt-l: 20px; }
  .kop-band { padding: 1.1rem 1rem; }
  .kop-band h1 { font-size: 1.35rem; }
  .romp { padding: 1.1rem 1rem 2.5rem; }
  .kaart { padding: 1.15rem; border-radius: var(--radius); }
  .knoprij > .knop { flex: 1 1 100%; }
  .knop-volgende { margin-left: 0; order: -1; }
  input[type="number"], input[type="text"], select, .geld-wrap { max-width: none; }
  .datum-dag input, .datum-jaar input, .datum-maand select { width: 100%; }
  /* 5rem (80px) knipte het woord "dag" af; de lijst heeft met het pijltje
     erbij 89px nodig. 6rem geeft dat met een kleine marge, en blijft duidelijk
     smaller dan de maandlijst. Drie keuzelijsten naast elkaar passen niet:
     "september" maakt de maandlijst 148px, en samen vragen ze 359px tegen
     357px op de breedste iPhone — gemeten 01-11-2026. Jaar wikkelt daarom
     naar de tweede regel, en bij 200% tekst staan ze alle drie onder elkaar. */
  .datum-dag { flex: 0 0 6rem; }
  .datum-maand { flex: 1 1 8rem; }
  .datum-jaar { flex: 1 1 100%; }
  table.data th, table.data td { padding: 0.55rem 0.4rem; font-size: var(--txt-s); }
  table.data thead th { font-size: var(--txt-s); }
  table.rap th, table.rap td { padding: 0.5rem 0.45rem; }
  .tabel-wrap[tabindex] {
    border: 2px dashed var(--groen-mid); border-radius: var(--radius); padding: 0.25rem;
  }
  table.rap th[scope="row"] { width: auto; }
}

/* Zeer smal: tabellen stapelen, zodat niemand horizontaal hoeft te schuiven. */
@media (max-width: 30rem) {
  table.stapel, table.stapel tbody, table.stapel tr, table.stapel th, table.stapel td { display: block; }
  table.stapel thead { display: none; }
  /* `:not(.sr-only)`: zonder dat maakt `width: 100%` een onzichtbare,
     absoluut gepositioneerde caption alsnog schermbreed, en schuift de
     pagina horizontaal. */
  table.stapel caption:not(.sr-only) { display: block; width: 100%; }
  table.stapel tr {
    border: 2px solid var(--groen-licht); border-radius: var(--radius);
    margin: 0 0 0.6rem; padding: 0.35rem 0.6rem; background: var(--wit);
  }
  table.stapel tbody tr:nth-child(even) { background: var(--wit); }
  table.stapel th[scope="row"] {
    border: 0; padding: 0.35rem 0; font-weight: 700; text-align: left; background: none;
  }
  table.stapel td {
    border: 0; border-top: 1px solid var(--groen-licht);
    padding: 0.4rem 0; text-align: right;
    display: flex; gap: 1rem; justify-content: space-between; align-items: baseline;
  }
  /* Gestapeld is de lege eerste cel van de totaalregel alleen een lege regel. */
  table.stapel td.totaal-leeg { display: none; }
  table.stapel th.totaal-naam { text-align: left; white-space: normal; }
  table.stapel td::before {
    content: attr(data-k); text-align: left; font-size: var(--txt-s); font-weight: 400;
  }
  table.rap.stapel th[scope="row"] { padding-bottom: 0.15rem; }
  table.rap.stapel .rap-hint { font-weight: 400; }
  table.stapel td.gekozen { box-shadow: none; border-left: 5px solid var(--groen-mid); padding-left: 0.5rem; }
  table.stapel tr.totaal, table.stapel tr.tot {
    background: var(--groen-licht); border-color: var(--groen-mid);
  }
  .tabel-wrap[tabindex] { border: 0; padding: 0; }
  table.rap.stapel th[scope="row"] { width: auto; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* --- Afdrukken --------------------------------------------------------- */

@media print {
  body { background: var(--wit); font-size: 11pt; }
  .kop-band { background: var(--wit); color: var(--groen-donker); padding: 0 0 0.5cm; border-bottom: 2pt solid var(--groen-donker); }

  /* `.scherm-advies` gaat niet mee de printer in: het advies gaat over het
     scherm waarop gelezen wordt, en op papier is het onzin. */
  .skiplink, .knoprij, .voortgang, .kop-knoppen, .scherm-advies { display: none !important; }
  .alleen-afdruk { display: inline; font-weight: 700; }
  /* Het gegevensblok begint op een nieuwe pagina, zodat de vergelijking niet
     halverwege wordt afgebroken en het blok als geheel bij elkaar blijft. */
  .afdruk-kop {
    display: block; page-break-before: always; break-before: page;
    margin-top: 0; padding-top: 0;
  }
  .afdruk-kop h2 { font-size: 1.15rem; margin: 0 0 0.3cm; }
  .afdruk-kop p { margin: 0 0 0.4cm; font-size: 10pt; }
  .afdruk-kop th[scope="row"] { font-weight: 400; width: 55%; }
  .romp { max-width: none; padding: 0.5cm 0; }
  .kaart { border: 0; padding: 0; }
  table.data, table.rap { page-break-inside: auto; }
  tr, .noot { page-break-inside: avoid; }
  .rap-kop { page-break-after: avoid; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 9pt; }
}

/* De knoppen bij een wijziging zijn GEEN navigatie. `.knoprij` draagt een
   streep en 2rem ruimte omdat zij de onderkant van een scherm markeert; dat
   tussen elke trede herhalen hakt het scherm in stukken. En zij krijgen de
   tweede stijl: een knop die een wijziging weggooit hoort niet dezelfde
   nadruk te hebben als Volgende. */
/* --- De invoertabel van stap 2 ------------------------------------------
   Eén tabel per reeks bedragen (pensioen, partnerpensioen): per regel de
   periode, de leeftijd waarop het bedrag ingaat, en het bedrag. Het is een
   raster en geen <table>: de cellen zijn invoervelden met elk hun eigen label,
   en op een smal scherm moeten ze onder elkaar kunnen vallen zonder dat een
   schermlezer een tabel van één kolom voorgelezen krijgt. */
.reeks { margin: 0 0 1.5rem; }
/* Sinds de intro-alinea van stap 2 weg is, volgt de eerste tabel direct op de
   titel; zonder deze regel staat haar naam er strak tegenaan. */
h2 + .reeks { margin-top: 1rem; }
/* De naam van de reeks. Kleiner dan `.groep-kop`, de UPO erboven. */
.reeks-naam { font-size: 1.05rem; line-height: 1.25; margin: 0 0 0.5rem; }
.reeks-rij {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 11.5rem 11.5rem 6.75rem;
  gap: 0 1rem;
}
.reeks-kop {
  background: var(--groen-licht); border-bottom: 2px solid var(--groen-mid);
  padding: 0.5rem 0.75rem; font-size: var(--txt-s); font-weight: 700;
}
.reeks-rij {
  align-items: start;
  padding: 0.8rem 0.75rem; border-bottom: 1px solid var(--groen-licht);
}
.reeks-periode { font-weight: 700; align-self: center; }
/* De leeftijd heeft kleine labels ("Jaar", "Maanden") boven haar keuzelijsten
   en een regel eronder ("Dat is ..."). Het bedrag en de knop ernaast zakken
   precies de hoogte van dat labeltje, zodat de invoervakken van één regel op
   één lijn staan, wat er ook onder de keuzelijsten bij komt. */
.reeks-rij[data-trede] .reeks-bedrag, .reeks-rij[data-trede] .reeks-actie,
.reeks-rij[data-nptrede] .reeks-bedrag, .reeks-rij[data-nptrede] .reeks-actie {
  padding-top: calc(var(--txt-s) * var(--rij) + 0.25rem);
}
.reeks-actie .knop { min-height: var(--veld-hoogte); }
.reeks-bedrag .geld-wrap { max-width: none; }
.reeks-leeftijd { border: 0; padding: 0; margin: 0; min-width: 0; }
.reeks-leeftijd .datum-rij { flex-wrap: nowrap; gap: 0.5rem; }
.reeks-leeftijd .datum-deel { flex: 1 1 0; min-width: 0; }
.reeks-leeftijd select { width: 100%; max-width: none; }
.reeks-actie .knop { width: 100%; padding: 0.5rem 0.6rem; }
/* De afgeleide datum en een melding horen bij de hele regel. */
.reeks-rij .trede-tevroeg { grid-column: 1 / -1; margin: 0.6rem 0 0; }
.reeks + .trede-knoppen, .reeks .trede-knoppen { margin: 0.75rem 0 0; }
@media (max-width: 48rem) {
  /* Smal: de periode boven, daaronder leeftijd en bedrag, dan de knop. */
  .reeks-kop { display: none; }
  .reeks-rij { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem 0.75rem; }
  .reeks-periode { grid-column: 1 / -1; }
  .reeks-grens:empty { display: none; }
  .reeks-grens:empty + .reeks-bedrag { grid-column: 1 / -1; }
  .reeks-actie { grid-column: 1 / -1; }
  .reeks-actie:empty { display: none; }
  .reeks-actie .knop { width: auto; min-height: 0; }
  .reeks-rij[data-trede] .reeks-actie, .reeks-rij[data-nptrede] .reeks-actie { padding-top: 0; }
}
@media (max-width: 30rem) {
  .reeks-rij[data-trede] .reeks-bedrag, .reeks-rij[data-nptrede] .reeks-bedrag { padding-top: 0; }
}
@media (max-width: 30rem) {
  .reeks-rij { grid-template-columns: minmax(0, 1fr); }
}

.trede-knoppen { margin: 0.9rem 0 0; }
.trede-knoppen .knop { padding: 0.5rem 1.1rem; }

/* --- InvaarPlus: alles op één telefoonscherm ------------------------ */
body.schatter { --veld-hoogte: 2.75rem; }
.schatter .skiplink { display: none; }
.schatter .kop-binnen { gap: 0.5rem 2rem; }
.schatter .kop-sub { margin-top: 0.1rem; }
.schatter .knop-kop { min-height: 2.4rem; padding: 0.25rem 0.9rem; font-size: var(--txt-s); }
.schatter .kop-band { padding-top: 0.6rem; padding-bottom: 0.6rem; }
.schatter .kop-band h1 { font-size: 1.3rem; }
.schatter .kop-waarschuwing { margin-top: 0.1rem; }
.schatter .romp { padding: 0.75rem 0.75rem 0.75rem; }
.schatter .kaart { padding: 1rem; }
.rooster { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 0.75rem; }
.vak { min-width: 0; }
.vak.breed { grid-column: 1 / -1; }
.vak-kop { display: block; font-weight: 700; font-size: var(--txt-s); margin: 0 0 0.2rem; }
.paar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.rooster select, .rooster input[type="text"] { max-width: none; min-width: 0; padding-top: 0.35rem; padding-bottom: 0.35rem; }
.paar .keuzeknop { min-width: 0; padding: 0.35rem 0.5rem; }
.uitkomst { margin: 0.8rem 0 0.7rem; padding-top: 0.7rem; border-top: 2px solid var(--groen-licht); }
.uit-lijn { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; white-space: nowrap; }
.uit-naam { font-weight: 700; }
.uit-getal { font-weight: 700; }
.uit-getal .uit-pm { font-size: clamp(1.1rem, 6vw, 1.5rem); }
.uit-getal #uit-kop { font-size: clamp(1.4rem, 7.5vw, 2rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.uit-melding { margin: 0.6rem 0; font-size: var(--txt-s); }
.knoprij-schatter { margin: 0; }
.schatter .kaart-intro { margin-bottom: 0.8rem; }
.schatter .tabel-wrap { margin-bottom: 0.6rem; }
table.data.smal th, table.data.smal td { padding: 0.5rem 0.6rem; }
/* Uw schatting: een ring om het getal, niet een gekleurde cel. */
table.data td .uw {
  display: inline-block; font-weight: 700; padding: 0.1rem 0.5rem; margin: -0.2rem -0.6rem -0.2rem 0;
  border: 2px solid var(--groen-donker); border-radius: 999px; background: var(--wit);
}
.legenda { font-size: var(--txt-s); margin: 0 0 0.9rem; }
.schatter .lange-tekst p { font-size: var(--txt-s); margin-bottom: 0.7rem; }
.schatter .priv-kaart { padding: 0.8rem 0.9rem; font-size: var(--txt-s); }
.schatter .priv-kaarten, .schatter .lange-tekst { margin-bottom: 1rem; }
</style>

<script>
/**
 * De eenvoudige versie: alleen opzoeken, geen rekenkern.
 *
 * `InvaarOpzoek.maak(T)` krijgt de tabel uit `bouw/eenvoudig-tabel.mjs` en
 * geeft functies terug die er de verhoging volgens de indexatiemethode uit
 * aflezen. Wat hier nog aan rekenwerk staat:
 *
 *   - lineair interpoleren tussen twee tabelrijen (leeftijd, leeftijdsverschil);
 *   - pensioen en partnerpensioen wegen met hun kapitaalwaarde uit de tabel;
 *   - vermenigvuldigen met het aandeel bij de dekkingsgraad (ook uit de tabel).
 *
 * Geen sterftetafel, geen rentecurve, geen lijfrente: die zitten in de getallen.
 * Dit bestand raakt het scherm niet aan en draait daarom ook in Node; de proef
 * laadt precies dit bestand en legt het naast de volledige keten.
 */
var InvaarOpzoek = (function () {
  'use strict';

  function maak(T) {
    function lin(a, b, f) { return a + (b - a) * f; }

    /** Leeftijd in jaren op 1 januari 2027 bij een geboortemaand; midden van de maand. */
    function leeftijd(jaar, maand) {
      return ((2027 - jaar) * 12 - (maand - 1) - 0.5) / 12;
    }

    /** null als de tabel dit geval dekt, anders de reden. */
    function buitenBereik(x, verschil) {
      if (!(x >= T.xmin)) return 'TE_JONG';
      if (!(x < T.xmax)) return 'TE_OUD';
      if (verschil !== null && verschil !== undefined) {
        if (!(verschil >= T.dmin)) return 'PARTNER_TE_JONG';
        if (!(verschil < T.dmax)) return 'PARTNER_TE_OUD';
      }
      return null;
    }

    /** Kapitaalwaarde van 1 euro pensioen, bij pi-index i. */
    function kvPensioen(g, x, i) {
      var lo = Math.floor(x), R = T.op[g];
      return lin(R[lo - T.xmin][i], R[lo + 1 - T.xmin][i], x - lo);
    }

    /** Kapitaalwaarde van 1 euro partnerpensioen, bij pi-index i. */
    function kvPartner(g, x, verschil, i) {
      var lo = Math.floor(x), f = x - lo;
      var dlo = Math.floor(verschil), fd = verschil - dlo, R = T.np[g];
      var q = function (xx, dd) { return R[xx - T.xmin][dd - T.dmin][i]; };
      return lin(lin(q(lo, dlo), q(lo + 1, dlo), f), lin(q(lo, dlo + 1), q(lo + 1, dlo + 1), f), fd);
    }

    /**
     * De waarde van 100% van de verwachte indexatie, als fractie van de
     * kapitaalwaarde nu. `geval` = {g, x, partner: null | {verschil, deel}},
     * waarin deel = partnerpensioen / pensioen.
     */
    function volleIndexatie(geval, i) {
      var nu = kvPensioen(geval.g, geval.x, 0);
      var straks = kvPensioen(geval.g, geval.x, i);
      var p = geval.partner;
      if (p && p.deel > 0) {
        nu += p.deel * kvPartner(geval.g, geval.x, p.verschil, 0);
        straks += p.deel * kvPartner(geval.g, geval.x, p.verschil, i);
      }
      return straks / nu - 1;
    }

    /** Aandeel van de verwachte indexatie bij een dekkingsgraad in hele procenten. */
    function aandeel(dg) { return T.aandeel[dg]; }

    /** De verhoging (fractie) bij dekkingsgraad dg (hele procenten) en pi-index i. */
    function verhoging(geval, dg, i) {
      return aandeel(dg) * volleIndexatie(geval, i);
    }

    return {
      leeftijd: leeftijd, buitenBereik: buitenBereik, kvPensioen: kvPensioen, kvPartner: kvPartner,
      volleIndexatie: volleIndexatie, aandeel: aandeel, verhoging: verhoging,
    };
  }

  return {maak: maak};
})();

</script>
<script>
/**
 * Het scherm van InvaarPlus. Eén formulier met de schatting, en een
 * tweede pagina met de gevoeligheid. Alle getallen komen uit `InvaarOpzoek` (zie eenvoudig-opzoek.js);
 * dit bestand leest alleen de invoer en zet de uitkomst neer.
 */
(function () {
  'use strict';

  var T = INVAAR_TABEL;
  var Z = InvaarOpzoek.maak(T);
  var MAANDEN = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli',
    'augustus', 'september', 'oktober', 'november', 'december'];
  var FONDS_I = T.pi.indexOf(T.piFonds);

  var DGS = [125, 130, 135, 140, 145];
  var v = {scherm: 'hoofd', g: '', gj: '', gm: '', dg: '135', partner: 'nee', pj: '', pm: '', deel: '70'};

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /** 0.2304 -> "23,0%" */
  function pct(f, dec) { return (f * 100).toFixed(dec === undefined ? 1 : dec).replace('.', ',') + '%'; }
  function naarGetal(s) {
    var t = String(s).trim().replace('%', '').replace(',', '.');
    if (t === '' || !/^\d+(\.\d+)?$/.test(t)) return null;
    return Number(t);
  }
  function jarenEnMaanden(x) {
    var m = Math.floor(x * 12 + 1e-9);
    return Math.floor(m / 12) + ' jaar en ' + (m % 12) + (m % 12 === 1 ? ' maand' : ' maanden');
  }

  function opties(waarden, gekozen, namen) {
    return waarden.map(function (w, i) {
      return '<option value="' + w + '"' + (String(w) === String(gekozen) ? ' selected' : '') + '>' +
        esc(namen ? namen[i] : w) + '</option>';
    }).join('');
  }
  function reeks(van, tot, stap) { var r = []; for (var i = van; stap > 0 ? i <= tot : i >= tot; i += stap) r.push(i); return r; }

  /** Twee knoppen naast elkaar, samen één vak breed. */
  function knoppen(id, veld, label, keuzes) {
    return '<div class="vak"><span class="vak-kop" id="' + id + '-kop">' + esc(label) + '</span>' +
      '<div class="paar" role="group" aria-labelledby="' + id + '-kop">' +
      keuzes.map(function (k) {
        var aan = v[veld] === k[0];
        return '<button type="button" class="keuzeknop' + (aan ? ' aan' : '') + '" id="' + id + '-' + k[0] +
          '" data-veld="' + veld + '" data-waarde="' + k[0] + '" aria-pressed="' + (aan ? 'true' : 'false') + '">' +
          esc(k[1]) + '</button>';
      }).join('') + '</div></div>';
  }
  /** Maand en jaar naast elkaar, over de volle breedte. */
  function maandJaar(id, label, veldM, veldJ, jaarVan, jaarTot) {
    return '<div class="vak breed"><span class="vak-kop" id="' + id + '-kop">' + esc(label) + '</span>' +
      '<div class="paar" role="group" aria-labelledby="' + id + '-kop">' +
      '<select id="' + id + '-m" data-veld="' + veldM + '" aria-label="Maand"><option value="">maand</option>' +
      opties(reeks(1, 12, 1), v[veldM], MAANDEN) + '</select>' +
      '<select id="' + id + '-j" data-veld="' + veldJ + '" aria-label="Jaar"><option value="">jaar</option>' +
      opties(reeks(jaarTot, jaarVan, -1), v[veldJ]) + '</select></div></div>';
  }

  function formulier() {
    var h = '<div class="rooster">' +
      maandJaar('in-g', 'Geboren', 'gm', 'gj', 1931, 1971) +
      knoppen('in-geslacht', 'g', 'Geslacht', [['M', 'Man'], ['V', 'Vrouw']]) +
      '<div class="vak"><label class="vak-kop" for="in-dg">Dekkingsgraad</label>' +
      '<select id="in-dg" data-veld="dg">' + opties(DGS, v.dg, DGS.map(function (d) { return d + '%'; })) + '</select></div>' +
      knoppen('in-partner', 'partner', 'Partnerpensioen', [['ja', 'Ja'], ['nee', 'Nee']]);
    if (v.partner === 'ja') {
      h += '<div class="vak"><label class="vak-kop" for="in-deel">% van uw pensioen</label>' +
        '<input type="text" id="in-deel" data-veld="deel" inputmode="decimal" autocomplete="off" value="' + esc(v.deel) + '"></div>' +
        maandJaar('in-p', 'Partner geboren', 'pm', 'pj', 1915, 1990);
    }
    return h + '</div>';
  }

  /** Leest de invoer; geeft {geval} of {melding}. */
  function lees() {
    if (!v.gm || !v.gj || !v.g) return {melding: 'Vul geboortemaand, -jaar en geslacht in.'};
    var x = Z.leeftijd(Number(v.gj), Number(v.gm));
    var geval = {g: v.g, x: x, partner: null};
    var verschil = null;
    if (v.partner === 'ja') {
      if (!v.pm || !v.pj) return {melding: 'Vul geboortemaand en -jaar van uw partner in.'};
      var deel = naarGetal(v.deel);
      if (deel === null || deel > 200) return {melding: 'Vul het partnerpensioen in als % van uw pensioen.'};
      verschil = Z.leeftijd(Number(v.pj), Number(v.pm)) - x;
      geval.partner = {verschil: verschil, deel: deel / 100};
    }
    var buiten = Z.buitenBereik(x, verschil);
    if (buiten === 'TE_JONG') return {melding: 'Vanaf ' + T.xmin + ' jaar op 1 januari 2027.'};
    if (buiten === 'TE_OUD') return {melding: 'Tot ' + T.xmax + ' jaar op 1 januari 2027.'};
    if (buiten === 'PARTNER_TE_JONG') return {melding: 'Partner hooguit ' + (-T.dmin) + ' jaar jonger.'};
    if (buiten === 'PARTNER_TE_OUD') return {melding: 'Partner minder dan ' + T.dmax + ' jaar ouder.'};
    return {geval: geval};
  }

  function uitkomst() {
    var r = lees();
    if (r.melding) return '<div class="uitkomst" id="uit"><p class="uit-melding" id="uit-melding">' + esc(r.melding) + '</p></div>';
    var dg = Number(v.dg);
    return '<div class="uitkomst" id="uit"><p class="uit-lijn"><span class="uit-naam">Geschatte verhoging</span>' +
      '<span class="uit-getal"><span class="uit-pm" aria-hidden="true">\u00b1</span><span class="sr-only">ongeveer </span> <span id="uit-kop">' + pct(Z.verhoging(r.geval, dg, FONDS_I)) + '</span></span></p></div>';
  }

  function hoofd() {
    return '<section class="kaart">' + formulier() + uitkomst() +
      '<div class="paar knoppen-onder">' +
      '<button type="button" class="keuzeknop" id="knop-gevoelig" data-scherm="gevoelig">Gevoeligheid</button>' +
      '<button type="button" class="keuzeknop" id="knop-uitleg" data-scherm="uitleg">Uitleg</button></div></section>';
  }

  /** De tweede pagina: dezelfde schatting bij andere DG en andere indexatie. */
  function gevoeligheid() {
    var r = lees();
    var terug = '<p class="knoprij-schatter"><button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button></p>';
    if (r.melding) {
      return '<section class="kaart"><h2 id="pagina-kop" tabindex="-1">Gevoeligheid</h2>' +
        '<p class="uit-melding" id="uit-melding">' + esc(r.melding) + '</p>' + terug + '</section>';
    }
    var g = r.geval, dg = Number(v.dg);
    var kolommen = [];
    for (var i = 1; i < T.pi.length; i++) kolommen.push(i);
    return '<section class="kaart" id="gevoelig"><h2 id="pagina-kop" tabindex="-1">Gevoeligheid</h2>' +
      '<p class="kaart-intro">Uw schatting bij een andere dekkingsgraad (DG) of indexatie.</p>' +
      '<div class="tabel-wrap"><table class="data smal" id="uit-tabel">' +
      '<thead><tr><th scope="col">DG</th>' +
      kolommen.map(function (i) { return '<th scope="col">' + pct(T.pi[i]) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      DGS.map(function (d) {
        return '<tr><th scope="row">' + d + '%</th>' +
          kolommen.map(function (i) {
            var uw = d === dg && i === FONDS_I, t = pct(Z.verhoging(g, d, i));
            return '<td id="c-' + d + '-' + i + '">' +
              (uw ? '<span class="uw" id="uw-schatting">' + t + '</span><span class="sr-only"> (uw schatting)</span>' : t) + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="legenda">Omcirkeld: uw schatting.</p>' + terug + '</section>';
  }

  function uitleg() {
    return '<section class="kaart"><h2 id="pagina-kop" tabindex="-1">Uitleg</h2><div class="lange-tekst">' +
      '<p>Een schatting volgens de indexatiemethode, afgelezen uit een tabel die met de volledige InvaarVergelijker is gemaakt. ' +
      'De werkelijke verhoging hangt af van de dekkingsgraad bij het invaren en de berekening van het fonds.</p>' +
      '<p>Uitgegaan is van één levenslang pensioen vanaf 1 januari 2027 en een partner van het andere geslacht. ' +
      'Hoog/laag, partnerpensioen in perioden en AOW-compensatie zitten er niet in.</p>' +
      '</div>' +
      '<p class="knoprij-schatter"><button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button></p></section>';
  }

  /* De teksten van Privacy en Disclaimer zijn letterlijk die van de
     InvaarVergelijker (ui/ui.js, schermPrivacy en schermDisclaimer). Wijzigt
     daar iets, neem het hier over. */
  function privKaart(titel, inhoud, uitgelicht) {
    return '<div class="priv-kaart' + (uitgelicht ? ' uitgelicht' : '') + '">' +
      '<h3>' + esc(titel) + '</h3><p>' + inhoud + '</p></div>';
  }
  function privacy() {
    return '<section class="kaart"><h2 id="pagina-kop" tabindex="-1">Privacy</h2>' +
      '<div class="priv-kaarten">' +
      privKaart('Geen invoer verlaat uw browser',
        esc('Deze calculator werkt volledig lokaal in uw browser. Alles wat u invult \u2014 ' +
          'uw leeftijd, uw jaarpensioen, de gegevens van uw partner en elk ander getal \u2014 ' +
          'blijft op uw eigen computer. Het wordt niet naar een server verstuurd, niet ' +
          'opgeslagen, niet met anderen gedeeld en niet gebruikt voor analyse of profilering. ' +
          'Het rekenen gebeurt in programmacode die met de pagina is meegestuurd. Sluit u het ' +
          'tabblad of de browser, dan zijn alle gegevens weg.'), true) +
      privKaart('Geen cookies, geen profilering',
        esc('De calculator plaatst geen cookies en bewaart niets in uw browser. Er worden geen ' +
          'persoonsgegevens verzameld, geen profielen opgebouwd, en u wordt niet over websites ' +
          'heen gevolgd. Voor het tellen van het aantal bezoeken gebruikt de pagina wel een ' +
          'privacyvriendelijke, anonieme teller.')) +
      privKaart('Anonieme bezoektelling (GoatCounter)',
        esc('Om te zien hoeveel mensen de calculator gebruiken, telt deze pagina bezoeken via ' +
          'GoatCounter: opensource, privacyvriendelijke webanalyse zonder cookies. ' +
          'GoatCounter bewaart geen IP-adressen en niet de volledige browseridentificatie. ' +
          'Er wordt niets in uw browser geplaatst: geen cookies, geen lokale opslag. ' +
          'Alleen opgetelde aantallen worden bewaard: hoe vaak een pagina is bekeken en ' +
          'via welke website u binnenkwam. Daarnaast bij benadering uw browsertype, ' +
          'besturingssysteem, schermgrootte en land. Dat land wordt afgeleid uit het ' +
          'IP-adres; dat adres zelf wordt niet bewaard. Deze gegevens zijn niet tot u ' +
          'te herleiden. ') +
        '<a href="https://www.goatcounter.com/help/privacy" target="_blank" rel="noopener">' +
        'Privacybeleid van GoatCounter</a>.') +
      privKaart('Hosting via GitHub Pages',
        esc('Deze calculator wordt gehost via GitHub Pages, een dienst van GitHub, Inc. ' +
          '(onderdeel van Microsoft). Haalt uw browser de pagina op, dan legt GitHub ' +
          'standaard servergegevens vast: uw IP-adres, uw browser, het tijdstip van het ' +
          'bezoek en welke bestanden zijn opgevraagd. Dat gebeurt voor de beveiliging en ' +
          'het beheer van de servers. Daar heeft de auteur geen invloed op. ') +
        '<a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" ' +
        'target="_blank" rel="noopener">Privacybeleid van GitHub</a>.') +
      '</div>' +
      '<p class="knoprij-schatter"><button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button></p></section>';
  }
  function disclaimer() {
    var alineas = [
      'De resultaten, berekeningen en overige informatie die via deze calculator ' +
      'worden verstrekt, zijn uitsluitend bedoeld ter informatie en dienen als indicatie.',
      'Hoewel de ontwikkelaar en aanbieder van deze calculator de grootst mogelijke ' +
      'zorgvuldigheid betracht bij de ontwikkeling, het onderhoud en de werking ervan, kan de ' +
      'juistheid, volledigheid, actualiteit en betrouwbaarheid van de verstrekte informatie en ' +
      'resultaten niet worden gegarandeerd.',
      'Aan de resultaten en informatie die door deze calculator worden verstrekt, kunnen geen ' +
      'rechten worden ontleend.',
      'Het gebruik van de calculator en de interpretatie en toepassing van de verstrekte ' +
      'resultaten geschieden voor eigen rekening en risico van de gebruiker. De gebruiker blijft ' +
      'zelf verantwoordelijk voor beslissingen en handelingen die op basis van deze resultaten ' +
      'worden genomen.',
      'De ontwikkelaar, tevens aanbieder van deze calculator, is voor zover wettelijk toegestaan ' +
      'niet aansprakelijk voor directe of indirecte schade, gevolgschade, financi\u00eble ' +
      'verliezen of andere nadelige gevolgen die voortvloeien uit het gebruik van de calculator, ' +
      'eventuele fouten of onjuistheden in de resultaten, technische storingen of beslissingen ' +
      'die op basis van de verstrekte informatie worden genomen.',
      'Deze beperking van aansprakelijkheid geldt uitsluitend voor zover de wet dit toestaat.'
    ];
    return '<section class="kaart"><h2 id="pagina-kop" tabindex="-1">Disclaimer en aansprakelijkheidsbeperking</h2>' +
      '<div class="lange-tekst">' +
      alineas.map(function (a) { return '<p>' + esc(a) + '</p>'; }).join('') +
      '</div>' +
      '<p class="knoprij-schatter"><button type="button" class="keuzeknop" id="knop-terug" data-scherm="hoofd">Terug</button></p></section>';
  }

  var app = document.getElementById('app');
  var terugNaar = 'knop-gevoelig';
  function teken(focusId) {
    document.body.className = 'schatter scherm-' + v.scherm;
    app.innerHTML = v.scherm === 'gevoelig' ? gevoeligheid() : v.scherm === 'uitleg' ? uitleg() :
      v.scherm === 'privacy' ? privacy() : v.scherm === 'disclaimer' ? disclaimer() : hoofd();
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
  }
  function alleenUitkomst() {
    var oud = document.getElementById('uit');
    var doos = document.createElement('div');
    doos.innerHTML = uitkomst();
    oud.parentNode.replaceChild(doos.firstChild, oud);
  }

  document.addEventListener('click', function (e) {
    var s = e.target.closest ? e.target.closest('button[data-scherm]') : null;
    if (s) {
      if (v.scherm === 'hoofd' || !app.contains(s)) terugNaar = s.id;
      v.scherm = s.getAttribute('data-scherm');
      teken(v.scherm === 'hoofd' ? terugNaar : 'pagina-kop');
      window.scrollTo(0, 0);
      return;
    }
    var k = e.target.closest ? e.target.closest('button[data-veld]') : null;
    if (!k) return;
    v[k.getAttribute('data-veld')] = k.getAttribute('data-waarde');
    teken(k.id);
  });
  app.addEventListener('change', function (e) {
    var el = e.target, veld = el.getAttribute && el.getAttribute('data-veld');
    if (!veld || el.tagName !== 'SELECT') return;
    v[veld] = el.value;
    alleenUitkomst();
  });
  app.addEventListener('input', function (e) {
    var el = e.target, veld = el.getAttribute && el.getAttribute('data-veld');
    if (!veld || el.tagName !== 'INPUT') return;
    v[veld] = el.value;
    alleenUitkomst();
  });

  teken(null);
})();
